<!doctype html><html><head><meta charset="utf-8"><title>Rooms icon options</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:760px;font-family:Inter,system-ui,sans-serif;color:#14203a;
 background:radial-gradient(700px 520px at 8% 8%,rgba(255,190,150,.65),transparent 70%),radial-gradient(640px 500px at 60% 30%,rgba(150,200,255,.6),transparent 70%),radial-gradient(620px 480px at 98% 10%,rgba(200,170,255,.6),transparent 70%),linear-gradient(160deg,#eef2fb,#e4eaf7)}
h1{position:absolute;left:40px;top:26px;font-size:22px;font-weight:600}
.sub{position:absolute;left:40px;top:58px;font-size:13px;color:rgba(20,32,58,.6)}
.wrap{position:absolute;left:40px;right:40px;top:100px;display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.c{display:flex;flex-direction:column;align-items:center;gap:14px}
.t{font-size:13px;font-weight:700}.d{font-size:11px;color:rgba(20,32,58,.6);margin-top:-8px;text-align:center;height:28px}
.rail{width:104px;padding:12px 8px;border-radius:32px;display:flex;flex-direction:column;gap:6px;align-items:center;
 background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.38));border:1px solid rgba(255,255,255,.9);box-shadow:0 16px 40px rgba(60,70,130,.22),inset 0 1px 0 #fff;backdrop-filter:blur(30px)}
.nv{width:84px;height:62px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:rgba(20,32,58,.6);position:relative}
.nv.act{background:rgba(255,255,255,.7);color:#14203a;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(0,0,0,.12)}
.bd{position:absolute;top:4px;right:16px;min-width:17px;height:17px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
svg{display:block}
</style></head><body>
<h1>Rooms nav icon options</h1><div class="sub">Rooms shown highlighted. Icons are stand-in drawings in the Material Design style; the real icons differ slightly in detail.</div>
<div class="wrap" id="w"></div>
<script>
const S=(p,w=1.9)=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
 bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
 therm:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
 shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
 music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
 more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'};
const R=[
 ['mdi:floor-plan','current','<rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 12h8M11 3v6M11 15v6M17 12h4M17 12v4"/>'],
 ['mdi:door-open','clear, distinct shape','<path d="M4 21V4a1 1 0 0 1 1-1h9l5 2v16"/><path d="M2 21h20M14 3v18"/><circle cx="11" cy="12.5" r=".9"/>'],
 ['mdi:view-grid-outline','tidy, minimal','<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>'],
 ['mdi:home-group','areas of the home','<path d="M2 14l4-3.2 4 3.2v6H2z"/><path d="M14 14l4-3.2 4 3.2v6h-8z"/><path d="M8 9.5 12 6l4 3.5"/>'],
 ['mdi:home-floor-0','house + floor line','<path d="m3 11 9-7 9 7"/><path d="M5 10v9h14v-9"/><path d="M2 21.5h20"/>'],
 ['mdi:door','simple closed door','<rect x="6" y="3" width="12" height="18" rx="1.5"/><circle cx="15" cy="12" r=".9"/><path d="M3 21h18"/>']];
const items=(r)=>[['Home',I.home],['Rooms',r],['Lights',I.bulb,1],['Climate',I.therm],['Security',I.shield,1],['Music',I.music],['More',I.more]];
document.getElementById('w').innerHTML=R.map(([n,d,p])=>`<div class="c"><div class="t">${n}</div><div class="d">${d}</div><div class="rail">${items(p).map(([l,ic,b])=>`<div class="nv ${l==='Rooms'?'act':''}">${S(ic)}${l}${b?'<i class="bd">'+(l==='Lights'?13:1)+'</i>':''}</div>`).join('')}</div></div>`).join('');
</script></body></html>
