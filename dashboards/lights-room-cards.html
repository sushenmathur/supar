<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lights – big room cards</title>
<style>
:root{--tx:#14203a;--tx2:rgba(20,32,58,.62);--bg:radial-gradient(900px 600px at 6% 8%,rgba(255,150,130,.7),transparent 62%),radial-gradient(800px 560px at 60% 12%,rgba(90,200,250,.7),transparent 62%),radial-gradient(760px 600px at 98% 70%,rgba(179,136,255,.7),transparent 62%),radial-gradient(700px 520px at 12% 98%,rgba(255,211,110,.6),transparent 62%),linear-gradient(160deg,#eef3ff,#e6ecfa);--soft:rgba(255,255,255,.5);--glass:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.22));--bd:rgba(255,255,255,.8);--hi:rgba(255,255,255,.95);--field:rgba(255,255,255,.55);--track:rgba(20,32,58,.12)}
body.dark{--tx:#fff;--tx2:rgba(255,255,255,.62);--bg:radial-gradient(900px 600px at 6% 8%,rgba(91,61,245,.55),transparent 62%),radial-gradient(800px 560px at 60% 12%,rgba(10,167,160,.45),transparent 62%),radial-gradient(760px 600px at 98% 70%,rgba(192,38,211,.45),transparent 62%),linear-gradient(160deg,#080d1e,#0f1730 55%,#0a1a26);--soft:rgba(255,255,255,.09);--glass:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04));--bd:rgba(255,255,255,.26);--hi:rgba(255,255,255,.4);--field:rgba(255,255,255,.1);--track:rgba(255,255,255,.16)}
*{box-sizing:border-box}body{margin:0;padding:18px 22px 40px;font-family:Roboto,system-ui,sans-serif;color:var(--tx);background:var(--bg) fixed;min-height:100vh}
.bar{max-width:1160px;margin:0 auto 10px;display:flex;gap:10px;font-size:13px}.bar button{font:inherit;border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto}h1{text-align:center;font-size:26px;margin:6px 0 14px}
.g{background:var(--glass);border:1px solid var(--bd);border-radius:30px;backdrop-filter:blur(20px) saturate(190%);box-shadow:inset 0 1px 0 var(--hi),0 12px 30px rgba(50,60,120,.18)}
.sum{display:flex;align-items:center;gap:22px;padding:14px 24px;margin-bottom:16px;flex-wrap:wrap}
.sum .n{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}.sum .n small{font-size:15px;font-weight:600;color:var(--tx2);letter-spacing:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 12px;border-radius:99px;background:var(--field);border:1px solid var(--bd);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}.pill i{width:8px;height:8px;border-radius:50%;background:var(--tx2);opacity:.45}.pill.l i{background:#f59e0b;opacity:1;box-shadow:0 0 8px #f59e0b}
.sp{flex:1}.btn{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:16px;padding:10px 16px;font:600 13px Roboto,system-ui;cursor:pointer}.btn.hot{background:linear-gradient(145deg,rgba(255,222,140,.95),rgba(255,170,70,.75));color:#2a1700}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.room{padding:18px;position:relative;overflow:hidden;transition:background .4s}
.room .warm{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(255,190,90,.55),transparent 65%);opacity:var(--w,0);transition:opacity .4s;pointer-events:none}
.room>*{position:relative}
.rh{display:flex;align-items:center;gap:12px}.ic{width:46px;height:46px;border-radius:16px;background:var(--field);display:grid;place-items:center}.rh b{font-size:17px}.rh span{display:block;font-size:12.5px;color:var(--tx2)}
.sw{margin-left:auto;width:50px;height:28px;border-radius:99px;background:rgba(127,127,127,.3);position:relative;cursor:pointer;transition:.2s}.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}.sw.on{background:#f59e0b}.sw.on:after{left:25px}
.sl{margin:18px 0 6px;display:flex;align-items:center;gap:12px}.sl .v{font-size:22px;font-weight:700;min-width:54px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;border-radius:15px;background:linear-gradient(90deg,#fbbf24 var(--p,0%),var(--track) var(--p,0%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:22px;border-radius:4px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);margin:0}
input[type=range]:disabled{opacity:.45;cursor:default}
.hint{font-size:11.5px;color:var(--tx2);margin:0 0 14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.c{display:flex;gap:7px;align-items:center;padding:9px 13px;border-radius:99px;background:var(--soft);border:1px solid var(--bd);font-size:13px;cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 var(--hi);transition:.2s}
.c i{width:9px;height:9px;border-radius:50%;background:var(--tx2);opacity:.4;flex:none}
.c.on{background:linear-gradient(145deg,rgba(255,222,140,.95),rgba(255,170,70,.75));color:#2a1700;font-weight:600;box-shadow:0 0 18px rgba(255,170,60,.45),inset 0 1px 0 var(--hi)}.c.on i{background:#7a3b00;opacity:1}
.c small{opacity:.7;font-weight:500}
.note{text-align:center;font-size:12.5px;color:var(--tx2);margin-top:14px}
</style></head><body>
<div class="bar"><b style="margin-right:auto;align-self:center">Lights page · big room cards</b><button id="dk">Dark mode</button><button id="rs">Reset</button></div>
<div class="wrap"><h1>Lighting</h1><div class="g sum" id="sum"></div><div class="rooms" id="rooms"></div>
<div class="note">Slider dims every light that is on in that room · switch turns the whole room on or off · tap a chip to toggle one light</div></div>
<script>
const R=[{k:'liv',n:'Living & Kitchen',ic:'M3 12V9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v3a2 2 0 0 1 2 2v4h-2v2h-2v-2H6v2H4v-2H2v-4a2 2 0 0 1 2-2Z'},{k:'hall',n:'Hallways & Bedrooms',ic:'M2 7v10h2v-3h16v3h2v-6a4 4 0 0 0-4-4H10v4H4V7Z'},{k:'out',n:'Garage & Outdoor',ic:'M4 21V9l8-6 8 6v12h-4v-8H8v8Z'}];
const D0=[['liv','Dining',0,1],['liv','Pendants',100,1],['liv','Kitchen Bench',52,1],['liv','Media Downlights',100,1],['liv','Lamp',0,0],['liv','Kitchen Downlights',1,0],
['hall','Corridor',0,0],['hall','Tall Lamp',88,1],['hall','Samar Night Light',59,1],['hall','Hallway Light',0,0],['hall','Bedroom Downlights',0,0],
['out','Garage Downlight',0,0],['out','Driveway Floodlight',0,0],['out','Door Downlight',0,0],['out','Outdoor Lights',1,0],['out','Patio Lights',0,0],['out','Backyard Spotlight',0,0],['out','Laundry Spotlight',0,0],['out','Festive Light',0,0]];
// [room,name,brightness,dimmable]; brightness 1 = on (not dimmable)
const mk=()=>D0.map((d,i)=>({id:i,a:d[0],n:d[1],on:d[2]>0,b:d[3]?(d[2]>1?d[2]:80):null,dim:!!d[3]}));
let L=mk();const $=id=>document.getElementById(id);
const on=a=>L.filter(l=>(!a||l.a===a)&&l.on),all=a=>L.filter(l=>!a||l.a===a);
const level=a=>{const d=on(a).filter(l=>l.dim);return d.length?Math.round(d.reduce((s,l)=>s+l.b,0)/d.length):(on(a).length?100:0)};
function render(){
 $('sum').innerHTML=`<div><div class="n">${on().length}<small> of ${all().length} lights on</small></div></div><div class="pills">${R.map(r=>`<div class="pill ${on(r.k).length?'l':''}"><i></i>${r.n.split(' ')[0]} ${on(r.k).length}/${all(r.k).length}</div>`).join('')}</div><div class="sp"></div><div class="btn" id="ao">🌙 Good Night</div><div class="btn hot" id="aoff">⏻ All off</div>`;
 $('rooms').innerHTML=R.map(r=>{const n=on(r.k).length,lv=level(r.k),dimmable=on(r.k).some(l=>l.dim);
  return `<div class="g room" style="--w:${n?(0.25+lv/100*0.75):0}"><div class="warm"></div>
  <div class="rh"><div class="ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="${r.ic}"/></svg></div><div><b>${r.n}</b><span>${n?`${n} of ${all(r.k).length} on`:'All off'}</span></div><div class="sw ${n?'on':''}" data-room="${r.k}"></div></div>
  <div class="sl"><input type="range" min="5" max="100" value="${lv||50}" ${dimmable?'':'disabled'} data-sl="${r.k}" style="--p:${lv}%"><div class="v">${dimmable?lv+'%':(n?'On':'Off')}</div></div>
  <div class="hint">${dimmable?'Dims the dimmable lights that are on':'Slider needs a dimmable light that is on'}</div>
  <div class="chips">${all(r.k).sort((x,y)=>y.on-x.on).map(l=>`<div class="c ${l.on?'on':''}" data-id="${l.id}"><i></i>${l.n}${l.on&&l.dim?` <small>${l.b}%</small>`:''}</div>`).join('')}</div></div>`}).join('');
 document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{const l=L[e.dataset.id];l.on=!l.on;if(l.on&&l.dim&&!l.b)l.b=80;render()});
 document.querySelectorAll('[data-room]').forEach(e=>e.onclick=()=>{const k=e.dataset.room,a=on(k).length>0;all(k).forEach(l=>{l.on=!a;if(l.dim&&!l.b)l.b=80});render()});
 document.querySelectorAll('[data-sl]').forEach(e=>{e.oninput=()=>{const v=+e.value;on(e.dataset.sl).filter(l=>l.dim).forEach(l=>l.b=v);e.style.setProperty('--p',v+'%');e.closest('.room').querySelector('.v').textContent=v+'%';e.closest('.room').style.setProperty('--w',.25+v/100*.75)};e.onchange=render});
 $('ao').onclick=()=>{L.forEach(l=>l.on=false);render()};$('aoff').onclick=()=>{L.forEach(l=>l.on=false);render()};
}
$('dk').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode'};
$('rs').onclick=()=>{L=mk();render()};render();
</script></body></html>
