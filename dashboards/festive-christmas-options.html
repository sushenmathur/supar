<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas greeting card – options</title>
<style>
body{margin:0;padding:22px;font-family:Roboto,system-ui,sans-serif;background:linear-gradient(135deg,#1b1740,#2b2160 55%,#4a2350);color:#fff;min-height:100vh}
h1{font-size:18px;margin:0 0 4px}p.s{font-size:13px;opacity:.75;margin:0 0 18px;max-width:760px}.opt{max-width:760px;margin:0 0 26px}.opt h2{font-size:14px;margin:0 0 4px}.opt small{display:block;opacity:.75;font-size:12.5px;margin-bottom:10px}
.card{position:relative;height:150px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(14,20,64,.9),rgba(40,30,100,.7));border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.35);padding:16px 24px 26px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.card .l div:first-child{font-size:12.5px;font-weight:600;opacity:.85}.card .t{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:4px}.card .r{display:grid;gap:6px;justify-items:end;position:relative;z-index:3}.card .r b{font-size:26px}.pill{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:600;margin-left:6px}
.l,.r{position:relative;z-index:3}.ly{position:absolute;inset:0;overflow:hidden;border-radius:28px;pointer-events:none;z-index:1}
.sf{position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,70px,0)}100%{transform:translate3d(-6px,160px,0)}}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.bulb{animation:bl 1.6s ease-in-out infinite}.bau{position:absolute;top:0;transform-origin:50% 0;animation:sw 4s ease-in-out infinite}
.row{position:absolute;left:150px;right:150px;bottom:2px;display:flex;justify-content:space-around;align-items:flex-end}
.mound{position:absolute;left:-10px;right:-10px;bottom:-26px;height:50px;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(#fff,#cfe1ff);opacity:.92;box-shadow:0 -4px 20px rgba(255,255,255,.35)}
.tw{animation:tw 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<h1>Christmas greeting card – three options</h1><p class="s">Replaces the Diwali scene. Same rules as before: shows only at night while the festive switch is on, and the card grows from 112px to 150px. Animations stop if reduced motion is on.</p>
<div id="o"></div>
<script>
const r=(i,s)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};const n=(c,f)=>Array.from({length:c},(_,i)=>f(i)).join('');
const body=`<div class="l"><div>Good evening · 16th November · Cloudy</div><div class="t">8:37 PM</div></div><div class="r"><div><b>22°</b></div><div><span class="pill">India 4:07 pm</span><span class="pill">Austin 4:37 am</span></div></div>`;
const snow=c=>n(c,i=>`<i class="sf" style="left:${r(i,9)*100}%;animation-duration:${5+r(i,10)*5}s;animation-delay:-${r(i,11)*8}s;transform:scale(${.6+r(i,12)})"></i>`);
const stars=c=>n(c,i=>`<i class="tw" style="position:absolute;left:${r(i,13)*100}%;top:${r(i,14)*55}%;width:3px;height:3px;border-radius:50%;background:#fff;animation-delay:-${r(i,15)*3}s"></i>`);
const COL=['#ef4444','#22c55e','#fbbf24','#ffffff'];
const wire=(h=26)=>`<svg style="position:absolute;left:0;top:0;width:100%;height:${h+6}px" viewBox="0 0 700 ${h+6}" preserveAspectRatio="none"><path d="M0 2 Q175 ${h} 350 2 Q525 ${h} 700 2" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>${n(18,i=>{const k=i%9,t=(k+.5)/9,x=(i<9?0:350)+350*t,y=2+(h-4)*2*t*(1-t)*1;return `<circle class="bulb" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${COL[i%4]}" style="animation-delay:-${(r(i,30)*2).toFixed(2)}s;filter:drop-shadow(0 0 5px ${COL[i%4]})"/>`})}</svg>`;
const bauble=(x,len,c,d)=>`<div class="bau" style="left:${x}%;animation-delay:-${d}s"><svg width="22" height="${len+24}" viewBox="0 0 22 ${len+24}"><line x1="11" y1="0" x2="11" y2="${len}" stroke="rgba(255,255,255,.6)"/><rect x="8" y="${len}" width="6" height="4" fill="#fbbf24"/><circle cx="11" cy="${len+14}" r="10" fill="${c}"/><circle cx="7" cy="${len+10}" r="3" fill="rgba(255,255,255,.55)"/></svg></div>`;
const gift=(i)=>{const c=[['#ef4444','#fbbf24'],['#22c55e','#ef4444'],['#fbbf24','#ef4444'],['#60a5fa','#fff']][i%4];return `<svg width="34" height="32" viewBox="0 0 34 32" style="transform:scale(${(.85+r(i,5)*.3).toFixed(2)});transform-origin:50% 100%"><rect x="4" y="12" width="26" height="18" rx="3" fill="${c[0]}"/><rect x="15" y="12" width="4" height="18" fill="${c[1]}"/><rect x="2" y="8" width="30" height="7" rx="3" fill="${c[0]}" stroke="rgba(255,255,255,.35)"/><rect x="15" y="8" width="4" height="7" fill="${c[1]}"/><path d="M17 8C10 0 6 6 12 8Zm0 0c7-8 11-2 5 0Z" fill="${c[1]}"/></svg>`};
const tree=()=>`<svg style="position:absolute;left:46%;bottom:0;height:134px" viewBox="0 0 90 134"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f9e5b"/><stop offset="1" stop-color="#136b3c"/></linearGradient></defs><polygon points="45,10 66,48 58,48 78,86 66,86 88,122 2,122 24,86 12,86 32,48 24,48" fill="url(#tg)" stroke="rgba(255,255,255,.18)"/><rect x="39" y="122" width="12" height="12" fill="#7a4a21"/><polygon class="tw" points="45,0 48,8 57,8 50,13 53,22 45,16 37,22 40,13 33,8 42,8" fill="#fde047" style="filter:drop-shadow(0 0 8px #fde047)"/>${n(14,i=>{const y=30+r(i,40)*88,half=(y-10)*0.34,x=45+(r(i,41)*2-1)*half*.85;return `<circle class="tw" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${COL[i%4]}" style="animation-delay:-${(r(i,42)*2).toFixed(2)}s;filter:drop-shadow(0 0 4px ${COL[i%4]})"/>`})}</svg>`;
const holly=(side)=>`<svg style="position:absolute;${side}:6px;top:4px;width:78px;height:60px;${side==='right'?'transform:scaleX(-1)':''}" viewBox="0 0 78 60"><path d="M4 8C16 0 30 4 34 16 22 18 10 16 4 8Z" fill="#16a34a"/><path d="M20 22C32 14 48 20 50 32 38 34 26 30 20 22Z" fill="#15803d"/><path d="M4 26C14 20 26 26 28 36 18 38 8 34 4 26Z" fill="#22c55e"/><circle cx="12" cy="20" r="5" fill="#ef4444" style="filter:drop-shadow(0 0 4px #ef4444)"/><circle cx="19" cy="25" r="4.5" fill="#dc2626"/><circle cx="14" cy="28" r="4" fill="#ef4444"/></svg>`;
const cane=`<div style="position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(135deg,#ef4444 0 10px,#fff 10px 20px);opacity:.9"></div>`;
function card(inner){return `<div class="card">${body}<div class="ly">${inner}</div></div>`}
document.getElementById('o').innerHTML=`
<div class="opt"><h2>Option A · Fairy lights, baubles and presents</h2><small>Red, green, gold and white lights blinking across the top, swinging baubles, snowfall, and a row of little wrapped presents along the bottom (the diya row, retold).</small>${card(snow(22)+wire()+bauble(4,10,'#ef4444',0)+bauble(94,16,'#fbbf24',1.4)+bauble(52,6,'#22c55e',.7)+`<div class="row">${n(7,gift)}</div>`)}</div>
<div class="opt"><h2>Option B · Christmas tree and snow</h2><small>A decorated tree with a glowing star and twinkling lights on the right, a soft snow bank, gentle snowfall and a few stars. More of a scene, less of a border.</small>${card(stars(10)+snow(26)+tree()+'<div class="mound"></div>')}</div>
<div class="opt"><h2>Option C · Candy cane border and holly</h2><small>A candy-cane stripe along the top edge, holly with red berries in both corners, a snow bank and twinkling stars. Classic and the lightest on movement.</small>${card(stars(14)+snow(16)+cane+holly('left')+holly('right')+'<div class="mound"></div>')}</div>`;
</script></body></html>
