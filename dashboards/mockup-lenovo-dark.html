<!doctype html><html><head><meta charset="utf-8"><title>B2 on Lenovo Idea Tab Pro (wall mount)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden;font-family:Inter,sans-serif}
.wall{position:absolute;inset:0;background:
 radial-gradient(900px 600px at 50% 40%,rgba(255,255,255,.55),transparent 70%),
 linear-gradient(180deg,#d9d2c7 0%,#cfc7ba 100%)}
.wall:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.012) 0 2px,transparent 2px 6px)}
.skirt{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(#efece6,#dcd7cd);box-shadow:0 -2px 6px rgba(0,0,0,.12)}
/* tablet 12.7in 16:10: body ~ 291x190mm. scale so screen = 1168x730 */
.tab{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:1260px;height:805px;border-radius:34px;
 background:linear-gradient(145deg,#8c9199,#6d727a 45%,#7d838b);padding:3px;
 box-shadow:0 60px 80px -20px rgba(40,30,20,.45),0 20px 30px rgba(40,30,20,.25),inset 0 0 0 1px rgba(255,255,255,.35)}
.bez{width:100%;height:100%;border-radius:31px;background:#05060a;padding:36px 46px 36px 46px;position:relative}
.scr{width:100%;height:100%;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.scr iframe{border:0;width:1600px;height:1000px;transform-origin:0 0;transform:scale(.7275)}
.cam{position:absolute;left:50%;top:15px;width:8px;height:8px;border-radius:50%;background:radial-gradient(#1b2a4a,#05070d);box-shadow:0 0 0 2px #10131b}
.glare{position:absolute;inset:36px 46px;border-radius:10px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10) 0,rgba(255,255,255,0) 32%)}
.cable{position:absolute;left:50%;top:calc(48% + 402px);width:10px;height:200px;margin-left:290px;background:linear-gradient(90deg,#1b1b1f,#3b3b42,#1b1b1f);border-radius:5px;box-shadow:2px 3px 4px rgba(0,0,0,.3)}
.cap{position:absolute;left:0;right:0;top:26px;text-align:center;color:rgba(40,30,20,.55);font-size:13px;letter-spacing:.04em}
</style></head><body>
<div class="wall"></div><div class="skirt"></div><div class="cable"></div>
<div class="tab"><div class="bez"><div class="cam"></div><div class="scr"><iframe src="option-b4-system.html?theme=dark" scrolling="no"></iframe></div><div class="glare"></div></div></div>
<div class="cap">Lenovo Idea Tab Pro · 12.7″ 16:10 · landscape wall mount · concept B4, dark mode (illustrative render)</div>
</body></html>
