              template: hud_hotspot
              entity: sensor.daily_import_cost
              tap_action:
                action: more-info
          hotspot_credit:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.daily_solar_credit
              tap_action:
                action: more-info
          hotspot_inout:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.sh50rs_a21c2106894_daily_grid_import
              tap_action:
                action: more-info
          hotspot_billtodate:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.electricity_bill_to_date
              tap_action:
                action: more-info
          hotspot_billest:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.electricity_estimated_bill
              tap_action:
                action: more-info
          hotspot_lastbill:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: input_number.electricity_last_bill
              tap_action:
                action: more-info
          hotspot_solar:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.sh50rs_a21c2106894_mppt_total_power
              tap_action:
                action: more-info
          hotspot_home:
            card:
              type: custom:button-card
              template: hud_hotspot
              tap_action:
                action: navigate
                navigation_path: /dashboard-hub/hubhome
          hotspot_tesla:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.bluey_battery_level
              tap_action:
                action: more-info
          hotspot_teslacost:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.tesla_grid_charging_cost_today
              tap_action:
                action: more-info
          hotspot_kia:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: input_number.kia_battery_estimate
              tap_action:
                action: more-info
          hotspot_kiacost:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.kia_grid_charging_cost_today
              tap_action:
                action: more-info
          hud: |
              [[[
              /* ---------- fonts (loaded once into the main document) ---------- */
              if (!document.getElementById('hud-fonts')) {
                const l = document.createElement('link');
                l.id = 'hud-fonts'; l.rel = 'stylesheet';
                l.href = 'https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap';
                document.head.appendChild(l);
              }

              /* ---------- data ---------- */
              const st  = (e) => states[e] ? states[e].state : undefined;
              const num = (e) => { const v = parseFloat(st(e)); return isNaN(v) ? 0 : v; };
              const watts = (v) => (Math.abs(v) > 0 && Math.abs(v) < 50) ? v * 1000 : v;
              const kw  = (w) => Math.abs(w) >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W';
              const usd = (v) => '$' + Math.abs(v).toFixed(2);

              const solar = watts(num('sensor.sh50rs_a21c2106894_mppt_total_power'));
              const imp   = watts(num('sensor.sh50rs_a21c2106894_purchased_power'));
              const exp   = watts(num('sensor.sh50rs_a21c2106894_total_export_active_power'));
              const total = watts(num('sensor.home_power_consumption'));
              const tesla = watts(num('sensor.bluey_charger_power'));
              const kia   = watts(num('sensor.kia_charger_power'));
              const home  = Math.max(0, total - tesla - kia);
              const selfUse = num('sensor.sh50rs_a21c2106894_daily_self_consumption_rate');
              const teslaBatt = Math.round(num('sensor.bluey_battery_level'));
              const teslaRange = Math.round(num('sensor.bluey_battery_range'));
              const kiaBatt = Math.round(Math.abs(num('input_number.kia_battery_estimate')));
              const cost = num('sensor.daily_import_cost');
              const credit = num('sensor.daily_solar_credit');
              const net = num('sensor.daily_energy_net');
              const kwhIn = num('sensor.sh50rs_a21c2106894_daily_grid_import');
              const kwhOut = num('sensor.solar_export_energy_daily');
              const billToDate = num('sensor.electricity_bill_to_date');
              const billEst = num('sensor.electricity_estimated_bill');
              const billPct = billEst > 0 ? Math.min(100, billToDate / billEst * 100) : 0;
              const rate = num('sensor.current_energy_rate');
              const rateC = rate < 5 ? rate * 100 : rate;              // $/kWh -> c/kWh
              const night = st('sensor.dashboard_night_mode') === 'on';
              const SOLAR_MAX = 5000;                                   // inverter rating (W) for the solar ring
              const BILL_START_DAY = 17;                                // AGL billing period: 17th to the 16th

              /* billing period: from sensor.electricity_billing_day / _days_remaining when available,
                 else dates on the bill sensors' attributes, else a monthly period starting BILL_START_DAY */
              const DAY_MS = 86400000;
              const now = st('sensor.date_time_iso') ? new Date(st('sensor.date_time_iso')) : new Date();
              const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
              const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
              const billAttr = { ...((states['sensor.electricity_estimated_bill'] || {}).attributes || {}),
                                 ...((states['sensor.electricity_bill_to_date'] || {}).attributes || {}) };
              const attrDate = (...keys) => {
                for (const k of keys) { const d = billAttr[k] ? new Date(billAttr[k]) : null; if (d && !isNaN(d)) return d; }
                return null;
              };
              const bDay = parseFloat(st('sensor.electricity_billing_day'));
              const bLeft = parseFloat(st('sensor.electricity_days_remaining'));
              let pStart, pEnd;
              if (!isNaN(bDay) && bDay >= 1 && !isNaN(bLeft) && bLeft >= 0) {
                pStart = addDays(today0, -(Math.round(bDay) - 1));
                pEnd = addDays(today0, Math.round(bLeft));
              } else {
                pStart = attrDate('billing_period_start', 'period_start', 'bill_start', 'start_date', 'last_reset');
                pEnd = attrDate('billing_period_end', 'period_end', 'bill_end', 'end_date', 'next_reset');
                if (!pStart) {
                  pStart = new Date(now.getFullYear(), now.getMonth(), BILL_START_DAY);
                  if (pStart > now) pStart.setMonth(pStart.getMonth() - 1);
                }
                if (!pEnd) { pEnd = new Date(pStart); pEnd.setMonth(pEnd.getMonth() + 1); }
                // an end at midnight is the start of the next period, so show the day before
                if (pEnd.getHours() === 0 && pEnd.getMinutes() === 0) pEnd = new Date(pEnd.getTime() - DAY_MS);
              }
              const dmy = (d) => d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }).toUpperCase();
              const periodDays = Math.max(1, Math.round((pEnd - pStart) / DAY_MS) + 1);
              const periodDay = Math.min(periodDays, Math.max(1, Math.floor((now - pStart) / DAY_MS) + 1));

              /* previous bill (stored at each period end by packages/electricity_bill_history.yaml) */
              const lastBill = num('input_number.electricity_last_bill');
              const vsLast = lastBill > 0 ? (billEst - lastBill) / lastBill * 100 : null;
              const periodTxt = `${dmy(pStart)} – ${dmy(pEnd)}`;

              const w = states['weather.north_lakes_weather'];
              const temp = w && w.attributes.temperature !== undefined ? w.attributes.temperature + '°' : '—';
              const cond = w ? w.state.replace('partlycloudy', 'partly cloudy').replace(/-/g, ' ') : '';
              const time = st('sensor.time') || '';
              const date = st('sensor.date_time_iso')
                ? new Date(st('sensor.date_time_iso')).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase()
                : '';

              /* ---------- palette ---------- */
              const C = { solar: '#FFB547', grid: '#22D3EE', home: '#B388FF', ev: '#4D9FFF',
                          cost: '#FF5C7A', credit: '#4DFFB8', text: '#E6F1FF', muted: '#9DB0CF' };
              const battC = (b) => b > 50 ? C.credit : b > 20 ? C.solar : C.cost;

              /* ---------- actions ---------- */
              // Taps are handled by invisible button-cards laid over each panel (see the hotspot_* custom
              // fields in the card config), because button-card strips inline event handlers from HTML.
              const info = () => '';
              const go = () => '';

              /* ---------- drawing helpers ---------- */
              const BOXES = [];
              const glass = (x, y, w, h, c, a = .28, dy = 0) => {
                BOXES.push(`<rect x="${x}" y="${y + dy}" width="${w}" height="${h}" rx="16"/>`);
                return `
                  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="rgba(6,14,34,.58)" stroke="${c}" stroke-opacity="${a}"/>
                  <path d="M${x} ${y + 18} V${y + 8} Q${x} ${y} ${x + 8} ${y} H${x + 18}" fill="none" stroke="${c}" stroke-width="2"/>
                  <path d="M${x + w} ${y + h - 18} V${y + h - 8} Q${x + w} ${y + h} ${x + w - 8} ${y + h} H${x + w - 18}" fill="none" stroke="${c}" stroke-width="2"/>`;
              };
              const ring = (cx, cy, r, c, pct, sw = 7) => {
                const L = 2 * Math.PI * r;
                return `
                  <circle cx="${cx}" cy="${cy}" r="${r + 9}" fill="none" stroke="${c}" stroke-opacity=".35" stroke-dasharray="2 6" class="spin"/>
                  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-opacity=".18" stroke-width="${sw}"/>
                  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"
                          stroke-dasharray="${(L * Math.max(0, Math.min(1, pct))).toFixed(1)} ${L.toFixed(1)}"
                          transform="rotate(-90 ${cx} ${cy})" filter="url(#glow)"/>`;
              };
              // o.max: widest the text may be; if a value would overflow its card it is squeezed to fit
              // (covers wider fallback fonts and long readings like "10.25 kW").
              const t = (x, y, s, c, txt, o = {}) => {
                const est = String(txt).length * s * (o.mono ? .62 : .52);
                const fit = o.max && est > o.max ? `textLength="${o.max}" lengthAdjust="spacingAndGlyphs"` : '';
                return `<text x="${x}" y="${y}" font-size="${s}" fill="${c}" class="${o.mono ? 'mono' : 'ui'}"
                       ${o.end ? 'text-anchor="end"' : o.mid ? 'text-anchor="middle"' : ''} ${fit}
                       ${o.ls ? `letter-spacing="${o.ls}"` : ''} font-weight="${o.wt || 600}">${txt}</text>`;
              };
              const lbl = (x, y, txt, o = {}) => t(x, y, 13, C.muted, txt, { ls: 2.5, ...o });
              const bar = (x, y, w, pct, c, h = 7) =>
                `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="rgba(157,176,207,.18)"/>
                 <rect x="${x}" y="${y}" width="${Math.max(h, w * pct / 100).toFixed(1)}" height="${h}" rx="${h / 2}" fill="${c}" filter="url(#glow)"/>`;
              const flow = (d, c, pw) => {
                const sw = (2 + Math.min(5, pw / 1000)).toFixed(1);
                return `
                  <path d="${d}" fill="none" stroke="${c}" stroke-opacity=".22" stroke-width="${+sw + 7}" stroke-linecap="round"/>
                  <path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" class="flow" filter="url(#glow)"/>`;
              };

              /* ---------- flows (photo coordinates, 1600 x 1000) ---------- */
              // Card-to-card links are only drawn while power is moving along them; nothing shows when idle.
              const P_SOLAR_HOME = 'M 720 226 C 720 276, 754 296, 754 340';
              const P_HOME_TESLA = 'M 762 500 C 772 530, 800 552, 830 574';
              const P_HOME_KIA   = 'M 892 432 C 985 436, 1100 456, 1150 506';
              const link = (d, c) => {
                const [x1, y1] = d.match(/M ([\d.]+) ([\d.]+)/).slice(1);
                const pts = d.match(/[\d.]+ [\d.]+$/)[0].split(' ');
                return `
                  <path d="${d}" fill="none" stroke="${c}" stroke-opacity=".15" stroke-width="7" stroke-linecap="round"/>
                  <path d="${d}" fill="none" stroke="${c}" stroke-opacity=".85" stroke-width="2.2" stroke-dasharray="6 6" filter="url(#glow)"/>
                  <circle cx="${x1}" cy="${y1}" r="4.5" fill="#04091A" stroke="${c}" stroke-width="2"/>
                  <circle cx="${pts[0]}" cy="${pts[1]}" r="4.5" fill="#04091A" stroke="${c}" stroke-width="2"/>`;
              };
              let flows = '';
              if (solar > 50) flows += link(P_SOLAR_HOME, C.solar) + flow(P_SOLAR_HOME, C.solar, solar - exp);
              if (exp   > 50) flows += flow('M 630 300 C 560 292, 450 256, 354 248', C.solar, exp);
              if (imp   > 50) flows += flow('M 354 252 C 450 282, 580 384, 640 420', C.grid, imp);
              if (tesla > 50) flows += link(P_HOME_TESLA, C.ev) + flow(P_HOME_TESLA, C.ev, tesla);
              if (kia   > 50) flows += link(P_HOME_KIA, C.ev) + flow(P_HOME_KIA, C.ev, kia);

              /* ---------- conditions (top right) ---------- */
              const conditions = `
                <g ${info('weather.north_lakes_weather')}>
                  ${glass(1252, 44, 316, 150, C.grid)}
                  ${t(1274, 108, 44, C.text, time, { mono: 1, wt: 700 })}
                  ${lbl(1276, 136, date)}
                  ${t(1546, 100, 32, C.text, temp, { mono: 1, end: 1, wt: 700 })}
                  ${t(1546, 126, 15, C.muted, cond.toUpperCase(), { end: 1, ls: 2 })}
                  <rect x="1274" y="152" width="272" height="28" rx="14" fill="rgba(255,181,71,.10)" stroke="${C.solar}" stroke-opacity=".5"/>
                  ${t(1290, 171, 13, C.muted, 'TARIFF NOW', { ls: 2.5 })}
                  ${t(1530, 171, 14, C.solar, rateC.toFixed(2) + ' ¢/kWh', { mono: 1, end: 1, wt: 700 })}
                </g>`;

              /* ---------- left rail: today ---------- */
              const netC = net >= 0 ? C.credit : C.cost;
              const inPct = kwhIn + kwhOut > 0 ? kwhIn / (kwhIn + kwhOut) * 100 : 50;
              const DY = 124;                                           // Today + Billing sit below the Grid card
              const today = `
                <g transform="translate(0 ${DY})">
                  ${glass(32, 196, 320, 360, C.grid, .28, DY)}
                  ${lbl(54, 228, 'TODAY')}${lbl(330, 228, 'SINCE 00:00', { end: 1 })}
                  <g ${info('sensor.sh50rs_a21c2106894_daily_self_consumption_rate')}>
                    ${ring(108, 312, 50, C.solar, selfUse / 100)}
                    ${t(108, 318, 26, C.text, selfUse.toFixed(0) + '%', { mono: 1, mid: 1, wt: 700 })}
                    ${t(108, 338, 11, C.muted, 'SELF USE', { mid: 1, ls: 2 })}
                  </g>
                  <g ${info('sensor.daily_energy_net')}>
                    ${lbl(188, 292, 'NET TODAY')}
                    ${t(186, 334, 36, netC, (net >= 0 ? '+' : '−') + usd(net), { mono: 1, wt: 700 })}
                  </g>
                  <line x1="54" y1="388" x2="330" y2="388" stroke="${C.muted}" stroke-opacity=".18"/>
                  <g ${info('sensor.daily_import_cost')}>
                    ${lbl(54, 418, 'GRID COST')}${t(330, 420, 20, C.cost, usd(cost), { mono: 1, end: 1, wt: 700 })}
                  </g>
                  <line x1="54" y1="436" x2="330" y2="436" stroke="${C.muted}" stroke-opacity=".18"/>
                  <g ${info('sensor.daily_solar_credit')}>
                    ${lbl(54, 466, 'SOLAR CREDIT')}${t(330, 468, 20, C.credit, usd(credit), { mono: 1, end: 1, wt: 700 })}
                  </g>
                  <line x1="54" y1="484" x2="330" y2="484" stroke="${C.muted}" stroke-opacity=".18"/>
                  <g ${info('sensor.sh50rs_a21c2106894_daily_grid_import')}>
                    ${lbl(54, 512, 'IN')}${t(80, 513, 16, C.grid, kwhIn.toFixed(1), { mono: 1, wt: 700 })}
                    ${lbl(282, 512, 'OUT', { end: 1 })}${t(330, 513, 16, C.solar, kwhOut.toFixed(1), { mono: 1, end: 1, wt: 700 })}
                    <rect x="54" y="526" width="${(276 * inPct / 100 - 3).toFixed(1)}" height="8" rx="4" fill="${C.grid}" filter="url(#glow)"/>
                    <rect x="${(54 + 276 * inPct / 100 + 3).toFixed(1)}" y="526" width="${(276 * (100 - inPct) / 100 - 3).toFixed(1)}" height="8" rx="4" fill="${C.solar}" filter="url(#glow)"/>
                    ${t(192, 548, 11, C.muted, 'kWh GRID IMPORT · SOLAR EXPORT', { mid: 1, ls: 1.5 })}
                  </g>
                </g>`;

              /* ---------- left rail: billing ---------- */
              const vsTxt = vsLast === null ? '' : `${vsLast <= 0 ? '▼' : '▲'} ${Math.abs(vsLast).toFixed(0)}%`;
              const vsC = vsLast === null ? C.muted : vsLast <= 0 ? C.credit : C.cost;
              const billing = `
                <g transform="translate(0 ${DY})">
                  ${glass(32, 576, 320, 262, C.grid, .28, DY)}
                  ${lbl(54, 608, 'BILLING')}
                  ${t(330, 608, 13, C.text, periodTxt, { end: 1, ls: 1.5, mono: 1, max: 190 })}
                  <g ${info('sensor.electricity_bill_to_date')}>
                    ${lbl(54, 642, 'BILL TO DATE')}
                    ${t(330, 642, 12, C.muted, `DAY ${periodDay} / ${periodDays}`, { end: 1, ls: 1.5 })}
                    ${t(52, 688, 42, C.text, usd(billToDate), { mono: 1, wt: 700 })}
                    ${t(330, 686, 14, C.muted, billPct.toFixed(0) + '% OF EST.', { end: 1, ls: 1.5 })}
                    ${bar(54, 704, 276, billPct, C.ev, 8)}
                  </g>
                  <line x1="54" y1="732" x2="330" y2="732" stroke="${C.muted}" stroke-opacity=".18"/>
                  <g ${info('sensor.electricity_estimated_bill')}>
                    ${lbl(54, 766, 'ESTIMATED BILL')}${t(330, 768, 22, C.home, usd(billEst), { mono: 1, end: 1, wt: 700 })}
                  </g>
                  <line x1="54" y1="784" x2="330" y2="784" stroke="${C.muted}" stroke-opacity=".18"/>
                  <g ${info('input_number.electricity_last_bill')}>
                    ${lbl(54, 816, 'LAST BILL')}
                    ${t(236, 818, 18, C.text, lastBill > 0 ? usd(lastBill) : '—', { mono: 1, end: 1, wt: 700 })}
                    ${t(330, 817, 15, vsC, vsTxt, { mono: 1, end: 1, wt: 700 })}
                  </g>
                </g>`;

              /* ---------- node cards over the photo ---------- */
              const solarNode = `
                <g ${info('sensor.sh50rs_a21c2106894_mppt_total_power')}>
                  ${glass(560, 70, 264, 156, C.solar, .45)}
                  ${ring(624, 148, 40, C.solar, solar / SOLAR_MAX)}
                  <path d="M624 134 L614 152 H623 L619 166 L634 144 H625 Z" fill="${C.solar}"/>
                  ${lbl(682, 118, 'SOLAR')}
                  ${t(680, 158, 32, C.solar, kw(solar), { mono: 1, wt: 700, max: 126 })}
                  ${t(682, 186, 13, selfUse >= 80 ? C.credit : selfUse >= 50 ? C.solar : C.cost, 'SELF USE ' + selfUse.toFixed(0) + '%', { ls: 1.5 })}
                </g>
                ${solar > 50 ? `<path d="M690 226 L642 295" stroke="${C.solar}" stroke-dasharray="3 4" stroke-opacity=".8"/>
                <circle cx="640" cy="298" r="5" fill="none" stroke="${C.solar}" stroke-width="2"/>` : ''}`;

              const gridState = imp > 50 ? ['IMPORTING', C.cost, '▼ ' + kw(imp)]
                              : exp > 50 ? ['EXPORTING', C.credit, '▲ ' + kw(exp)]
                              : ['IDLE', C.muted, '—'];
              const gridNode = `
                <g ${info('sensor.grid_direction')}>
                  ${glass(32, 190, 320, 114, C.grid, .45)}
                  <g transform="translate(56 214)" stroke="${C.grid}" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#glow)">
                    <path d="M8 66 L20 6 L26 6 L38 66 M2 14 H44 M5 26 H41 M12 44 L34 26 M34 44 L12 26 M14 58 L32 44 M32 58 L14 44"/></g>
                  ${lbl(122, 230, 'GRID')}
                  ${t(120, 272, 32, gridState[1], gridState[2], { mono: 1, wt: 700, max: 210 })}
                  ${t(122, 292, 11, C.muted, gridState[0], { ls: 2 })}
                </g>`;

              const solarShare = total > 0 ? Math.min(1, Math.max(0, (solar - exp) / total)) : 0;
              const homeNode = `
                <g ${go('/dashboard-hub/hubhome')}>
                  ${glass(640, 340, 252, 160, C.home, .5)}
                  ${ring(700, 420, 38, C.home, solarShare)}
                  <path d="M686 424 L700 410 L714 424 M690 420 V434 H710 V420" fill="none" stroke="${C.home}" stroke-width="2" stroke-linejoin="round"/>
                  ${lbl(752, 392, 'HOME')}
                  ${t(750, 432, 28, C.home, kw(home), { mono: 1, wt: 700, max: 122 })}
                  ${t(752, 458, 11, C.muted, (solarShare * 100).toFixed(0) + '% FROM SOLAR', { ls: 1.5 })}
                  ${t(752, 480, 11, C.home, 'OPEN HUB ›', { ls: 2 })}
                </g>`;

              // Daily grid-cost meters: HA names them from `name:` (..._today); fall back to the key (..._daily).
              const pick = (...ids) => ids.find((e) => states[e]) || ids[0];
              const evNode = (x, y, name, eid, batt, pw, sub, costEid) => {
                const gridCost = num(costEid);
                return `
                <g ${info(eid)}>
                  ${glass(x, y, 188, 220, C.ev, pw > 50 ? .7 : .35)}
                  ${lbl(x + 20, y + 30, name)}
                  ${t(x + 168, y + 30, 12, pw > 50 ? C.ev : C.muted, pw > 50 ? '⚡ ' + (pw / 1000).toFixed(1) + ' kW' : 'IDLE', { end: 1, ls: 1.5, mono: pw > 50 })}
                  ${ring(x + 94, y + 104, 44, battC(batt), batt / 100, 8)}
                  ${t(x + 94, y + 112, 26, C.text, batt + '%', { mono: 1, mid: 1, wt: 700 })}
                  ${t(x + 94, y + 176, 12, C.muted, sub, { mid: 1, ls: 1.5 })}
                </g>
                <g ${info(costEid)}>
                  <line x1="${x + 20}" y1="${y + 188}" x2="${x + 168}" y2="${y + 188}" stroke="${C.muted}" stroke-opacity=".18"/>
                  ${t(x + 20, y + 209, 11, C.muted, 'GRID TODAY', { ls: 2 })}
                  ${t(x + 168, y + 210, 15, gridCost > 0 ? C.cost : C.muted, usd(gridCost), { mono: 1, end: 1, wt: 700 })}
                </g>`;
              };

              const nodes = solarNode + gridNode + homeNode
                + evNode(738, 574, 'TESLA', 'sensor.bluey_battery_level', teslaBatt, tesla, tesla > 50 ? teslaRange + ' KM · CHARGING' : teslaRange + ' KM RANGE', pick('sensor.tesla_grid_charging_cost_today', 'sensor.tesla_grid_charging_cost_daily'))
                + evNode(1058, 506, 'KIA', 'input_number.kia_battery_estimate', kiaBatt, kia, kia > 50 ? 'CHARGING' : 'ESTIMATED', pick('sensor.kia_grid_charging_cost_today', 'sensor.kia_grid_charging_cost_daily'));

              /* ---------- assemble ---------- */
              const bg = night ? '/local/images/energy-dashboard-bg-night.png' : '/local/images/energy-dashboard-bg1.png';
              const body = conditions + today + billing + flows + nodes;   // fills BOXES for the frosted-glass clip
              // The whole HUD is fitted inside the screen ("meet") so nothing is ever cropped on
              // tablets or phones; any spare space shows a blurred, dimmed copy of the photo.
              return `
              <div style="position:absolute;inset:-40px;background:#04091A url('${bg}') center / cover no-repeat;
                          filter:blur(28px) brightness(.45) saturate(1.2);"></div>
              <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"
                   style="position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;pointer-events:none;">
                <style>
                  .ui   { font-family: Rajdhani, Roboto, sans-serif; }
                  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
                  .flow { stroke-dasharray: 2 14; stroke-linecap: round; animation: hudDash 1s linear infinite; }
                  .spin { transform-box: fill-box; transform-origin: center; animation: hudSpin 24s linear infinite; }
                  @keyframes hudDash { to { stroke-dashoffset: -16; } }
                  @keyframes hudSpin { to { transform: rotate(360deg); } }
                </style>
                <defs>
                  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2.5" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                  <filter id="frost" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="14"/></filter>
                  <clipPath id="glassClip">${BOXES.join('')}</clipPath>
                  <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#04091A" stop-opacity=".55"/><stop offset=".3" stop-color="#04091A" stop-opacity="0"/>
                    <stop offset=".8" stop-color="#04091A" stop-opacity="0"/><stop offset="1" stop-color="#04091A" stop-opacity=".35"/></linearGradient>
                </defs>
                <image href="${bg}" x="0" y="0" width="1600" height="1000" preserveAspectRatio="xMidYMid slice"/>
                <rect width="1600" height="1000" fill="url(#vignette)"/>
                <image href="${bg}" x="0" y="0" width="1600" height="1000" preserveAspectRatio="xMidYMid slice"
                       filter="url(#frost)" clip-path="url(#glassClip)"/>
                ${body}
              </svg>`;
              ]]]
