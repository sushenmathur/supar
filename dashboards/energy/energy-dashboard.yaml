# Energy New dashboard: HUD layout over the house photo (raw configuration)
# Requires: custom:button-card, kiosk-mode (HACS)
# The previous layout is kept in energy-dashboard-classic.yaml.
#
# Everything is drawn in one 1600 x 1000 SVG (same 16:10 shape as the photo),
# so the panels and flow lines stay locked to the house at any screen size.
# Tap a panel for its sensor details; tap HOME to go back to the Hub. Taps are handled by
# invisible button-cards (hotspot_*) laid over the panels, positioned in the same 16:10 space.
kiosk_mode:
  user_settings:
    - users:
        - suparhome
      kiosk: true
button_card_templates:
  hud_hotspot:
    # Invisible tap target laid over a HUD panel; button-card does the tap action.
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    hold_action:
      action: none
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - border-radius: 16px
        - padding: '0'
        - height: 100%
        - cursor: pointer
views:
  - title: Home Energy
    path: energy
    type: panel
    cards:
      - type: custom:button-card
        entity: sensor.sh50rs_a21c2106894_mppt_total_power
        show_name: false
        show_icon: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        triggers_update:
          - sensor.sh50rs_a21c2106894_mppt_total_power
          - sensor.sh50rs_a21c2106894_purchased_power
          - sensor.sh50rs_a21c2106894_total_export_active_power
          - sensor.home_power_consumption
          - sensor.bluey_charger_power
          - sensor.kia_charger_power
          - sensor.sh50rs_a21c2106894_daily_self_consumption_rate
          - sensor.bluey_battery_level
          - sensor.bluey_battery_range
          - input_number.kia_battery_estimate
          - sensor.daily_import_cost
          - sensor.daily_solar_credit
          - sensor.daily_energy_net
          - sensor.sh50rs_a21c2106894_daily_grid_import
          - sensor.solar_export_energy_daily
          - sensor.electricity_bill_to_date
          - sensor.electricity_estimated_bill
          - sensor.electricity_billing_day
          - sensor.electricity_days_remaining
          - input_number.electricity_last_bill
          - sensor.current_energy_rate
          - sensor.dashboard_night_mode
          - weather.north_lakes_weather
          - sensor.time
          - sensor.date_time_iso
          - sensor.tesla_grid_charging_cost_today
          - sensor.kia_grid_charging_cost_today
          - sensor.tesla_grid_charging_cost_daily
          - sensor.kia_grid_charging_cost_daily
        styles:
          card:
            - padding: '0'
            - border: none
            - border-radius: '0'
            - background: '#04091A'
            - height: calc(100dvh - var(--header-height, 56px))   # screen minus HA header (0 in kiosk mode)
            - overflow: hidden
            - position: relative
            - container-type: size
          grid:
            - grid-template-areas: '"hud"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
            - height: 100%
          custom_fields:
            hud:
              - position: relative
              - width: 100%
              - height: 100%
            hotspot_weather:
              - position: absolute
              - z-index: 2
              - left: calc((100cqw - min(100cqw, 160cqh)) / 2 + min(100cqw, 160cqh) * 0.78250)
              - top: calc((100cqh - min(100cqw, 160cqh) * 0.625) / 2 + min(100cqw, 160cqh) * 0.02750)
              - width: calc(min(100cqw, 160cqh) * 0.19750)
              - height: calc(min(100cqw, 160cqh) * 0.09375)
            hotspot_grid:
              - position: absolute
              - z-index: 2
              - left: calc((100cqw - min(100cqw, 160cqh)) / 2 + min(100cqw, 160cqh) * 0.02000)
              - top: calc((100cqh - min(100cqw, 160cqh) * 0.625) / 2 + min(100cqw, 160cqh) * 0.11875)
