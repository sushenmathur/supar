              type: custom:button-card
              template: hud_hotspot
              entity: sensor.grid_direction
              tap_action:
                action: more-info
          hotspot_selfuse:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.sh50rs_a21c2106894_daily_self_consumption_rate
              tap_action:
                action: more-info
          hotspot_net:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: sensor.daily_energy_net
              tap_action:
                action: more-info
          hotspot_cost:
