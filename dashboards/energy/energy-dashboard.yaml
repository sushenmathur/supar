              - left: calc((100cqw - min(100cqw, 160cqh)) / 2 + min(100cqw, 160cqh) * 0.40000)
              - top: calc((100cqh - min(100cqw, 160cqh) * 0.625) / 2 + min(100cqw, 160cqh) * 0.21250)
              - width: calc(min(100cqw, 160cqh) * 0.15750)
              - height: calc(min(100cqw, 160cqh) * 0.10000)
            hotspot_tesla:
