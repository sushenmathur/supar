              - width: calc(min(100cqw, 160cqh) * 0.11750)
              - height: calc(min(100cqw, 160cqh) * 0.02000)
        custom_fields:
          hotspot_weather:
            card:
              type: custom:button-card
              template: hud_hotspot
              entity: weather.north_lakes_weather
              tap_action:
