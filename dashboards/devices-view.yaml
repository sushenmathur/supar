                    perform_action: remote.send_command
                    target:
                      entity_id: remote.rm_mini_3
                    data:
                      num_repeats: 1
                      delay_secs: 0.4
                      hold_secs: 0
                      device: bedroom_tv
                      command: vol_up
        styles:
          card:
            - padding: 10px 12px
            - border-radius: 18px
            - box-shadow: none
            - border: 1px solid rgba(var(--rgb-primary-text-color),0.1)
            - background: rgba(var(--rgb-primary-text-color),0.05)
          grid:
