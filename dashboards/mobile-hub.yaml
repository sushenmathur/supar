# ==========================================================================
# Mobile Hub - FULL raw configuration (Option B Home view + all other views)
#
# Dashboard > (pencil) Edit dashboard > three dots > Raw configuration editor
# Select everything, delete it, paste this whole file, Save.
# ==========================================================================

button_card_templates:
  b_ac:
    custom_fields:
      minus:
        card:
          entity: '[[[ return entity.entity_id; ]]]'
          icon: mdi:minus
          template: b_acstep
          type: custom:button-card
          variables:
            dir: -1
      modes:
        card:
          cards:
            - entity: '[[[ return entity.entity_id; ]]]'
              icon: mdi:power
              template: b_acmode
              type: custom:button-card
              variables:
                col: '#8a9599'
                mode: 'off'
            - entity: '[[[ return entity.entity_id; ]]]'
              icon: mdi:snowflake
              template: b_acmode
              type: custom:button-card
              variables:
                col: '#4c8dff'
                mode: cool
            - entity: '[[[ return entity.entity_id; ]]]'
              icon: mdi:fire
              template: b_acmode
              type: custom:button-card
              variables:
                col: '#ff7a45'
                mode: heat
          type: horizontal-stack
      plus:
        card:
          entity: '[[[ return entity.entity_id; ]]]'
          icon: mdi:plus
          template: b_acstep
          type: custom:button-card
          variables:
            dir: 1
      tval: |
        [[[
          const t = entity.attributes.temperature;
          return `<div style="font-size:24px;font-weight:700;color:var(--primary-text-color);opacity:${entity.state === 'off' ? 0.5 : 1}">${t != null ? t + '°' : '–'}</div>`;
        ]]]
    hold_action:
      action: more-info
    show_icon: true
    show_name: true
    show_state: true
    state_display: |
      [[[
        const cur = entity.attributes.current_temperature;
        const m = entity.state === 'off' ? 'Off'
          : entity.state.replace('_', ' ').replace(/^./, c => c.toUpperCase());
        return cur != null ? `${m} · now ${cur}°` : m;
      ]]]
    styles:
      card:
        - padding: 10px
        - border-radius: 18px
        - box-shadow: none
        - border: 1px solid rgba(var(--rgb-primary-text-color),0.1)
        - background: |
            [[[
              return entity.state === 'off'
                ? 'rgba(var(--rgb-primary-text-color),0.05)'
                : `color-mix(in srgb, ${variables.mode_color} 14%, transparent)`;
            ]]]
      custom_fields:
        minus:
          - margin-top: 10px
        modes:
          - margin-top: 8px
        plus:
          - margin-top: 10px
        tval:
          - margin-top: 10px
          - justify-self: center
      grid:
        - grid-template-areas: '"i n n" "i s s" "minus tval plus" "modes modes modes"'
        - grid-template-columns: 40px 1fr 40px
        - grid-template-rows: min-content min-content auto auto
        - column-gap: 6px
      icon:
        - width: 18px
        - color: '[[[ return variables.mode_color; ]]]'
      img_cell:
        - width: 32px
        - height: 32px
        - border-radius: 50%
        - background: >-
            [[[ return `color-mix(in srgb, ${variables.mode_color} 20%,
            transparent)`; ]]]
      name:
        - justify-self: start
        - font-size: 12px
        - font-weight: 700
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      state:
        - justify-self: start
        - font-size: 10px
        - opacity: 0.7
    tap_action:
      action: more-info
    variables:
      mode_color: |
        [[[
          const c = { cool: '#4c8dff', heat: '#ff7a45', auto: '#30b158', heat_cool: '#30b158', dry: '#2bb5a6', fan_only: '#8a9599' };
          return c[entity.state] || 'var(--secondary-text-color)';
        ]]]
  b_acmode:
    hold_action:
      action: none
    show_name: false
    show_state: false
    styles:
      card:
        - height: 28px
        - padding: 0
        - border-radius: 10px
        - box-shadow: none
        - border: none
        - background: >
            [[[ return entity.state === variables.mode ? variables.col :
            'rgba(var(--rgb-primary-text-color),0.06)'; ]]]
        - display: >
            [[[ return (entity.attributes.hvac_modes ||
            [variables.mode]).includes(variables.mode) ? 'block' : 'none'; ]]]
      grid:
        - grid-template-areas: '"i"'
      icon:
        - width: 16px
        - color: >
            [[[ return entity.state === variables.mode ? '#ffffff' :
            'var(--secondary-text-color)'; ]]]
    tap_action:
      action: perform-action
      data:
        hvac_mode: '[[[ return variables.mode; ]]]'
      perform_action: climate.set_hvac_mode
      target:
        entity_id: '[[[ return entity.entity_id; ]]]'
    variables:
      col: '#8a9599'
      mode: 'off'
  b_acstep:
    hold_action:
      action: none
    show_name: false
    show_state: false
    styles:
      card:
        - width: 34px
        - height: 34px
        - padding: 0
        - border-radius: 50%
        - box-shadow: none
        - border: none
        - background: rgba(var(--rgb-primary-text-color),0.08)
      grid:
        - grid-template-areas: '"i"'
      icon:
        - width: 18px
        - color: var(--primary-text-color)
    tap_action:
      action: perform-action
      data:
        temperature: |
          [[[
            const a = entity.attributes;
            const step = a.target_temp_step || 1;
            const min = a.min_temp != null ? a.min_temp : 16;
            const max = a.max_temp != null ? a.max_temp : 30;
            const t = a.temperature != null ? a.temperature : 22;
            return +Math.min(max, Math.max(min, t + variables.dir * step)).toFixed(1);
          ]]]
      perform_action: climate.set_temperature
      target:
        entity_id: '[[[ return entity.entity_id; ]]]'
    variables:
      dir: 1
  b_act:
    hold_action:
      action: none
    show_name: true
    show_state: false
    styles:
      card:
        - padding: '0'
        - background: none
        - box-shadow: none
        - border: none
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 48px min-content
      icon:
        - width: 22px
        - color: var(--primary-text-color)
      img_cell:
        - width: 44px
        - height: 44px
        - border-radius: 50%
        - justify-self: center
        - background: rgba(var(--rgb-primary-text-color),0.08)
      name:
        - font-size: 10.5px
        - font-weight: '600'
        - color: var(--secondary-text-color)
        - margin-top: 2px
  b_avatar:
    custom_fields:
      badge: |
        [[[
          const a = variables.activity && states[variables.activity] ? states[variables.activity].state : '';
          const k = a === 'Automotive' ? ['mdi:car', '#0a84ff'] : a === 'Walking' ? ['mdi:walk', '#ff9f0a'] : null;
          if (!k) return '';
          return `<div style="width:20px;height:20px;border-radius:50%;background:${k[1]};border:2px solid var(--primary-background-color);box-sizing:border-box;display:grid;place-items:center">
            <ha-icon icon="${k[0]}" style="--mdc-icon-size:12px;color:#fff;display:flex"></ha-icon></div>`;
        ]]]
    show_entity_picture: true
    show_icon: true
    show_name: false
    show_state: true
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
        - overflow: visible
        - position: relative
      custom_fields:
        badge:
          - position: absolute
          - top: 20px
          - left: calc(50% + 6px)
          - z-index: 1
          - line-height: 0
      entity_picture:
        - width: 32px
        - height: 32px
        - border-radius: 50%
        - object-fit: cover
        - border: >
            [[[ return entity.state === 'home' ? '2px solid var(--green-color)'
            : '2px solid var(--amber-color)'; ]]]
      grid:
        - grid-template-areas: '"i" "s"'
        - grid-template-rows: 36px min-content
      img_cell:
        - width: 34px
        - height: 34px
        - justify-self: center
      state:
        - font-size: 9.5px
        - opacity: 0.7
        - margin-top: 2px
    tap_action:
      action: more-info
    variables:
      activity: ''
  b_bento:
    custom_fields:
      lbl: |-
        [[[
          return `<div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--secondary-text-color)">
            <ha-icon icon="${variables.icon}" style="--mdc-icon-size:15px;color:${variables.tint}"></ha-icon>${variables.label}</div>`;
        ]]]
    hold_action:
      action: none
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - padding: 13px
        - border-radius: 22px
        - box-shadow: none
        - border: 1px solid rgba(var(--rgb-primary-text-color),0.07)
        - background: rgba(var(--rgb-primary-text-color),0.05)
        - height: '[[[ return variables.height; ]]]'
        - box-sizing: border-box
        - overflow: hidden
      custom_fields:
        body:
          - justify-self: stretch
          - text-align: left
          - min-width: '0'
        lbl:
          - justify-self: start
      grid:
        - grid-template-areas: '"lbl" "body"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content 1fr
        - align-content: start
    tap_action:
      action: none
    variables:
      height: auto
      icon: mdi:circle-small
      label: ''
      tint: var(--secondary-text-color)
  b_mini:
    hold_action:
      action: more-info
    show_name: false
    show_state: false
    state:
      - styles:
          card:
            - background: '#ff9a56'
          icon:
            - color: '#1d1002'
        value: 'on'
    styles:
      card:
        - height: 34px
        - padding: '0'
        - border-radius: 12px
        - box-shadow: none
        - border: none
        - background: rgba(var(--rgb-primary-text-color),0.08)
      grid:
        - grid-template-areas: '"i"'
      icon:
        - width: 18px
        - color: var(--primary-text-color)
    tap_action:
      action: toggle
  b_phone:
    custom_fields:
      ping:
        card:
          hold_action:
            action: none
          icon: mdi:bell-ring-outline
          name: Ping
          show_state: false
          styles:
            card:
              - width: 52px
              - padding: 7px 4px
              - border-radius: 12px
              - box-shadow: none
              - border: none
              - background: >-
                  [[[ return `color-mix(in srgb, ${variables.tint} 16%,
                  transparent)`; ]]]
            grid:
              - grid-template-areas: '"i" "n"'
              - row-gap: 2px
            icon:
              - width: 18px
              - color: '[[[ return variables.tint; ]]]'
            name:
              - font-size: 9.5px
              - font-weight: 700
              - color: '[[[ return variables.tint; ]]]'
          tap_action:
            action: perform-action
            data:
              device_name: '[[[ return variables.device; ]]]'
            perform_action: icloud3.find_iphone_alert
          type: custom:button-card
    label: >
      [[[ return variables.info && states[variables.info] ?
      states[variables.info].state : ''; ]]]
    show_icon: true
    show_label: true
    show_name: true
    show_state: true
    state_display: >
      [[[ return isNaN(parseFloat(entity.state)) ? entity.state :
      Math.round(entity.state) + '%'; ]]]
    styles:
      card:
        - padding: 10px
        - border-radius: 18px
        - box-shadow: none
        - border: 1px solid rgba(var(--rgb-primary-text-color),0.1)
        - background: rgba(var(--rgb-primary-text-color),0.05)
      grid:
        - grid-template-areas: '"i n ping" "i s ping" "i l ping"'
        - grid-template-columns: 30px 1fr auto
        - column-gap: 8px
      icon:
        - width: 24px
        - color: |
            [[[
              const b = parseFloat(entity.state);
              return isNaN(b) ? 'var(--secondary-text-color)' : b < 20 ? 'var(--red-color)' : b < 50 ? 'var(--amber-color)' : 'var(--green-color)';
            ]]]
      label:
        - justify-self: start
        - font-size: 9.5px
        - opacity: 0.65
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      name:
        - justify-self: start
        - font-size: 11.5px
        - font-weight: 700
      state:
        - justify-self: start
        - font-size: 18px
        - font-weight: 800
        - line-height: 1.1
    tap_action:
      action: more-info
    variables:
      device: ''
      info: ''
      tint: var(--primary-color)
  b_qbtn:
    hold_action:
      action: none
    show_name: false
    show_state: false
    styles:
      card:
        - width: 34px
        - height: 34px
        - padding: 0
        - border-radius: 50%
        - box-shadow: none
        - border: none
        - background: rgba(var(--rgb-primary-text-color),0.09)
      grid:
        - grid-template-areas: '"i"'
      icon:
        - width: 19px
        - color: '[[[ return variables.color; ]]]'
    variables:
      color: var(--primary-text-color)
  b_round:
    show_icon: true
    show_name: true
    show_state: true
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 0
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 46px min-content min-content
      icon:
        - width: 20px
        - color: '[[[ return variables.tint; ]]]'
      img_cell:
        - width: 40px
        - height: 40px
        - border-radius: 50%
        - justify-self: center
        - background: >
            [[[ return `color-mix(in srgb, ${variables.tint} 20%, transparent)`;
            ]]]
      name:
        - font-size: 10px
        - font-weight: 600
        - margin-top: 2px
      state:
        - font-size: 9.5px
        - opacity: 0.65
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
    tap_action:
      action: more-info
    variables:
      tint: var(--secondary-text-color)
  b_round_temp:
    icon: mdi:thermometer
    template: b_round
    variables:
      tint: |
        [[[
          const t = parseFloat(entity.state);
          if (isNaN(t)) return 'var(--secondary-text-color)';
          return t < 20 ? 'var(--blue-color)' : t <= 25 ? 'var(--green-color)' : t <= 28 ? 'var(--amber-color)' : 'var(--red-color)';
        ]]]
  b_sec:
    hold_action:
      action: more-info
    show_name: true
    show_state: false
    styles:
      card:
        - padding: 7px 2px
        - border-radius: 12px
        - box-shadow: none
        - border: none
        - background: rgba(var(--rgb-primary-text-color),0.07)
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 20px min-content
        - row-gap: 3px
      icon:
        - width: 18px
        - color: var(--primary-text-color)
      name:
        - font-size: 9.5px
        - font-weight: '600'
        - color: var(--secondary-text-color)
  b_sq:
    hold_action:
      action: more-info
    show_icon: true
    show_name: true
    show_state: true
    styles:
      card:
        - padding: 12px 12px 10px
        - border-radius: 18px
        - box-shadow: none
        - border: >
            [[[ return variables.active ? '1px solid transparent' : '1px solid
            rgba(var(--rgb-primary-text-color),0.1)'; ]]]
        - background: >
            [[[ return variables.active ? variables.on_color :
            'rgba(var(--rgb-primary-text-color),0.05)'; ]]]
        - color: >
            [[[ return variables.active ? variables.on_text :
            'var(--primary-text-color)'; ]]]
        - transition: transform 0.12s ease
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content min-content
        - align-content: start
      icon:
        - width: 22px
        - color: >
            [[[ return variables.active ? variables.on_text :
            variables.icon_color; ]]]
      img_cell:
        - justify-self: start
        - justify-content: flex-start
        - align-items: center
        - width: 26px
        - height: 26px
        - margin-bottom: 8px
      name:
        - justify-self: stretch
        - text-align: left
        - font-size: 12px
        - font-weight: 700
        - line-height: 1.2
        - white-space: normal
        - display: -webkit-box
        - -webkit-line-clamp: 2
        - -webkit-box-orient: vertical
        - overflow: hidden
        - height: 2.4em
      state:
        - justify-self: start
        - text-align: left
        - font-size: 11px
        - line-height: 1.3
        - opacity: 0.75
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
    tap_action:
      action: more-info
    variables:
      active: |
        [[[
          return entity
            ? ['on','open','opening','closing','unlocked','playing','cleaning','heat','cool','heat_cool'].includes(entity.state)
            : false;
        ]]]
      icon_color: var(--secondary-text-color)
      on_color: rgba(255, 169, 77, 0.95)
      on_text: '#1d1002'
  b_sq_charge:
    extra_styles: |
      @keyframes bpulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
    state_display: |
      [[[ return entity.state === 'on' ? '⚡ Charging' : 'Start charging'; ]]]
    styles:
      icon:
        - animation: >
            [[[ return entity.state === 'on' ? 'bpulse 1.5s infinite' : 'none';
            ]]]
    tap_action:
      action: toggle
    template: b_sq
    variables:
      on_color: rgba(0, 230, 118, 0.9)
      on_text: '#032612'
  b_sq_light:
    hold_action:
      action: more-info
    state_display: |
      [[[
        if (entity.state !== 'on') return 'Off';
        const b = entity.attributes.brightness;
        return b ? Math.round(b / 2.55) + '%' : 'On';
      ]]]
    styles:
      card:
        - background: |
            [[[
              if (entity.state !== 'on') return 'rgba(var(--rgb-primary-text-color),0.05)';
              const b = entity.attributes.brightness;
              const p = b ? Math.round(b / 2.55) : 100;
              return `linear-gradient(to top, rgba(255,169,77,0.95) ${p}%, rgba(255,169,77,0.45) ${p}%)`;
            ]]]
    tap_action:
      action: toggle
    template: b_sq
  b_stat:
    show_icon: true
    show_name: true
    show_state: true
    state_display: |
      [[[ return '$' + entity.state; ]]]
    styles:
      card:
        - padding: 8px 4px
        - border-radius: 14px
        - box-shadow: none
        - border: none
        - background: >
            [[[ return `color-mix(in srgb, ${variables.tint} 15%, transparent)`;
            ]]]
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 20px min-content min-content
      icon:
        - width: 16px
        - color: '[[[ return variables.tint; ]]]'
      name:
        - font-size: 9.5px
        - opacity: 0.8
      state:
        - font-size: 11.5px
        - font-weight: 700
        - color: '[[[ return variables.tint; ]]]'
    tap_action:
      action: more-info
    variables:
      tint: var(--secondary-text-color)
  b_tesla_act:
    show_name: true
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 42px 16px
      icon:
        - width: 20px
        - height: 20px
      img_cell:
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - justify-self: center
        - background: rgba(255, 255, 255, 0.09)
      name:
        - color: '#8f8f8f'
        - font-size: 10px
        - margin-top: 2px
  b_title:
    custom_fields:
      title: |
        [[[
          return `
            <div style="font-size:11px;font-weight:600;color:var(--secondary-text-color);letter-spacing:.02em">${variables.sub}</div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05;
              background:linear-gradient(90deg,#ff8a3d,#e9a400);-webkit-background-clip:text;
              background-clip:text;-webkit-text-fill-color:transparent">${variables.title}</div>`;
        ]]]
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 4px 4px 0
      custom_fields:
        title:
          - justify-self: start
          - text-align: left
      grid:
        - grid-template-areas: '"title"'
    tap_action:
      action: none
    variables:
      sub: ''
      title: ''
  b_wide:
    styles:
      card:
        - height: 64px
        - padding: 10px 12px
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 36px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 6px
        - align-content: stretch
      img_cell:
        - margin-bottom: 0
        - justify-content: center
      name:
        - align-self: end
        - height: auto
        - display: block
        - white-space: nowrap
        - text-overflow: ellipsis
      state:
        - align-self: start
    template: b_sq
views:
  - badges: []
    cards: []
    dense_section_placement: true
    header:
      card:
        custom_fields:
          greet: |-
            [[[
              const h = new Date().getHours();
              const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
              const date = new Date().toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
              const etaFor = (person, sensor) => {
                if (!states[person] || states[person].state === 'home') return '';
                const m = Math.round(Math.abs(parseFloat(states[sensor] ? states[sensor].state : 0) || 0));
                if (!m) return '';
                return ' · ' + (m >= 60 ? `${Math.floor(m / 60)}hr ${m % 60}min` : `${m} min`) + ' from home';
              };
              let eta = '';
              if (user.name === 'Sushen') eta = etaFor('person.sushenmathur', 'sensor.sushen_current_to_home_driving_time');
              else if (user.name === 'Paro') eta = etaFor('person.paro', 'sensor.paro_current_to_home_driving_time');
              return `<div style="font-size:11.5px;font-weight:600;color:var(--secondary-text-color)">${date} · ${g}${eta}</div>
                <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1">${user.name}</div>`;
            ]]]
          paro:
            card:
              entity: person.paro
              template: b_avatar
              triggers_update:
                - sensor.paro_iphone_activity
              type: custom:button-card
              variables:
