type: custom:bubble-card
card_type: pop-up
hash: '#all-lights'
name: All Lights
icon: mdi:lightbulb-group
show_header: true
button_type: name
close_by_clicking_outside: true
bg_opacity: 88
bg_blur: 14
shadow_opacity: 0
margin_top_mobile: 60px
cards:
- type: custom:button-card
  template: b_wide
  entity: scene.good_night
  name: Good Night
  icon: mdi:weather-night
  show_state: true
  state_display: Turn everything off for bed
  variables:
    icon_color: var(--blue-color)
  tap_action:
    action: perform-action
    perform_action: scene.turn_on
    target:
      entity_id: scene.good_night
- type: heading
  heading: Living & Kitchen
  heading_style: subtitle
  icon: mdi:sofa
- type: grid
  columns: 3
  square: false
  cards:
  - type: custom:button-card
    template: b_sq_light
    entity: light.dining_light
    name: Dining
    icon: mdi:ceiling-light
  - type: custom:button-card
    template: b_sq_light
    entity: light.kitchen_pendants
    name: Pendants
    icon: mdi:vanity-light
  - type: custom:button-card
    template: b_sq_light
    entity: light.kitchen_downlights
    name: Kitchen Downlights
    icon: mdi:light-recessed
  - type: custom:button-card
    template: b_sq_light
    entity: light.kitchenled
    name: Kitchen Bench
    icon: mdi:led-strip-variant
  - type: custom:button-card
    template: b_sq_light
    entity: light.sonoff_1000dbd8b7
    name: Media Downlights
    icon: mdi:light-recessed
  - type: custom:button-card
    template: b_sq
    entity: switch.sonoff_100090d020
    name: Lamp
    icon: mdi:lamp
    tap_action:
      action: toggle
