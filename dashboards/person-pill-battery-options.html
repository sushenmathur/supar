<!doctype html><meta charset="utf-8"><title>Person pill battery ring</title>
<style>
:root{--t:#14203a;--s:rgba(20,32,58,.62);--rgb:20,32,58;--bg:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.34));--bd:rgba(255,255,255,.85);--sh:0 16px 40px rgba(60,70,130,.22);--ok:#15803d;--lo:#ef4444;--wa:#f59e0b;--gk:#10b981;
--wall:radial-gradient(700px 520px at 10% 8%,rgba(255,190,150,.65),transparent 70%),radial-gradient(640px 500px at 62% 30%,rgba(150,200,255,.6),transparent 70%),linear-gradient(160deg,#eef2fb,#e4eaf7)}
.dark{--t:#fff;--s:rgba(255,255,255,.62);--rgb:255,255,255;--bg:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));--bd:rgba(255,255,255,.22);--sh:0 18px 44px rgba(0,0,0,.38);--ok:#6ee7b7;
--wall:radial-gradient(620px 480px at 12% 8%,rgba(80,110,255,.35),transparent 70%),linear-gradient(160deg,#0b1020,#10182f 50%,#0a1a26)}
body{margin:0;font:14px Poppins,system-ui,sans-serif;color:var(--t)}
.panel{background:var(--wall);padding:20px 24px;color:var(--t)}
h3{margin:14px 0 8px;font-size:13px;color:var(--s);font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap}
.pill{height:48px;border-radius:22px;padding:0 10px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);box-shadow:var(--sh);width:210px;box-sizing:border-box}
.av{width:28px;height:28px;border-radius:50%;background:#7c8cf8;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.tx{flex:1;min-width:0;line-height:1.15}.nm{font-size:13px;font-weight:600}.pl{font-size:11px;color:var(--s)}
.ring{position:relative;width:34px;height:34px;flex:none}
.ring.chg{animation:pulse 1.6s ease-in-out infinite}
.ring .arc{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.ring svg{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;fill:var(--t)}
.pct{font-size:12px;font-weight:700;min-width:30px;text-align:right}
.ring.sm{width:30px;height:30px}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 6px var(--c))}}
.lab{font-size:11px;color:var(--s);width:210px;text-align:center;margin-top:4px}
</style>
<body>
<script>
const PH='<path d="M17,19H7V5H17M17,1H7C5.89,1 5,1.89 5,3V21A2,2 0 0,0 7,23H17A2,2 0 0,0 19,21V3C19,1.89 18.1,1 17,1Z"/>';
const CH='<path d="M17,1H7C5.9,1 5,1.9 5,3V21A2,2 0 0,0 7,23H17A2,2 0 0,0 19,21V3C19,1.9 18.1,1 17,1M17,19H7V5H17V19M12.5,7L9.5,12.5H11.5V17L14.5,11.5H12.5V7Z"/>';
const col=p=>p<20?'var(--lo)':p<50?'var(--wa)':'var(--gk)';
function ring(p,chg,sm){const c=col(p);return `<div class="ring ${chg?'chg':''} ${sm?'sm':''}" style="--c:${c}"><div class="arc" style="background:conic-gradient(${c} ${p*3.6}deg,rgba(var(--rgb),.15) 0)"></div><svg viewBox="0 0 24 24">${chg?CH:PH}</svg></div>`}
const pill=(n,pl,p,chg,opt)=>`<div><div class="pill"><div class="av">${n[0]}</div><div class="tx"><div class="nm">${n}</div><div class="pl">${pl}${opt=='B'&&chg?' · Charging':''}</div></div>${opt=='A'?`<span class="pct" style="color:${chg?'var(--ok)':'var(--t)'}">${p}%</span>`:''}${ring(p,chg,opt=='B')}</div></div>`;
const cases=[['Sushen','Home',65,0,'idle'],['Paro','Office',44,0,'below 50%'],['Sushen','Home',14,0,'low'],['Paro','Home',44,1,'charging (ring pulses)']];
function block(mode){return `<div class="panel ${mode}"><b>${mode}</b>`+['A','B'].map(o=>`<h3>Option ${o}: ${o=='A'?'% text + ring at right':'ring only, status text under name'}</h3><div class="row">${cases.map(c=>`<div>${pill(c[0],c[1],c[2],c[3],o)}<div class="lab">${c[4]}</div></div>`).join('')}</div>`).join('')+`</div>`}
document.body.innerHTML=block('light')+block('dark');
</script>
