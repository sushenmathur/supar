          - text-align: left
      - type: custom:button-card
        entity: input_number.kia_battery_estimate
        entity_picture: /local/kia1.png
        name: Sorento
        show_entity_picture: true
        show_icon: false
        show_label: true
        show_name: true
        triggers_update:
        - input_number.kia_battery_estimate
        - input_boolean.kia_onroad
        - device_tracker.kia_gps_location
        label: |
          [[[
            const battery = Math.round(states['input_number.kia_battery_estimate'].state);
            const onroad = states['input_boolean.kia_onroad'].state === 'on';
            let location = 'Away';
            const zones = states['device_tracker.kia_gps_location'].attributes.in_zones;
            const zoneId = Array.isArray(zones) && zones.length > 0 ? zones[0] : null;
            if (onroad) { location = 'Driving'; }
            else if (zoneId === 'zone.home') { location = 'Home'; }
            else if (zoneId && zoneId.indexOf('_work') !== -1) { location = 'Work'; }
            return `<div style="font-size:22px;font-weight:800;color:#8BC34A;line-height:1.1">${battery}%</div>
                    <div style="font-size:11px;opacity:.7">${location}</div>`;
          ]]]
        styles:
          card:
          - padding: 10px
          - border-radius: 18px
          - height: 84px
          entity_picture:
          - width: 52px
          grid:
          - grid-template-areas: '"i n" "i l"'
          - grid-template-columns: 58px 1fr
          - align-items: center
          name:
          - justify-self: start
          - font-size: 13px
          - font-weight: 700
          label:
          - justify-self: start
          - text-align: left
