title: Mobile Dashboard
path: mobile-hub
icon: cil:iphone-modern
type: sections
max_columns: 1
dense_section_placement: true
badges: []
cards: []

# ---------------------------------------------------------------------
# Header: greeting + name, family avatars, weather / date / ETA strip
# ---------------------------------------------------------------------
header:
  card:
    type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
      - weather.north_lakes_weather
      - weather.forecast_home_2
      - sensor.home_apparent_temperature
      - person.sushenmathur
      - person.paro
      - sensor.sushen_eta_home_2
      - sensor.paro_eta_home_2
    custom_fields:
      greet: |
        [[[
          const h = new Date().getHours();
          const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
          return `
            <div style="font-size:11px;font-weight:600;color:var(--secondary-text-color);letter-spacing:.02em">${g}</div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05;
              background:linear-gradient(90deg,#ff8a3d,#e9a400);-webkit-background-clip:text;
              background-clip:text;-webkit-text-fill-color:transparent">${user.name}</div>`;
        ]]]
      sushen:
        card:
          type: custom:button-card
          template: b_avatar
          entity: person.sushenmathur
      paro:
        card:
          type: custom:button-card
          template: b_avatar
          entity: person.paro
      wx: |
        [[[
          const cond = states['weather.north_lakes_weather'] ? states['weather.north_lakes_weather'].state : '';
          const map = {
            'clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog',
            'hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy',
            'partlycloudy':'mdi:weather-partly-cloudy','pouring':'mdi:weather-pouring','rainy':'mdi:weather-rainy',
            'snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','sunny':'mdi:weather-sunny',
            'windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:alert-circle-outline'
          };
          const icon = map[cond] || 'mdi:weather-cloudy';
          const pretty = cond ? cond.charAt(0).toUpperCase() + cond.slice(1) : '';
          const w = states['weather.forecast_home_2'] ? states['weather.forecast_home_2'].attributes : {};
          const feels = states['sensor.home_apparent_temperature'] ? states['sensor.home_apparent_temperature'].state : '–';
          const date = new Date().toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });

          const etaFor = (person, sensor) => {
            if (!states[person] || states[person].state === 'home') return '';
            const m = Math.round(Math.abs(parseFloat(states[sensor] ? states[sensor].state : 0) || 0));
            if (!m) return '';
            return ' · 🚗 ' + (m >= 60 ? `${Math.floor(m / 60)}hr ${m % 60}min` : `${m} mins`) + ' to home';
          };
          let eta = '';
          if (user.name === 'Sushen') eta = etaFor('person.sushenmathur', 'sensor.sushen_eta_home_2');
          else if (user.name === 'Paro') eta = etaFor('person.paro', 'sensor.paro_eta_home_2');

          return `
            <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;
              background:rgba(var(--rgb-primary-text-color),0.05);border:1px solid rgba(var(--rgb-primary-text-color),0.1);text-align:left">
              <div style="display:flex;align-items:center;gap:4px;font-size:26px;font-weight:600;line-height:1;white-space:nowrap">
                <ha-icon icon="${icon}" style="--mdc-icon-size:24px;color:#ffc53d"></ha-icon>${w.temperature ?? '–'}°
              </div>
              <div style="font-size:11.5px;line-height:1.35;color:var(--secondary-text-color);min-width:0">
                <b style="color:var(--primary-text-color)">${pretty}</b> · feels ${feels}° · ${w.humidity ?? '–'}%<br>${date}${eta}
              </div>
            </div>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 4px 4px 0
        - overflow: visible
      grid:
        - grid-template-areas: '"greet sushen paro" "wx wx wx"'
        - grid-template-columns: 1fr auto auto
        - column-gap: 10px
        - row-gap: 10px
        - align-items: end
      custom_fields:
        greet:
          - justify-self: start
          - text-align: left
        wx:
          - justify-self: stretch

sections:

  # -------------------------------------------------------------------
  # Alerts (unchanged)
  # -------------------------------------------------------------------
  - type: grid
    cards:
      - type: custom:alert-ticker-card
        alerts:
          - conditions: []
            entity: binary_sensor.garage_door_sensor_contact
            icon: 🚨
            message: Garage Door Open
            name: Garage Door
            operator: '='
            priority: 1
            secondary_entity: switch.sonoff_1000f6b15b
            state: 'on'
            theme: emergency
            tts_engine: tts.google_ai_tts
            tts_entity: media_player.kitchen_speaker
            tts_notify_service: mobile_app_sushen_iphone
            use_ha_icon: false
            visible_to: null
          - conditions:
              - entity: binary_sensor.crimsafe_door_contact
                operator: '='
                state: 'on'
            entity: binary_sensor.front_door_contact
            icon: 🚨
            message: Front Door Open
            operator: '='
            priority: 1
            state: 'on'
            theme: emergency
            use_ha_icon: false
          - entity: binary_sensor.crimsafe_door_contact
            icon: 🔔
            message: Security Door Open
            name: Security Screen Open
            operator: '='
            priority: 3
            state: 'on'
            theme: notification
          - entity: binary_sensor.patio_door_contact
            icon: 🚪
            message: Patio Door
            name: Patio
            operator: '='
            priority: 3
            push_notify: true
            push_notify_service: mobile_app_suparhub2
            state: 'on'
            theme: door
          - entity: binary_sensor.laundrydoorsensor_contact
            icon: 🚪
            message: Laundry Door Door
            name: Laundry Door Open
            operator: '='
            priority: 3
            state: 'on'
            theme: door
          - entity: binary_sensor.side_door_contact
            icon: ''
            message: Side Door
            name: Side Door
            operator: '='
            priority: 1
            state: 'on'
            theme: emergency
          - entity: sensor.robbie_dock_dock_error
            icon: 💧
            message: Roborock Water Tank Empty
            name: Vaccum Water Tank Empty
            operator: '!='
            priority: 3
            state: ok
            theme: leak
        clear_message: ''
        clear_theme: success
        cycle_animation: slide
        cycle_interval: 5
        grid_options:
          columns: 12
          rows: auto
        ha_theme: true
        overlay_duration: 10
        overlay_mode: true
        overlay_position: bottom
        overlay_scale: 1.5
        show_when_clear: false
        swipe_to_snooze: true

  # -------------------------------------------------------------------
  # Status row + Security squares + Calendar
  # -------------------------------------------------------------------
  - type: grid
    cards:
      - type: grid
        columns: 5
        square: false
        cards:
          - type: custom:button-card
            template: b_round
            entity: device_tracker.kia_gps_location
            name: Kia
            icon: mdi:car
            variables:
              tint: var(--primary-text-color)
          - type: custom:button-card
            template: b_round
            entity: device_tracker.bluey_location
            name: Tesla
            icon: mdi:car-electric
            variables:
              tint: var(--blue-color)
          - type: custom:button-card
            template: b_round
            entity: sensor.general_waste_daysto
            name: Bins
            icon: mdi:trash-can-outline
            triggers_update:
              - sensor.recycle_waste_daysto
              - sensor.garden_waste_daysto
            variables:
              tint: var(--amber-color)
            state_display: |
              [[[
                const due = s => [0, 1].includes(parseInt(states[s] ? states[s].state : 99));
                let out = '';
                if (due('sensor.general_waste_daysto')) out += '🔴';
                if (due('sensor.recycle_waste_daysto')) out += '🟡';
                if (due('sensor.garden_waste_daysto')) out += '🟢';
                return out ? out + ' out' : 'None due';
              ]]]
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: sensor.garden_waste_daysto
                    above: 0
                    below: 2
                  - condition: numeric_state
                    entity: sensor.general_waste_daysto
                    above: 0
                    below: 2
                  - condition: numeric_state
                    entity: sensor.recycle_waste_daysto
                    above: 0
                    below: 2
          - type: custom:button-card
            template: b_round
            entity: binary_sensor.shanaya_room_occupancy_status
            name: Shanaya
            icon: mdi:teddy-bear
            state_display: |
              [[[ return entity.state === 'on' ? 'Occupied' : 'Clear'; ]]]
            variables:
              tint: |
                [[[ return entity.state === 'on' ? 'var(--red-color)' : 'var(--green-color)'; ]]]
          - type: custom:button-card
            template: b_round
            entity: binary_sensor.samar_room_occupancy_new
            name: Samar
            icon: mdi:bed
            state_display: |
              [[[ return entity.state === 'on' ? 'Occupied' : 'Clear'; ]]]
            variables:
              tint: |
                [[[ return entity.state === 'on' ? 'var(--red-color)' : 'var(--green-color)'; ]]]

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: b_sq
            entity: cover.garage_door_v2
            name: Garage Door
            tap_action:
              action: toggle
            triggers_update:
              - input_select.garage_door_state
            variables:
              on_color: rgba(255, 90, 79, 0.92)
              on_text: '#ffffff'
            icon: |
              [[[
                const s = entity.state;
                if (s === 'open') return 'mdi:garage-open-variant';
                if (s === 'opening') return 'mdi:arrow-up-bold-box-outline';
                if (s === 'closing') return 'mdi:arrow-down-bold-box-outline';
                return 'mdi:garage-variant';
              ]]]
            state_display: |
              [[[ return states['input_select.garage_door_state'] ? states['input_select.garage_door_state'].state : entity.state; ]]]
          - type: custom:button-card
            template: b_sq
            entity: input_boolean.front_door
            name: Front Door
            tap_action:
              action: toggle
            triggers_update:
              - binary_sensor.front_door_contact
            variables:
              on_color: rgba(255, 90, 79, 0.92)
              on_text: '#ffffff'
            icon: |
              [[[ return entity.state === 'off' ? 'mdi:lock' : 'mdi:lock-off-outline'; ]]]
            state_display: |
              [[[ return entity.state === 'off' ? 'Locked' : 'Unlocked'; ]]]
            custom_fields:
              door: |
                [[[
                  return states['binary_sensor.front_door_contact'] && states['binary_sensor.front_door_contact'].state === 'on'
                    ? '<ha-icon icon="mdi:door-open" style="--mdc-icon-size:16px;color:var(--red-color)"></ha-icon>'
                    : '';
                ]]]
            styles:
              custom_fields:
                door:
                  - position: absolute
                  - top: 8px
                  - right: 8px
          - type: custom:button-card
            template: b_sq
            entity: alarm_control_panel.home_alarm
            name: Alarm
            icon: mdi:shield-home
            variables:
              on_color: rgba(48, 209, 88, 0.9)
              on_text: '#04210d'
              active: |
                [[[ return entity.state !== 'disarmed' && entity.state !== 'unavailable'; ]]]
          - type: picture-entity
            entity: camera.driveway_live_view
            camera_image: camera.driveway_live_view
            camera_view: auto
            aspect_ratio: '112%'
            fit_mode: cover
            name: Driveway
            show_name: true
            show_state: false

      - type: custom:calendar-card-pro
        entities:
          - calendar.supar_family
        compact_days_to_show: 1
        compact_events_complete_days: true
        compact_events_to_show: 3
        filter_duplicates: true
        show_location: false
        tap_action:
          action: expand
        today_weekday_color: Blue
        visibility:
          - condition: screen
            media_query: '(min-width: 0px)'
          - condition: state
            entity: sensor.upcoming_events
            state_not: none
        weather:
          date:
            color: var(--primary-text-color)
            font_size: 12px
            icon_size: 14px
            show_conditions: true
            show_high_temp: true
            show_low_temp: false
          event:
            color: var(--primary-text-color)
            font_size: 12px
            icon_size: 14px
            show_conditions: true
            show_temp: true
          position: event

  # -------------------------------------------------------------------
  # Tabs
  # -------------------------------------------------------------------
  - type: grid
    cards:
      - type: custom:simple-tabs
        alignment: center
        bar_background: glass
        button_active_background: Orange
        haptic_feedback: true
        hide_inactive_tab_titles: true
        remember_tab: per_device
        tabs:

          # ---------------- Favourites ----------------
          - id: 'TabFav '
            title: Favourites
            icon: mdi:heart
            cards:
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: entity
                    entity: script.say_tts_message
                    content_info: name
                  - type: entity
                    entity: script.attention_paro
                    icon: mdi:phone
                    content_info: name
                  - type: entity
                    entity: script.lost_phone
                    content_info: name
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    template: b_sq
                    entity: scene.good_night
                    name: Good Night
                    show_state: false
                    variables:
                      icon_color: var(--blue-color)
                  - type: custom:button-card
                    template: b_sq
                    entity: scene.good_morning
                    name: Good Morning
                    show_state: false
                    variables:
                      icon_color: var(--amber-color)
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.kitchen_pendant_lights
                    name: Pendant Lights
                    icon: mdi:ceiling-light-multiple
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.driveway_light_2
                    name: Driveway
                    icon: mdi:light-flood-down
                  - type: custom:button-card
                    template: b_sq
                    entity: cover.garage_door_v2
                    name: Garage
                    icon: mdi:garage-variant
                    tap_action:
                      action: toggle
                    variables:
                      on_color: rgba(255, 90, 79, 0.92)
                      on_text: '#ffffff'
                  - type: custom:button-card
                    template: b_sq
                    entity: media_player.tv
                    name: Netflix
                    icon: phu:netflix
                    show_state: false
                    variables:
                      icon_color: '#E50914'
                      active: |
                        [[[ return entity.attributes.source === 'Netflix'; ]]]
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.tv
                      data:
                        source: Netflix
                  - type: custom:button-card
                    template: b_sq
                    entity: media_player.tv
                    name: YouTube
                    icon: phu:youtube
                    show_state: false
                    variables:
                      icon_color: '#FF0000'
                      active: |
                        [[[ return entity.attributes.source === 'YouTube'; ]]]
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.tv
                      data:
                        source: YouTube
                  - type: custom:button-card
                    template: b_sq
                    entity: media_player.tv
                    name: Stremio
                    icon: phu:stremio
                    show_state: false
                    variables:
                      icon_color: '#61D3E4'
                      active: |
                        [[[ return entity.attributes.source === 'Stremio'; ]]]
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.tv
                      data:
                        source: Stremio
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: media_player.tv
                    show_entity_picture: true
                    vertical: false
                    features:
                      - type: media-player-playback
                    features_position: bottom
                    state_content:
                      - state
                      - source
                    hold_action:
                      action: toggle
                    icon_tap_action:
                      action: perform-action
                      perform_action: script.media_tv_power
                      target: {}
                  - type: tile
                    entity: media_player.kitchen_speaker
                    show_entity_picture: true
                    vertical: false
                    features:
                      - type: media-player-playback
                    features_position: bottom
                    state_content:
                      - state
                      - source
                    tap_action:
                      action: more-info

          # ---------------- Lights ----------------
          - id: tab2
            title: Lights
            icon: mdi:lightbulb
            badge_display: dot
            badge_templates:
              - >-
                {{ states.light | selectattr('state', 'eq', 'on')
                | rejectattr('entity_id', 'search', '^light\.browser')
                | list | count }}
            cards:
              # All Lights: opens the #all-lights pop-up (hold for the old /light page)
              - type: custom:button-card
                template: b_wide
                name: All Lights
                icon: mdi:lightbulb-group
                triggers_update: all
                tap_action:
                  action: navigate
                  navigation_path: '#all-lights'
                hold_action:
                  action: navigate
                  navigation_path: /light
                variables:
                  icon_color: var(--amber-color)
                  active: false
                state_display: |
                  [[[
                    const n = Object.values(states).filter(e =>
                      e.entity_id.startsWith('light.') && !e.entity_id.startsWith('light.browser') && e.state === 'on').length;
                    return n ? `${n} on · tap to see all` : 'All off · tap to see all';
                  ]]]
                custom_fields:
                  chev: '<ha-icon icon="mdi:chevron-up" style="--mdc-icon-size:20px;color:var(--secondary-text-color)"></ha-icon>'
                styles:
                  grid:
                    - grid-template-areas: '"i n chev" "i s chev"'
                    - grid-template-columns: 36px 1fr auto
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.kitchen_pendants
                    name: Pendant Lights
                    icon: mdi:ceiling-light-multiple
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.kitchen_downlights
                    icon: mdi:light-recessed
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.sonoff_1000dbd8b7
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.hallway_light
                    icon: mdi:light-recessed
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.dining_light
                    icon: mdi:light-recessed
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.corridor_light
                    icon: mdi:light-recessed

          # ---------------- Kids ----------------
          - title: Kids
            icon: mdi:teddy-bear
            cards:
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    template: b_sq_light
                    entity: light.aarlo_samar_cam
                    name: Samar Light
                    icon: mdi:lightbulb
                  - type: custom:button-card
                    template: b_sq
                    entity: media_player.aarlo_samar_cam
                    name: White Noise
                    icon: mdi:waveform
                    variables:
                      on_color: rgba(76, 141, 255, 0.9)
                      on_text: '#ffffff'
                  - type: custom:button-card
                    template: b_sq
                    entity: sensor.aarlo_temperature_samar_cam
                    name: Samar Room
                    icon: mdi:thermometer
                    variables:
                      icon_color: var(--amber-color)
                  - type: custom:button-card
                    template: b_sq
                    entity: sensor.shanayaroomtemp_temperature
                    name: Shanaya Room
                    icon: cil:home-climate
                    variables:
                      icon_color: var(--amber-color)
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: picture-entity
                    entity: camera.aarlo_samar_cam
                    camera_image: camera.aarlo_samar_cam
                    camera_view: live
                    fit_mode: fill
                    name: Samar Room
                    show_name: true
                    show_state: false
                  - type: picture-entity
                    entity: camera.shanaya_cam_live_view
                    camera_image: camera.shanaya_cam_live_view
                    camera_view: live
                    fit_mode: fill
                    name: Shanaya Room
                    show_name: true
                    show_state: false

          # ---------------- Tesla ----------------
          - title: Tesla
            icon: mdi:car-sports
            card:
              type: custom:button-card
              entity: sensor.bluey_battery_level
              show_icon: false
              show_name: false
              show_state: false
              triggers_update:
                - sensor.bluey_battery_level
                - sensor.bluey_battery_range
                - sensor.bluey_shift_state
                - binary_sensor.bluey_charge_cable
                - switch.bluey_charge
                - sensor.bluey_inside_temperature
                - sensor.bluey_time_to_full_charge
                - input_boolean.bluey_show_range
                - lock.bluey_lock
                - climate.bluey_climate
                - cover.bluey_trunk
                - cover.bluey_frunk
                - cover.bluey_charge_port_door
                - device_tracker.bluey_location
                - number.bluey_charge_limit
                - number.bluey_charge_current
              extra_styles: |
                @keyframes chargepulse {
                  0% { opacity: 0.25; transform: scale(0.85); }
                  50% { opacity: 0.9; transform: scale(1.08); }
                  100% { opacity: 0.25; transform: scale(0.85); }
                }
              custom_fields:
                header: |
                  [[[
                    const showRange = states['input_boolean.bluey_show_range'].state === 'on';
                    const battery = Math.round(states['sensor.bluey_battery_level'].state);
                    const range = Math.round(states['sensor.bluey_battery_range'].state);
                    const charging = states['switch.bluey_charge'].state === 'on';
                    const battColor = battery < 20 ? '#ff453a' : '#30d158';
                    const battIcon = charging ? 'mdi:battery-charging' : 'mdi:battery';
                    let shift = (states['sensor.bluey_shift_state'].state || '').toUpperCase();
                    const shiftMap = { P: 'Parked', D: 'Driving', R: 'Reverse', N: 'Neutral', UNKNOWN: 'Parked' };
                    shift = shiftMap[shift] || 'Parked';
                    return `
                      <div style="display:flex;flex-direction:column;align-items:flex-start;text-align:left;">
                        <div style="font-size:26px;font-weight:700;line-height:1.05;color:#fff;">Bluey</div>
                        <div onclick="event.stopPropagation(); document.querySelector('home-assistant').hass.callService('input_boolean','toggle',{entity_id:'input_boolean.bluey_show_range'});"
                          style="display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer;">
                          <ha-icon icon="${battIcon}" style="color:${battColor};--mdc-icon-size:18px;width:18px;height:18px;"></ha-icon>
                          <span style="font-size:16px;font-weight:600;color:#e5e5e5;">${showRange ? range + ' km' : battery + '%'}</span>
                        </div>
                        <div style="font-size:12px;color:#8f8f8f;margin-top:2px;">${shift}</div>
                      </div>`;
                  ]]]
                car: |
                  [[[
                    const cableConnected = states['binary_sensor.bluey_charge_cable'].state === 'on';
                    const charging = states['switch.bluey_charge'].state === 'on';
                    const carImage = cableConnected ? '/local/tesla_charging.png' : '/local/bluey_icon.png';
                    const chargePulse = charging ? `
                      <div style="position:absolute;bottom:2%;left:50%;transform:translateX(-50%);width:70%;height:12px;pointer-events:none;">
                        <div style="position:absolute;inset:0;border-radius:999px;
                          background:radial-gradient(ellipse at center, rgba(0,255,136,0.6) 0%, rgba(0,255,136,0) 72%);
                          animation: chargepulse 1.6s ease-in-out infinite;"></div>
                      </div>` : '';
                    return `
                      <div style="position:relative;width:100%;max-width:220px;margin-left:auto;">
                        <img src="${carImage}" style="width:100%;display:block;">
                        ${chargePulse}
                      </div>`;
                  ]]]
                actions:
