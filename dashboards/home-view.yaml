        label: |
          [[[
            const battery = states['sensor.bluey_battery_level'].state;
            const range = Math.round(states['sensor.bluey_battery_range'].state);
            const shift = (states['sensor.bluey_shift_state'].state || '').toLowerCase();
            let location = 'Away';
            const zones = states['device_tracker.bluey_location'].attributes.in_zones;
            const zoneId = Array.isArray(zones) && zones.length > 0 ? zones[0] : null;
            if (shift === 'd') { location = 'Driving'; }
            else if (zoneId === 'zone.home') { location = 'Home'; }
            else if (zoneId && zoneId.indexOf('_work') !== -1) { location = 'Work'; }
            return `<div style="font-size:22px;font-weight:800;color:#8BC34A;line-height:1.1">${battery}%</div>
                    <div style="font-size:11px;opacity:.7">${range} km · ${location}</div>`;
          ]]]
        styles:
          card:
