        routes:
          - icon: mdi:home-assistant
            icon_color: Orange
            icon_selected: ''
            label: Home
            url: /mobile-hub/mobile-hub
          - hold_action:
              action: navigate
              navigation_path: /config/devices/dashboard
            icon: mdi:webcam
            label: Cameras
            url: /mobile-hub/mobile-cameras
          - icon: mdi:music
            label: Media
            url: /mobile-hub/media
          - icon: mdi:home-thermometer
            label: Climate
            url: /mobile-hub/hvac-mobile
          - icon: mdi:devices
            icon_selected: ''
            label: Devices
            url: /mobile-hub/devices-mobile
          - icon: mdi:dots-horizontal
            icon_color: '[[[Orange]]]'
            label: More
            popup:
              - icon: mdi:cog
                url: /config/dashboard
              - icon: mdi:hammer
                url: /developer-tools/yaml
              - icon: mdi:power
                tap_action:
                  action: call-service
                  confirmation:
                    text: Are you sure you want to restart Home Assistant?
                  service: homeassistant.restart
                  service_data: {}
            tap_action:
              action: open-popup
        styles: |+
          .navbar-card.mobile.floating {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px !important;
            box-shadow:
              0 8px 32px rgba(0, 0, 0, 0.2),
              inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
          }

          .button.active {
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(8px);
            border-radius: 25px !important;
            width: 50px !important;
            height: 56px !important;
            min-width: 40px !important;
            min-height: 56px !important;
            margin: 0 auto !important;
          }

          .route {
            overflow: visible !important;
          }
          .icon.active {
            color: #ffffff;
          }

          .navbar-popup {
            background: rgba(20, 20, 20, 0.3) !important;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px !important;
          }

          .popup-item .button {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(6px);

          }

          .navbar-card.mobile.floating {
            bottom: 24px !important;
            margin: 0 16px !important;
            min-height: 64px !important;
            padding: 8px 0 !important;
            overflow: visible !important;
          }

          .navbar.mobile.floating {
            bottom: 0 !important;
          }

          .icon {
            --navbar-route-icon-size: 22px;
          }

          .button {
            min-width: 52px !important;
            min-height: 52px !important;
          }

        type: custom:navbar-card
