title: Mobile Dashboard
path: mobile-hub
icon: cil:iphone-modern
type: sections
max_columns: 1
dense_section_placement: true
badges: []
cards: []
header:
  card:
    type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - person.sushenmathur
    - person.paro
    - sensor.sushen_current_to_home_driving_time
    - sensor.paro_current_to_home_driving_time
    custom_fields:
      greet: |-
        [[[
          const h = new Date().getHours();
          const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
          const date = new Date().toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
          const etaFor = (person, sensor) => {
            if (!states[person] || states[person].state === 'home') return '';
            const m = Math.round(Math.abs(parseFloat(states[sensor] ? states[sensor].state : 0) || 0));
            if (!m) return '';
            return ' · ' + (m >= 60 ? `${Math.floor(m / 60)}hr ${m % 60}min` : `${m} min`) + ' from home';
          };
          let eta = '';
          if (user.name === 'Sushen') eta = etaFor('person.sushenmathur', 'sensor.sushen_current_to_home_driving_time');
          else if (user.name === 'Paro') eta = etaFor('person.paro', 'sensor.paro_current_to_home_driving_time');
          return `<div style="font-size:11.5px;font-weight:600;color:var(--secondary-text-color)">${date} · ${g}${eta}</div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1">${user.name}</div>`;
        ]]]
      sushen:
        card:
          type: custom:button-card
          template: b_avatar
          entity: person.sushenmathur
      paro:
        card:
          type: custom:button-card
          template: b_avatar
          entity: person.paro
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 4px 4px 0
      - overflow: visible
      grid:
      - grid-template-areas: '"greet sushen paro"'
      - grid-template-columns: 1fr auto auto
      - column-gap: 8px
      - align-items: end
      custom_fields:
        greet:
        - justify-self: start
        - text-align: left
sections:
- type: grid
  cards:
  - type: custom:alert-ticker-card
    alerts:
    - conditions: []
      entity: binary_sensor.garage_door_sensor_contact
      icon: 🚨
      message: Garage Door Open
      name: Garage Door
      operator: '='
      priority: 1
      secondary_entity: switch.sonoff_1000f6b15b
      state: 'on'
      theme: emergency
      tts_engine: tts.google_ai_tts
      tts_entity: media_player.kitchen_speaker
      tts_notify_service: mobile_app_sushen_iphone
      use_ha_icon: false
      visible_to: null
    - conditions:
      - entity: binary_sensor.crimsafe_door_contact
        operator: '='
        state: 'on'
      entity: binary_sensor.front_door_contact
      icon: 🚨
      message: Front Door Open
      operator: '='
      priority: 1
      state: 'on'
      theme: emergency
      use_ha_icon: false
    - entity: binary_sensor.crimsafe_door_contact
      icon: 🔔
      message: Security Door Open
      name: Security Screen Open
      operator: '='
      priority: 3
      state: 'on'
      theme: notification
    - entity: binary_sensor.patio_door_contact
      icon: 🚪
      message: Patio Door
      name: Patio
      operator: '='
      priority: 3
      push_notify: true
      push_notify_service: mobile_app_suparhub2
      state: 'on'
      theme: door
    - entity: binary_sensor.laundrydoorsensor_contact
      icon: 🚪
      message: Laundry Door Door
      name: Laundry Door Open
      operator: '='
      priority: 3
      state: 'on'
      theme: door
    - entity: binary_sensor.side_door_contact
      icon: ''
      message: Side Door
      name: Side Door
      operator: '='
      priority: 1
      state: 'on'
      theme: emergency
    - entity: sensor.robbie_dock_dock_error
      icon: 💧
      message: Roborock Water Tank Empty
      name: Vaccum Water Tank Empty
      operator: '!='
      priority: 3
      state: ok
      theme: leak
    clear_message: ''
    clear_theme: success
    cycle_animation: slide
    cycle_interval: 5
    grid_options:
      columns: 12
      rows: auto
    ha_theme: true
    overlay_duration: 10
    overlay_mode: true
    overlay_position: bottom
    overlay_scale: 1.5
    show_when_clear: false
    swipe_to_snooze: true
- type: grid
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: b_bento
      variables:
        label: Outside
        icon: mdi:weather-partly-cloudy
        tint: '#ffc53d'
        height: 248px
      tap_action:
        action: navigate
        navigation_path: /mobile-hub/hvac-mobile
      triggers_update:
      - weather.north_lakes_weather
      - weather.forecast_home_2
      - sensor.home_apparent_temperature
      - sensor.living_room_inside_temperature
      - sensor.bedroom_temperature_temperature
      - sensor.aarlo_temperature_samar_cam
      - sensor.shanayaroomtemp_temperature
      - climate.bed_ac
      - climate.living_room
      - climate.samar_room
      - climate.shanaya_room
      custom_fields:
        body: |-
          [[[
            const w = states['weather.forecast_home_2'] ? states['weather.forecast_home_2'].attributes : {};
            const cond = states['weather.north_lakes_weather'] ? states['weather.north_lakes_weather'].state : '';
            const pretty = cond === 'partlycloudy' ? 'Partly cloudy' : cond === 'clear-night' ? 'Clear night'
              : cond.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());
            const feels = states['sensor.home_apparent_temperature'] ? states['sensor.home_apparent_temperature'].state : '–';
            const rooms = ['sensor.living_room_inside_temperature', 'sensor.bedroom_temperature_temperature',
                           'sensor.aarlo_temperature_samar_cam', 'sensor.shanayaroomtemp_temperature']
              .map(s => parseFloat(states[s] ? states[s].state : NaN)).filter(n => !isNaN(n));
            const inside = rooms.length ? (rooms.reduce((a, b) => a + b, 0) / rooms.length).toFixed(1) : '–';
            const run = ['climate.bed_ac', 'climate.living_room', 'climate.samar_room', 'climate.shanaya_room']
              .filter(a => states[a] && !['off', 'unavailable'].includes(states[a].state)).length;
            return `<div style="font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px;margin-top:8px">${w.temperature ?? '–'}°</div>
              <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:4px;line-height:1.35">${pretty}<br>feels ${feels}° · ${w.humidity ?? '–'}%</div>
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--secondary-text-color);margin-top:18px">
                <ha-icon icon="mdi:home-thermometer" style="--mdc-icon-size:15px"></ha-icon>Inside</div>
              <div style="font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px;margin-top:8px;font-size:24px">${inside}°</div>
              <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:4px;line-height:1.35">4 rooms · ${run ? run + ' AC on' : 'ACs off'}</div>`;
          ]]]
    - type: vertical-stack
      cards:
      - type: custom:button-card
        template: b_bento
        variables:
          label: Security
          icon: mdi:shield-home
          tint: |-
            [[[
              const g = states['cover.garage_door_v2'], f = states['input_boolean.front_door'];
              return (g && g.state !== 'closed') || (f && f.state === 'on') ? 'var(--red-color)' : 'var(--green-color)';
            ]]]
          height: 120px
        tap_action:
          action: navigate
          navigation_path: '#security'
        triggers_update:
        - cover.garage_door_v2
        - input_boolean.front_door
        - alarm_control_panel.home_alarm
        custom_fields:
          body: |-
            [[[
              const g = states['cover.garage_door_v2'], f = states['input_boolean.front_door'], a = states['alarm_control_panel.home_alarm'];
              const gOpen = g && g.state !== 'closed';
              const fOpen = f && f.state === 'on';
              const armed = a && !['disarmed', 'unavailable'].includes(a.state);
              const head = gOpen ? ['Garage open', 'var(--red-color)'] : fOpen ? ['Door unlocked', 'var(--red-color)'] : ['All locked', 'var(--primary-text-color)'];
              const tile = (i, t, bad) => `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;
                  background:${bad ? 'color-mix(in srgb, var(--red-color) 18%, transparent)' : 'rgba(var(--rgb-primary-text-color),0.07)'};
                  font-size:9.5px;font-weight:600;color:var(--secondary-text-color)">
                  <ha-icon icon="${i}" style="--mdc-icon-size:18px;color:${bad ? 'var(--red-color)' : 'var(--primary-text-color)'}"></ha-icon>${t}</div>`;
              return `<div style="font-size:17px;font-weight:700;margin-top:6px;color:${head[1]}">${head[0]}</div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px">
                  ${tile(gOpen ? 'mdi:garage-open-variant' : 'mdi:garage-variant', 'Garage', gOpen)}
                  ${tile(fOpen ? 'mdi:lock-open-variant' : 'mdi:lock', 'Front', fOpen)}
                  ${tile('mdi:shield-home', armed ? 'Armed' : 'Alarm', false)}
                </div>`;
            ]]]
      - type: custom:button-card
        template: b_bento
        variables:
          label: Lights
          icon: mdi:lightbulb-group
          tint: '#ff9a56'
          height: 120px
        tap_action:
          action: navigate
          navigation_path: '#all-lights'
        triggers_update: all
        custom_fields:
          body: |-
            [[[
              const n = Object.values(states).filter(e => e.entity_id.startsWith('light.')
                && !e.entity_id.startsWith('light.browser') && e.state === 'on').length;
              return `<div style="font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px;margin-top:8px">${n}<span style="font-size:13px;font-weight:600;color:var(--secondary-text-color);margin-left:3px">on</span></div>`;
            ]]]
          toggles:
            card:
              type: horizontal-stack
              cards:
              - type: custom:button-card
                template: b_mini
                entity: light.kitchen_pendants
                icon: mdi:vanity-light
              - type: custom:button-card
                template: b_mini
                entity: light.sonoff_1000dbd8b7
                icon: mdi:light-recessed
              - type: custom:button-card
                template: b_mini
                entity: light.dining_light
                icon: mdi:ceiling-light
        styles:
          grid:
          - grid-template-areas: '"lbl" "body" "toggles"'
          - grid-template-rows: min-content 1fr min-content
  - type: custom:button-card
    template: b_bento
    variables:
      label: Energy now
      icon: mdi:lightning-bolt
      tint: '#ffb020'
      height: auto
    tap_action:
      action: navigate
      navigation_path: '#energy'
    triggers_update:
    - sensor.sh50rs_a21c2106894_mppt_total_power
    - sensor.sh50rs_a21c2106894_purchased_power
    - sensor.sh50rs_a21c2106894_total_export_active_power
    - sensor.bluey_charger_power
    - sensor.kia_charger_power
    - sensor.daily_import_cost
    - sensor.daily_solar_credit
    custom_fields:
      body: |-
        [[[
          const w = id => {
            const e = states[id];
            if (!e) return 0;
            const v = parseFloat(e.state);
            if (isNaN(v)) return 0;
            const u = (e.attributes.unit_of_measurement || '').toLowerCase();
            return Math.abs(u === 'kw' ? v * 1000 : v);
          };
          const solar = w('sensor.sh50rs_a21c2106894_mppt_total_power');
          const imp = w('sensor.sh50rs_a21c2106894_purchased_power');
          const exp = w('sensor.sh50rs_a21c2106894_total_export_active_power');
          const cars = w('sensor.bluey_charger_power') + w('sensor.kia_charger_power');
          const load = Math.max(0, solar + imp - exp);
          const fromSolar = Math.max(0, solar - exp);
          const sPct = load > 0 ? Math.round(Math.min(1, fromSolar / load) * 100) : 0;
          const gPct = load > 0 ? 100 - sPct : 0;
          const fmt = v => v >= 1000 ? [(v / 1000).toFixed(1), 'kW'] : [Math.round(v), 'W'];
          const [lv, lu] = fmt(load);
          const money = s => states[s] && !isNaN(parseFloat(states[s].state)) ? '$' + parseFloat(states[s].state).toFixed(2) : '–';
          const src = solar > 0 ? `${fmt(solar).join(' ')} solar${exp > 0 ? ' · exporting ' + fmt(exp).join(' ') : ''}` : 'Solar asleep';
          const leg = (c, t) => `<span style="display:flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block"></i>${t}</span>`;
          return `<div style="font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px;margin-top:8px">${lv}<span style="font-size:13px;font-weight:600;color:var(--secondary-text-color);margin-left:3px">${lu}</span></div>
            <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:4px;line-height:1.35">${src} · today ${money('sensor.daily_import_cost')} used, ${money('sensor.daily_solar_credit')} sold</div>
            <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:10px;background:rgba(var(--rgb-primary-text-color),0.08)">
              <i style="flex:${sPct};background:#ffb020"></i><i style="flex:${gPct};background:#a67cff"></i></div>
            <div style="display:flex;gap:12px;margin-top:8px;font-size:10.5px;color:var(--secondary-text-color);flex-wrap:wrap">
              ${leg('#ffb020', 'Solar ' + sPct + '%')}${leg('#a67cff', 'Grid ' + gPct + '%')}${leg('#30d158', 'Cars ' + fmt(cars).join(' '))}</div>`;
        ]]]
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: b_bento
      entity: sensor.bluey_battery_level
      variables:
        label: Bluey
        icon: phu:tesla-icon
        tint: var(--secondary-text-color)
        height: 128px
      tap_action:
        action: navigate
        navigation_path: '#bluey'
      hold_action:
        action: more-info
      triggers_update:
      - sensor.bluey_battery_range
      - switch.bluey_charge
      - sensor.bluey_shift_state
      - device_tracker.bluey_location
      custom_fields:
        body: |-
          [[[
            const r = Math.round(parseFloat(states['sensor.bluey_battery_range'] ? states['sensor.bluey_battery_range'].state : 0) || 0);
            const chg = states['switch.bluey_charge'] && states['switch.bluey_charge'].state === 'on';
            const shift = ((states['sensor.bluey_shift_state'] || {}).state || '').toLowerCase();
            const zones = states['device_tracker.bluey_location'] ? states['device_tracker.bluey_location'].attributes.in_zones : null;
            const z = Array.isArray(zones) && zones.length ? zones[0] : null;
            const loc = shift === 'd' ? 'Driving' : z === 'zone.home' ? 'Home' : (z && z.indexOf('_work') !== -1) ? 'Work' : 'Away';
            return `<div style="font-size:22px;font-weight:700;line-height:1;margin-top:34px">${r}<span style="font-size:12px;font-weight:600;color:var(--secondary-text-color);margin-left:2px">km</span></div>
              <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:4px">${loc} · ${chg ? '<span style="color:#30d158">charging</span>' : 'not charging'}</div>`;
          ]]]
        ring: |-
          [[[
            const p = Math.max(0, Math.min(100, Math.round(parseFloat(states['sensor.bluey_battery_level'] ? states['sensor.bluey_battery_level'].state : 0) || 0)));
            return `<svg viewBox="0 0 64 64" width="60" height="60">
              <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(127,127,127,0.18)" stroke-width="7"/>
              <circle cx="32" cy="32" r="26" fill="none" stroke="#30d158" stroke-width="7" stroke-linecap="round"
                stroke-dasharray="${(p / 100 * 163.4).toFixed(1)} 163.4" transform="rotate(-90 32 32)"/>
              <text x="32" y="36.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--primary-text-color)">${p}%</text></svg>`;
          ]]]
      styles: &id001
        custom_fields:
          ring:
          - position: absolute
          - top: 10px
          - right: 10px
    - type: custom:button-card
      template: b_bento
      entity: input_number.kia_battery_estimate
      variables:
        label: Sorento
        icon: phu:kia
        tint: var(--secondary-text-color)
        height: 128px
      tap_action:
        action: navigate
        navigation_path: '#garage'
      hold_action:
        action: more-info
      triggers_update:
      - input_boolean.kia_onroad
      - switch.kia_charger
      - device_tracker.kia_gps_location
      custom_fields:
        body: |-
          [[[
            const onroad = states['input_boolean.kia_onroad'] && states['input_boolean.kia_onroad'].state === 'on';
            const chg = states['switch.kia_charger'] && states['switch.kia_charger'].state === 'on';
            const zones = states['device_tracker.kia_gps_location'] ? states['device_tracker.kia_gps_location'].attributes.in_zones : null;
            const z = Array.isArray(zones) && zones.length ? zones[0] : null;
            const loc = onroad ? 'Driving' : z === 'zone.home' ? 'Home' : (z && z.indexOf('_work') !== -1) ? 'Work' : 'Away';
            return `<div style="font-size:22px;font-weight:700;line-height:1;margin-top:34px">${loc}</div>
              <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:4px">${chg ? '<span style="color:#2bb5a6">charging</span>' : 'not charging'}</div>`;
          ]]]
        ring: |-
          [[[
            const p = Math.max(0, Math.min(100, Math.round(parseFloat(states['input_number.kia_battery_estimate'] ? states['input_number.kia_battery_estimate'].state : 0) || 0)));
            return `<svg viewBox="0 0 64 64" width="60" height="60">
              <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(127,127,127,0.18)" stroke-width="7"/>
              <circle cx="32" cy="32" r="26" fill="none" stroke="#2bb5a6" stroke-width="7" stroke-linecap="round"
                stroke-dasharray="${(p / 100 * 163.4).toFixed(1)} 163.4" transform="rotate(-90 32 32)"/>
              <text x="32" y="36.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--primary-text-color)">${p}%</text></svg>`;
          ]]]
      styles: *id001
  - type: picture-entity
    entity: camera.driveway_snapshot
    camera_view: auto
    aspect_ratio: '16:9'
    fit_mode: cover
    name: Driveway · all cameras ›
    show_name: true
    show_state: false
    tap_action:
      action: navigate
      navigation_path: /mobile-hub/mobile-cameras
    hold_action:
      action: more-info
      entity: camera.driveway_live_view
    card_mod:
      style: |
        ha-card { border-radius: 22px; overflow: hidden; }
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: b_bento
      entity: media_player.tv
      variables:
        label: Media TV
        icon: mdi:television
        tint: '#bf5af2'
        height: 140px
      tap_action:
        action: navigate
        navigation_path: '#media'
      hold_action:
        action: more-info
      custom_fields:
        body: |-
          [[[
            const e = states['media_player.tv'];
            const on = e && !['off', 'unavailable', 'standby'].includes(e.state);
            const src = on ? (e.attributes.source || 'On') : 'Off';
            const st = on ? e.state.charAt(0).toUpperCase() + e.state.slice(1) : 'Tap for remote & apps';
            return `<div style="font-size:19px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${src}</div>
              <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:3px">${st}</div>`;
          ]]]
        ctrl:
          card:
            type: horizontal-stack
            cards:
            - type: custom:button-card
              template: b_mini
              icon: mdi:skip-previous
              tap_action:
                action: perform-action
                perform_action: media_player.media_previous_track
                target:
                  entity_id: media_player.tv
              hold_action:
                action: none
            - type: custom:button-card
              template: b_mini
              icon: mdi:play-pause
              tap_action:
                action: perform-action
                perform_action: media_player.media_play_pause
                target:
                  entity_id: media_player.tv
              hold_action:
                action: none
            - type: custom:button-card
              template: b_mini
              icon: mdi:skip-next
              tap_action:
                action: perform-action
                perform_action: media_player.media_next_track
                target:
                  entity_id: media_player.tv
              hold_action:
                action: none
      styles:
        grid:
        - grid-template-areas: '"lbl" "body" "ctrl"'
        - grid-template-rows: min-content 1fr min-content
    - type: custom:button-card
      template: b_bento
      variables:
        label: Kids
        icon: mdi:teddy-bear
        tint: '#ff8fb1'
        height: 140px
      tap_action:
        action: navigate
        navigation_path: '#kids'
      triggers_update:
      - binary_sensor.shanaya_room_occupancy_status
      - binary_sensor.samar_room_occupancy_new
      - sensor.shanayaroomtemp_temperature
      - sensor.aarlo_temperature_samar_cam
      custom_fields:
        body: |-
          [[[
            const occ = id => states[id] && states[id].state === 'on';
            const t = id => { const v = parseFloat(states[id] ? states[id].state : NaN); return isNaN(v) ? '–' : v.toFixed(1) + '°'; };
            const row = (name, o, temp, first) => `<div style="margin-top:${first ? 9 : 8}px">
                <div style="font-size:12.5px;font-weight:700">${name} · <span style="color:${o ? 'var(--amber-color)' : 'var(--secondary-text-color)'}">${o ? 'in room' : 'clear'}</span></div>
                <div style="font-size:11.5px;color:var(--secondary-text-color);margin-top:1px">${temp} · cam ›</div></div>`;
            return row('Shanaya', occ('binary_sensor.shanaya_room_occupancy_status'), t('sensor.shanayaroomtemp_temperature'), true)
                 + row('Samar', occ('binary_sensor.samar_room_occupancy_new'), t('sensor.aarlo_temperature_samar_cam'));
          ]]]
  - type: custom:button-card
    template: b_bento
    variables:
      label: Quick actions
      icon: mdi:lightning-bolt-circle
      tint: var(--secondary-text-color)
      height: auto
    custom_fields:
      acts:
        card:
          type: horizontal-stack
          cards:
          - type: custom:button-card
            template: b_act
            name: Good Night
            icon: mdi:weather-night
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.good_night
          - type: custom:button-card
