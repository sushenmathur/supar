<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost Phone – dial passcode</title>
<style>
:root{--tx:#14203a;--tx2:rgba(20,32,58,.74);--bg:radial-gradient(900px 600px at 6% 8%,rgba(255,150,130,.7),transparent 62%),radial-gradient(800px 560px at 60% 12%,rgba(90,200,250,.7),transparent 62%),radial-gradient(760px 600px at 98% 70%,rgba(179,136,255,.7),transparent 62%),linear-gradient(160deg,#eef3ff,#e6ecfa);--pop:oklch(0.93 0.045 265/.62);--soft:rgba(255,255,255,.5);--bd:rgba(255,255,255,.8);--hi:rgba(255,255,255,.95);--dialbg:radial-gradient(circle at 50% 40%,#2a3354,#0f1530);--tick:rgba(255,255,255,.55);--dg:rgba(255,255,255,.75)}
body.dark{--tx:#fff;--tx2:rgba(255,255,255,.7);--bg:radial-gradient(900px 600px at 6% 8%,rgba(91,61,245,.55),transparent 62%),radial-gradient(800px 560px at 60% 12%,rgba(10,167,160,.45),transparent 62%),linear-gradient(160deg,#080d1e,#0f1730 55%,#0a1a26);--pop:oklch(0.25 0.045 265/.66);--soft:rgba(255,255,255,.09);--bd:rgba(255,255,255,.26);--hi:rgba(255,255,255,.4)}
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Roboto,system-ui,sans-serif;color:var(--tx);background:var(--bg) fixed;min-height:100vh}
.bar{max-width:880px;margin:0 auto 10px;display:flex;gap:8px;font-size:12.5px;align-items:center}.bar button{font:inherit;border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer}
.pop{max-width:880px;margin:0 auto;border-radius:34px;background:var(--pop);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--bd);box-shadow:0 30px 80px rgba(20,30,80,.35),inset 0 1px 0 var(--hi);padding:18px 26px 26px}
.hd{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600;margin-bottom:6px}.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:center}
.dialw{position:relative;width:360px;height:360px;margin:0 auto}svg{width:100%;height:100%;overflow:visible}
#dial{transition:transform .55s cubic-bezier(.2,.9,.25,1);transform-origin:180px 180px}
.dg{font:600 22px 'Roboto Mono',ui-monospace,monospace;fill:var(--dg);text-anchor:middle;dominant-baseline:middle}.dg.cur{fill:#fbbf24}
.ctr{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#222a47,#0b1022);box-shadow:inset 0 2px 6px rgba(255,255,255,.12),0 6px 20px rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font-size:64px;font-weight:700;transition:.3s}
.seg{fill:none;stroke:rgba(255,255,255,.22);stroke-width:7;stroke-linecap:round;transition:stroke .3s}.seg.f{stroke:#fbbf24;filter:drop-shadow(0 0 6px rgba(251,191,36,.7))}
.dialw.bad .seg.f{stroke:#ef4444;filter:drop-shadow(0 0 6px rgba(239,68,68,.8))}.dialw.good .seg{stroke:#22c55e;filter:drop-shadow(0 0 8px rgba(34,197,94,.8))}.dialw.bad{animation:sh .45s}
.dialw.bad .ctr{color:#ef4444}.dialw.good .ctr{color:#22c55e}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.ptr{position:absolute;left:50%;top:-4px;margin-left:-11px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #fbbf24;filter:drop-shadow(0 0 6px rgba(251,191,36,.8))}
.dialbg{fill:url(#db)}
.msg{text-align:center;font-weight:600;font-size:14px;color:var(--tx2);height:22px;margin-top:6px}.msg.good{color:#15803d}.msg.bad{color:#be123c}body.dark .msg.good{color:#6ee7b7}body.dark .msg.bad{color:#fb7185}
.chips{display:flex;gap:10px;margin-bottom:14px}.chip{flex:1;height:44px;border-radius:22px;background:var(--soft);border:1px solid var(--bd);display:grid;place-items:center;font-weight:600;font-size:15px;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi)}.chip.a{background:linear-gradient(135deg,#7dd3fc,#818cf8);color:#0b1020;border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.k{width:78px;height:78px;border-radius:50%;background:var(--soft);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--hi);display:grid;place-items:center;font-size:28px;font-weight:500;cursor:pointer;user-select:none;transition:.15s}.k:active{transform:scale(.92);background:rgba(251,191,36,.35)}
.k.ok{background:rgba(34,197,94,.32);color:#15803d}.k.cl{color:#be123c}body.dark .k.ok{color:#6ee7b7}body.dark .k.cl{color:#fb7185}
:focus-visible{outline:3px solid #3b6cff;outline-offset:2px}@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="bar"><b style="margin-right:auto">Lost Phone · dial passcode (mock-up) · demo code is 1234</b><button id="dk">Dark mode</button></div>
<div class="pop"><div class="hd"><div class="x">✕</div>Lost Phone</div>
<div class="grid"><div><div class="dialw" id="dw"><div class="ptr"></div><svg viewBox="0 0 360 360"><defs><radialGradient id="db" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#2a3354"/><stop offset="1" stop-color="#0b1022"/></radialGradient></defs>
<g id="arcs"></g><circle class="dialbg" cx="180" cy="180" r="150"/><g id="dial"></g></svg><div class="ctr" id="ctr">–</div></div><div class="msg" id="msg">Enter passcode</div></div>
<div><div class="chips"><div class="chip a" data-p="Sushen">Sushen</div><div class="chip" data-p="Paro">Paro</div></div><div class="pad" id="pad"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);let code='',busy=false,ang=0;const LEN=4;
// dial: ticks + digits
let g='';for(let i=0;i<120;i++){const a=i*3,long=i%12===0,len=long?14:(i%3===0?9:5);g+=`<line x1="180" y1="${180-146}" x2="180" y2="${180-146+len}" stroke="var(--tick)" stroke-width="${long?2:1}" transform="rotate(${a} 180 180)"/>`}
for(let d=0;d<10;d++){const a=d*36,rad=108;const x=180+rad*Math.sin(a*Math.PI/180),y=180-rad*Math.cos(a*Math.PI/180);g+=`<text class="dg" data-d="${d}" x="${x}" y="${y}" transform="rotate(${a} ${x} ${y})">${d}</text>`}
$('dial').innerHTML=g;
// outer arc segments (6, gap at top and bottom like the reference)
function arcs(){let s='';for(let i=0;i<LEN;i++){const a0=-90+(i*(360/LEN))+8,a1=-90+((i+1)*(360/LEN))-8,r=168,p=a=>[180+r*Math.cos(a*Math.PI/180),180+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);s+=`<path class="seg ${i<code.length?'f':''}" d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}"/>`}$('arcs').innerHTML=s}
function turn(d){ang=-d*36;$('dial').style.transform=`rotate(${ang}deg)`;document.querySelectorAll('.dg').forEach(e=>e.classList.toggle('cur',e.dataset.d==d));$('ctr').textContent=d}
const say=(t,c)=>{$('msg').textContent=t;$('msg').className='msg '+(c||'')};
function reset(){code='';arcs();$('ctr').textContent='–';document.querySelectorAll('.dg').forEach(e=>e.classList.remove('cur'));$('dw').className='dialw'}
function press(k){if(busy)return;const dw=$('dw');dw.classList.remove('bad');
 if(/^\d$/.test(k)){if(code.length<LEN){code+=k;turn(+k);arcs();say('Enter passcode')}return}
 if(k==='x'){reset();say('Enter passcode');return}
 if(!code.length){say('Enter passcode');return}
 busy=true;say('Checking…');setTimeout(()=>{if(code==='1234'){dw.classList.add('good');say('Alert sent to '+phone,'good');setTimeout(()=>{reset();say('Enter passcode');busy=false},2200)}else{dw.classList.add('bad');say('Access Denied - Wrong passcode','bad');setTimeout(()=>{reset();dw.classList.add('bad');setTimeout(()=>dw.classList.remove('bad'),500);busy=false},900)}},600)}
let phone='Sushen';document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{phone=c.dataset.p;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('a',x===c))});
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','x','0','ok'].map(k=>`<div class="k ${k==='ok'?'ok':k==='x'?'cl':''}" data-k="${k}" tabindex="0" role="button">${k==='x'?'✕':k==='ok'?'✓':k}</div>`).join('');
document.querySelectorAll('.k').forEach(e=>{e.onclick=()=>press(e.dataset.k);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();e.click()}}});
addEventListener('keydown',e=>{if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('x');if(e.key==='Enter')press('ok')});
$('dk').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode'};arcs();
</script></body></html>
