<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festive night – options</title>
<style>
body{margin:0;padding:24px;font-family:Poppins,system-ui,sans-serif;background:linear-gradient(135deg,#1b1740,#3a1d5e 55%,#6b2c4a);color:#fff;min-height:100vh}
h1{font-size:18px;margin:0 0 4px}p.s{opacity:.7;font-size:13px;margin:0 0 20px}
.opt{max-width:700px;margin:0 auto 26px}.opt h2{font-size:14px;margin:0 0 4px}.opt small{opacity:.7;display:block;margin-bottom:10px;font-size:12.5px}
.card{position:relative;height:var(--h,112px);box-sizing:border-box;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(14,20,64,.86),rgba(60,40,120,.62));border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.35);padding:var(--pt,0) 24px var(--pb,0);display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.card .l div:first-child{font-size:12.5px;font-weight:600;opacity:.85}.card .t{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:4px}
.card .r{display:grid;gap:6px;justify-items:end}.card .r b{font-size:26px}.pill{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:600;margin-left:6px}
.layer{position:absolute;inset:0;overflow:hidden;border-radius:28px;pointer-events:none}
.st{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
.moon{position:absolute;right:90px;top:14px;width:34px;height:34px;border-radius:50%;box-shadow:inset -9px -3px 0 0 rgba(255,246,214,.92);transform:rotate(-20deg);filter:drop-shadow(0 0 10px rgba(255,246,214,.6))}
.glow{background:linear-gradient(to top,rgba(255,150,40,.30),transparent 58%)}
.row{position:absolute;left:14px;right:14px;bottom:1px;display:flex;justify-content:space-between;align-items:flex-end}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk 1.4s ease-in-out infinite}.gl{animation:pl 2.2s ease-in-out infinite}
.sp{position:absolute;bottom:14px;width:3px;height:3px;border-radius:50%;background:#ffd77a;box-shadow:0 0 6px 1px rgba(255,200,90,.9);opacity:0;animation:rs linear infinite}
/* B */
.wire{position:absolute;left:0;top:0;width:100%;height:30px}
.bulb{animation:bl 1.8s ease-in-out infinite}
.lant{position:absolute;top:0;transform-origin:50% 0;animation:sw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes fk{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.92,1.1) skewX(-4deg)}50%{transform:scale(1.06,.93) skewX(3deg)}75%{transform:scale(.96,1.06) skewX(-2deg)}}
@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}@keyframes rs{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sw{display:flex;gap:10px;align-items:center;margin:0 auto 18px;max-width:700px;font-size:13px}.sw button{border:0;border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;background:rgba(255,255,255,.18);color:#fff}.sw button.on{background:#f59e0b;color:#2a1600}
</style></head><body>
<h1>Festive mode – night only</h1><p class="s">Shows only when <code>input_boolean.festive_mode</code> is on and the sun is below the horizon. Toggle to preview.</p>
<div class="sw"><span>Festive switch</span><button id="f" class="on">On</button><span>Sun</span><button id="n" class="on">Night</button></div>
<div id="o"></div>
<script>
const r=(i,s)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};const n=(c,f)=>Array.from({length:c},(_,i)=>f(i)).join('');
const defs='<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="fmf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffe27a"/></linearGradient><linearGradient id="fmb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a040"/><stop offset="1" stop-color="#a84a14"/></linearGradient><radialGradient id="fmg"><stop offset="0" stop-color="#ffc060" stop-opacity=".65"/><stop offset="1" stop-color="#ffc060" stop-opacity="0"/></radialGradient></defs></svg>';
const diya=(i,w=46)=>{const dl=`animation-delay:-${(r(i,22)*3).toFixed(2)}s`;return `<span style="line-height:0;transform:scale(${(.85+r(i,21)*.25).toFixed(2)});transform-origin:50% 100%"><svg viewBox="0 0 44 40" width="${w}" height="${w*42/46}"><ellipse class="gl" cx="22" cy="14" rx="20" ry="16" fill="url(#fmg)" style="${dl}"/><path class="fl" d="M22 3 C28 9 29 15 22 21 C15 15 16 9 22 3Z" fill="url(#fmf)" style="${dl}"/><path class="fl" d="M22 11 C24.8 14 24.8 16.5 22 19 C19.2 16.5 19.2 14 22 11Z" fill="#fff6c8" style="${dl}"/><path d="M3 22 Q5 36 22 36 Q39 36 41 22 Q22 27 3 22Z" fill="url(#fmb)" stroke="#ffd37a"/><ellipse cx="22" cy="22" rx="19" ry="3.4" fill="#7a3b12" stroke="#ffd37a"/></svg></span>`};
const sky=()=>n(24,i=>`<i class="st" style="left:${r(i,13)*100}%;top:${r(i,14)*100}%;animation-delay:-${r(i,16)*4}s"></i>`)+'<i class="moon"></i>';
const sparks=c=>n(c,i=>`<i class="sp" style="left:${4+r(i,23)*92}%;animation-duration:${3+r(i,24)*3}s;animation-delay:-${r(i,25)*6}s"></i>`);
const lantern=(x,c,d)=>`<div class="lant" style="left:${x}%;animation-delay:-${d}s"><svg width="26" height="46" viewBox="0 0 26 46"><line x1="13" y1="0" x2="13" y2="8" stroke="#ffd37a"/><path d="M6 10 L20 10 L24 24 L13 40 L2 24Z" fill="${c}" fill-opacity=".9" stroke="#ffd37a"/><path d="M13 10 L13 40 M6 10 L2 24 M20 10 L24 24" stroke="#ffd37a" stroke-opacity=".6" fill="none"/><circle cx="13" cy="22" r="14" fill="url(#fmg)"/><path d="M13 40 L13 46" stroke="#ffd37a"/></svg></div>`;
const wire=()=>{const cols=['#ff9d1a','#ffd23f','#ff5d8f','#ffb347'];const seg=(x0,x1)=>{const q=(t)=>{const y=2+2*(1-t)*t*22;return y};return {x0,x1,q}};
const pts=[];const segs=[[0,350],[350,700]];segs.forEach(([a,b],k)=>{for(let j=0;j<8;j++){const t=(j+.5)/8;pts.push([a+(b-a)*t,2+4*t*(1-t)*10+0])}});
return `<svg class="wire" viewBox="0 0 700 30" preserveAspectRatio="none" style="height:30px"><path d="M0 2 Q175 22 350 2 Q525 22 700 2" fill="none" stroke="rgba(255,215,140,.55)" stroke-width="1.2"/>${pts.map((p,i)=>`<circle class="bulb" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${cols[i%4]}" style="animation-delay:-${(r(i,30)*2).toFixed(2)}s;filter:drop-shadow(0 0 4px ${cols[i%4]})"/>`).join('')}</svg>`};
const body=`<div class="l"><div>Good evening · 6th November · Clear Night</div><div class="t">7:42 PM</div></div><div class="r"><div><b>22°</b></div><div><span class="pill">India 3:12 AM</span><span class="pill">Austin 4:42 AM</span></div></div>`;
function card(inner,st=''){return `<div class="card" style="${st}"><div class="layer">${sky()}</div>${inner}${body}</div>`}
function render(){const f=document.getElementById('f').classList.contains('on'),nt=document.getElementById('n').classList.contains('on'),on=f&&nt;
const A=on?`<div class="layer glow"></div><div class="layer">${defs}${sparks(10)}<div class="row">${n(11,i=>diya(i,40))}</div></div>`:'';
const B=on?`<div class="layer">${defs}${wire()}${lantern(3,'#ff7a1a',0)}${lantern(93,'#e8385f',1.5)}${sparks(6)}<div class="row" style="left:120px;right:120px;justify-content:space-around">${n(7,i=>diya(i,34))}</div></div>`:'';
document.getElementById('o').innerHTML=`<div class="opt"><h2>Option A – Diya row</h2><small>A row of 11 flickering diyas along the bottom edge, warm glow and rising sparks. Clean and quiet.</small>${card(A,on?'--h:134px;--pb:26px':'')}</div>
<div class="opt"><h2>Option B – Diyas, fairy lights and lanterns</h2><small>Swaying akash kandil lanterns at the corners, twinkling marigold/pink string lights across the top, and a smaller row of diyas.</small>${card(B,on?'--h:150px;--pt:16px;--pb:26px':'')}</div>`}
['f','n'].forEach(id=>document.getElementById(id).onclick=e=>{e.target.classList.toggle('on');e.target.textContent=id=='f'?(e.target.classList.contains('on')?'On':'Off'):(e.target.classList.contains('on')?'Night':'Day');render()});render();
</script></body></html>
