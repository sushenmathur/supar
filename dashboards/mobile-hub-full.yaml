                            name: Trunk
                            tap_action:
                              action: perform-action
                              perform_action: cover.open_cover
                              target:
                                entity_id: cover.bluey_trunk
                            styles:
                              icon:
                                - color: |
                                    [[[ return states['cover.bluey_trunk'] && states['cover.bluey_trunk'].state === 'open' ? '#30d158' : '#ffffff'; ]]]
                          - type: custom:button-card
                            template: b_tesla_act
                            entity: climate.bluey_climate
                            icon: phu:tesla-fan
                            name: Climate
                            tap_action:
                              action: toggle
                            styles:
                              icon:
                                - color: |
                                    [[[ return states['climate.bluey_climate'].state === 'heat_cool' ? '#3b82f6' : '#ffffff'; ]]]
                          - type: custom:button-card
                            template: b_tesla_act
                            entity: cover.bluey_charge_port_door
                            icon: phu:tesla-open
                            name: Port
                            tap_action:
                              action: toggle
                            styles:
                              icon:
                                - color: |
                                    [[[ return states['cover.bluey_charge_port_door'].state === 'open' ? '#30d158' : '#ffffff'; ]]]
                          - type: custom:button-card
                            template: b_tesla_act
                            entity: lock.bluey_lock
                            name: Lock
                            icon: |
                              [[[ return states['lock.bluey_lock'].state === 'locked' ? 'phu:tesla-lock' : 'mdi:lock-open-variant'; ]]]
                            tap_action:
                              action: toggle
                            styles:
                              icon:
                                - color: |
                                    [[[ return states['lock.bluey_lock'].state === 'locked' ? '#ffffff' : '#ff453a'; ]]]
                          - type: custom:button-card
                            template: b_tesla_act
                            icon: phu:tesla-hood
                            name: Frunk
                            tap_action:
                              action: perform-action
                              perform_action: cover.open_cover
                              target:
                                entity_id: cover.bluey_frunk
                            styles:
                              icon:
                                - color: |
                                    [[[ return states['cover.bluey_frunk'] && states['cover.bluey_frunk'].state === 'open' ? '#30d158' : '#ffffff'; ]]]
                    charge_panel: |
                      [[[
                        const cableConnected = states['binary_sensor.bluey_charge_cable'].state === 'on';
                        if (!cableConnected) return '';

                        const chargeLimitEntity = states['number.bluey_charge_limit'];
                        const chargeLimit = chargeLimitEntity ? Math.round(parseFloat(chargeLimitEntity.state)) : 100;
                        const limitMin = chargeLimitEntity && chargeLimitEntity.attributes.min != null ? chargeLimitEntity.attributes.min : 50;
                        const limitMax = chargeLimitEntity && chargeLimitEntity.attributes.max != null ? chargeLimitEntity.attributes.max : 100;
                        const limitStep = chargeLimitEntity && chargeLimitEntity.attributes.step != null ? chargeLimitEntity.attributes.step : 1;

                        const ampsEntity = states['number.bluey_charge_current'];
                        const amps = ampsEntity ? Math.round(parseFloat(ampsEntity.state)) : 0;
                        const ampsMin = ampsEntity && ampsEntity.attributes.min != null ? ampsEntity.attributes.min : 5;
                        const ampsMax = ampsEntity && ampsEntity.attributes.max != null ? ampsEntity.attributes.max : 32;
                        const ampsStep = ampsEntity && ampsEntity.attributes.step != null ? ampsEntity.attributes.step : 1;

                        const charging = states['switch.bluey_charge'].state === 'on';
                        const chargeStatusText = charging ? 'Charging' : 'Charging Stopped';
                        const chargeStatusColor = charging ? '#30d158' : '#8f8f8f';

                        const portDoor = states['cover.bluey_charge_port_door'];
                        const portOpen = portDoor && portDoor.state === 'open';
                        const haCall = "document.querySelector('home-assistant').hass";

                        return `
                          <div style="background:#16181a;border-radius:14px;padding:12px;">
                            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                              <span style="color:#fff;font-size:13px;font-weight:600;">Limit ${chargeLimit}%</span>
                              <span style="color:#5a5a5a;font-size:13px;">&middot;</span>
                              <span style="color:${chargeStatusColor};font-size:13px;font-weight:600;">${chargeStatusText}</span>
                              <span style="flex:1"></span>
                              <ha-icon icon="mdi:minus-circle-outline"
                                style="color:#fff;--mdc-icon-size:20px;width:20px;height:20px;cursor:pointer;"
                                onclick="event.stopPropagation(); ${haCall}.callService('number','set_value',{entity_id:'number.bluey_charge_current', value: Math.max(${ampsMin}, ${amps} - ${ampsStep})});">
                              </ha-icon>
                              <span style="color:#fff;font-size:13px;font-weight:600;min-width:36px;text-align:center;">${amps} A</span>
                              <ha-icon icon="mdi:plus-circle-outline"
                                style="color:#fff;--mdc-icon-size:20px;width:20px;height:20px;cursor:pointer;"
                                onclick="event.stopPropagation(); ${haCall}.callService('number','set_value',{entity_id:'number.bluey_charge_current', value: Math.min(${ampsMax}, ${amps} + ${ampsStep})});">
                              </ha-icon>
                            </div>
                            <input type="range"
                              min="${limitMin}" max="${limitMax}" step="${limitStep}" value="${chargeLimit}"
                              onclick="event.stopPropagation();"
                              onchange="event.stopPropagation(); ${haCall}.callService('number','set_value',{entity_id:'number.bluey_charge_limit', value: parseFloat(this.value)});"
                              style="width:100%;margin-top:10px;accent-color:#30d158;height:6px;cursor:pointer;">
                            <div style="display:flex;margin-top:8px;border-top:1px solid #232527;">
                              <div style="flex:1;text-align:center;padding:10px 0 2px;cursor:pointer;"
                                onclick="event.stopPropagation(); ${haCall}.callService('switch','toggle',{entity_id:'switch.bluey_charge'});">
                                <span style="color:#3b82f6;font-size:13px;font-weight:600;">${charging ? 'Stop Charging' : 'Start Charging'}</span>
                              </div>
                              <div style="width:1px;background:#232527;"></div>
                              <div style="flex:1;text-align:center;padding:10px 0 2px;cursor:pointer;"
                                onclick="event.stopPropagation(); ${haCall}.callService('cover', '${portOpen ? 'close_cover' : 'open_cover'}', {entity_id:'cover.bluey_charge_port_door'});">
                                <span style="color:#3b82f6;font-size:13px;font-weight:600;">${portOpen ? 'Lock Charge Port' : 'Unlock Charge Port'}</span>
                              </div>
                            </div>
                          </div>`;
                      ]]]
                    info: |
                      [[[
                        const charging = states['switch.bluey_charge'].state === 'on';
                        const climateTemp = states['sensor.bluey_inside_temperature'].state;
                        const range = Math.round(states['sensor.bluey_battery_range'].state);

                        const etaRaw = states['sensor.bluey_time_to_full_charge'];
                        let eta = null;
                        if (charging && etaRaw && etaRaw.state !== 'unavailable' && etaRaw.state !== 'unknown' && parseFloat(etaRaw.state) > 0) {
                          const hrs = parseFloat(etaRaw.state);
                          const h = Math.floor(hrs);
                          const m = Math.round((hrs - h) * 60);
                          eta = h > 0 ? `${h}hr ${m}min` : `${m}min`;
                        }

                        const tracker = states['device_tracker.bluey_location'];
                        const lat = tracker ? tracker.attributes.latitude : null;
                        const lon = tracker ? tracker.attributes.longitude : null;
                        const inZonesRaw = tracker ? tracker.attributes.in_zones : null;

                        let zoneId = null;
                        if (Array.isArray(inZonesRaw) && inZonesRaw.length > 0) {
                          zoneId = inZonesRaw[0];
                        } else if (typeof inZonesRaw === 'string' && inZonesRaw.length > 0) {
                          zoneId = inZonesRaw.split(',')[0].trim();
                        }

                        let location = 'Unknown';
                        const geoKey = (lat != null && lon != null) ? lat.toFixed(3) + ',' + lon.toFixed(3) : null;
                        if (zoneId) {
                          const zoneEntity = states[zoneId];
                          location = (zoneEntity && zoneEntity.attributes.friendly_name)
                            ? zoneEntity.attributes.friendly_name
                            : zoneId.replace('zone.', '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                        } else if (geoKey) {
                          location = sessionStorage.getItem('bluey_geo_' + geoKey) || lat.toFixed(4) + ', ' + lon.toFixed(4);
                          if (!sessionStorage.getItem('bluey_geo_' + geoKey) && !(window.__blueyGeoFetching || {})[geoKey]) {
                            window.__blueyGeoFetching = window.__blueyGeoFetching || {};
                            window.__blueyGeoFetching[geoKey] = true;
                            fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=en')
                              .then(r => r.json())
                              .then(d => {
                                const admin = (d.localityInfo && d.localityInfo.administrative) || [];
                                const last = admin.filter(a => a.name).slice(-2).map(a => a.name);
                                let addr = null;
                                const suburb = d.locality || d.city;
                                const state = d.principalSubdivision;
                                if (suburb) {
                                  addr = state ? suburb + ', ' + state : suburb;
                                } else if (last.length) {
                                  addr = last.join(', ');
                                }
                                if (addr) {
                                  sessionStorage.setItem('bluey_geo_' + geoKey, addr);
                                  try { this.render(); } catch (e) {}
                                }
                              })
                              .catch(() => {})
                              .finally(() => { delete window.__blueyGeoFetching[geoKey]; });
                          }
                        }

                        const mapsLink = (lat != null && lon != null) ? `https://maps.google.com/?q=${lat},${lon}` : null;

                        const tiles = [
                          ['mdi:thermometer', '#3b82f6', 'Climate', climateTemp + '°C', null],
                          ['mdi:battery-charging-60', '#30d158', 'Range', range + ' km', null]
                        ];
                        if (eta) tiles.push(['mdi:clock-outline', '#3b82f6', 'Charge ETA', eta, null]);
                        tiles.push(['mdi:map-marker', '#f59e0b', 'Location', location, mapsLink]);

                        const tile = (t, i) => {
                          const [icon, color, label, value, href] = t;
                          const span = (i === tiles.length - 1 && tiles.length % 2 === 1) ? 'grid-column:span 2;' : '';
                          return `
                            <div style="background:#16181a;border-radius:12px;padding:8px 10px;text-align:left;min-width:0;${span}${href ? 'cursor:pointer;' : ''}"
                              ${href ? `onclick="event.stopPropagation(); window.open('${href}','_blank')"` : ''}>
                              <div style="display:flex;align-items:center;gap:5px;color:#8f8f8f;font-size:11px;">
                                <ha-icon icon="${icon}" style="color:${color};--mdc-icon-size:15px;width:15px;height:15px;"></ha-icon>${label}
                              </div>
                              <div style="color:#fff;font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${value}</div>
                            </div>`;
                        };

                        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">${tiles.map(tile).join('')}</div>`;
                      ]]]
                  styles:
                    card:
                      - padding: 14px
                      - border-radius: 22px
                      - background: '#0b1113'
                    grid:
                      - grid-template-areas: |
                          "header car"
                          "actions actions"
                          "charge_panel charge_panel"
                          "info info"
                      - grid-template-columns: 1fr 1.3fr
                      - grid-template-rows: auto auto auto auto
                      - row-gap: 10px
                      - column-gap: 8px
                      - align-items: center
                    custom_fields:
                      header:
                        - justify-self: start
                      car:
                        - justify-self: stretch
                      charge_panel:
                        - display: |
                            [[[ return states['binary_sensor.bluey_charge_cable'].state === 'on' ? 'block' : 'none'; ]]]

