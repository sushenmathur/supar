# ==========================================================================
# Mobile Hub - FULL raw configuration (Option B Home view + all other views)
#
# Dashboard > (pencil) Edit dashboard > three dots > Raw configuration editor
# Select everything, delete it, paste this whole file, Save.
# ==========================================================================

button_card_templates:

  # ---- Square control (the core of Option B) ------------------------------
  b_sq:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    variables:
      on_color: rgba(255, 169, 77, 0.95)
      on_text: '#1d1002'
      icon_color: var(--secondary-text-color)
      active: |
        [[[
          return entity
            ? ['on','open','opening','closing','unlocked','playing','cleaning','heat','cool','heat_cool'].includes(entity.state)
            : false;
        ]]]
    styles:
      card:
        - padding: 12px 12px 10px
        - border-radius: 18px
        - box-shadow: none
        - border: |
            [[[ return variables.active ? '1px solid transparent' : '1px solid rgba(var(--rgb-primary-text-color),0.1)'; ]]]
        - background: |
            [[[ return variables.active ? variables.on_color : 'rgba(var(--rgb-primary-text-color),0.05)'; ]]]
        - color: |
            [[[ return variables.active ? variables.on_text : 'var(--primary-text-color)'; ]]]
        - transition: transform 0.12s ease
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content min-content
        - align-content: start
      img_cell:
        - justify-self: start
        - justify-content: flex-start
        - align-items: center
        - width: 26px
        - height: 26px
        - margin-bottom: 8px
      icon:
        - width: 22px
        - color: |
            [[[ return variables.active ? variables.on_text : variables.icon_color; ]]]
      name:
        - justify-self: stretch
        - text-align: left
        - font-size: 12px
        - font-weight: 700
        - line-height: 1.2
        - white-space: normal
        - display: -webkit-box
        - -webkit-line-clamp: 2
        - -webkit-box-orient: vertical
        - overflow: hidden
        - height: 2.4em
      state:
        - justify-self: start
        - text-align: left
        - font-size: 11px
        - line-height: 1.3
        - opacity: 0.75
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%

  # ---- Square light: fills from the bottom with brightness ----------------
  b_sq_light:
    template: b_sq
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: |
      [[[
        if (entity.state !== 'on') return 'Off';
        const b = entity.attributes.brightness;
        return b ? Math.round(b / 2.55) + '%' : 'On';
      ]]]
    styles:
      card:
        - background: |
            [[[
              if (entity.state !== 'on') return 'rgba(var(--rgb-primary-text-color),0.05)';
              const b = entity.attributes.brightness;
              const p = b ? Math.round(b / 2.55) : 100;
              return `linear-gradient(to top, rgba(255,169,77,0.95) ${p}%, rgba(255,169,77,0.45) ${p}%)`;
            ]]]

  # ---- Square charger switch (Garage tab) ---------------------------------
  b_sq_charge:
    template: b_sq
    tap_action:
      action: toggle
    variables:
      on_color: rgba(0, 230, 118, 0.9)
      on_text: '#032612'
    state_display: |
      [[[ return entity.state === 'on' ? '⚡ Charging' : 'Start charging'; ]]]
    extra_styles: |
      @keyframes bpulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
    styles:
      icon:
        - animation: |
            [[[ return entity.state === 'on' ? 'bpulse 1.5s infinite' : 'none'; ]]]

  # ---- Round status button (replaces the old view badges) -----------------
  b_round:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    variables:
      tint: var(--secondary-text-color)
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 0
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 46px min-content min-content
      img_cell:
        - width: 40px
        - height: 40px
        - border-radius: 50%
        - justify-self: center
        - background: |
            [[[ return `color-mix(in srgb, ${variables.tint} 20%, transparent)`; ]]]
      icon:
        - width: 20px
        - color: '[[[ return variables.tint; ]]]'
      name:
        - font-size: 10px
        - font-weight: 600
        - margin-top: 2px
      state:
        - font-size: 9.5px
        - opacity: 0.65
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%

  # ---- Person avatar for the header ---------------------------------------
  b_avatar:
    show_entity_picture: true
    show_icon: true
    show_name: false
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
        - overflow: visible
      grid:
        - grid-template-areas: '"i" "s"'
        - grid-template-rows: 36px min-content
      img_cell:
        - width: 34px
        - height: 34px
        - justify-self: center
      entity_picture:
        - width: 32px
        - height: 32px
        - border-radius: 50%
        - object-fit: cover
        - border: |
            [[[ return entity.state === 'home' ? '2px solid var(--green-color)' : '2px solid var(--amber-color)'; ]]]
      state:
        - font-size: 9.5px
        - opacity: 0.7
        - margin-top: 2px

  # ---- Money stat (Solar tab) ---------------------------------------------
  b_stat:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    variables:
      tint: var(--secondary-text-color)
    state_display: |
      [[[ return '$' + entity.state; ]]]
    styles:
      card:
        - padding: 8px 4px
        - border-radius: 14px
        - box-shadow: none
        - border: none
        - background: |
            [[[ return `color-mix(in srgb, ${variables.tint} 15%, transparent)`; ]]]
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 20px min-content min-content
      icon:
        - width: 16px
        - color: '[[[ return variables.tint; ]]]'
      name:
        - font-size: 9.5px
        - opacity: 0.8
      state:
        - font-size: 11.5px
        - font-weight: 700
        - color: '[[[ return variables.tint; ]]]'

  # ---- Tesla action button (inside the Tesla card) ------------------------
  b_tesla_act:
    show_name: true
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 42px 16px
      img_cell:
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - justify-self: center
        - background: rgba(255, 255, 255, 0.09)
      icon:
        - width: 20px
        - height: 20px
      name:
        - color: '#8f8f8f'
        - font-size: 10px
        - margin-top: 2px


  # ---- Page title for sub-views (Cameras / Climate / Devices) -------------
  b_title:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    variables:
      title: ''
      sub: ''
    custom_fields:
      title: |
        [[[
          return `
            <div style="font-size:11px;font-weight:600;color:var(--secondary-text-color);letter-spacing:.02em">${variables.sub}</div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05;
              background:linear-gradient(90deg,#ff8a3d,#e9a400);-webkit-background-clip:text;
              background-clip:text;-webkit-text-fill-color:transparent">${variables.title}</div>`;
        ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 4px 4px 0
      grid:
        - grid-template-areas: '"title"'
      custom_fields:
        title:
          - justify-self: start
          - text-align: left

  # ---- Wide control (icon left, two lines of text) ------------------------
  b_wide:
    template: b_sq
    styles:
      card:
        - height: 64px
        - padding: 10px 12px
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 36px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 6px
        - align-content: stretch
      img_cell:
        - margin-bottom: 0
        - justify-content: center
      name:
        - align-self: end
        - height: auto
        - display: block
        - white-space: nowrap
        - text-overflow: ellipsis
      state:
        - align-self: start

  # ---- Room temperature round button (Climate) ----------------------------
  b_round_temp:
    template: b_round
    icon: mdi:thermometer
    variables:
      tint: |
        [[[
          const t = parseFloat(entity.state);
          if (isNaN(t)) return 'var(--secondary-text-color)';
          return t < 20 ? 'var(--blue-color)' : t <= 25 ? 'var(--green-color)' : t <= 28 ? 'var(--amber-color)' : 'var(--red-color)';
        ]]]

  # ---- Air conditioner card: mode colour, -/+ target, mode buttons --------
  b_ac:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    variables:
      modes:
        - 'off'
        - cool
        - heat
        - auto
      mode_color: |
        [[[
          const c = { cool: '#4c8dff', heat: '#ff7a45', auto: '#30b158', heat_cool: '#30b158', dry: '#2bb5a6', fan_only: '#8a9599' };
          return c[entity.state] || 'var(--secondary-text-color)';
        ]]]
    state_display: |
      [[[
        const cur = entity.attributes.current_temperature;
        const m = entity.state === 'off' ? 'Off'
          : entity.state.replace('_', ' ').replace(/^./, c => c.toUpperCase());
        return cur != null ? `${m} · now ${cur}°` : m;
      ]]]
    custom_fields:
      temp: |
        [[[
          const a = entity.attributes;
          const t = a.temperature;
          if (t == null) return '';
          const step = a.target_temp_step || 1;
          const min = a.min_temp != null ? a.min_temp : 16;
          const max = a.max_temp != null ? a.max_temp : 30;
          const off = entity.state === 'off';
          const call = v => `event.stopPropagation(); document.querySelector('home-assistant').hass.callService('climate','set_temperature',{entity_id:'${entity.entity_id}',temperature:${v}})`;
          const btn = (icon, v) => `
            <div onclick="${call(v)}" style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
              background:rgba(var(--rgb-primary-text-color),0.08)">
              <ha-icon icon="${icon}" style="--mdc-icon-size:18px;color:var(--primary-text-color)"></ha-icon>
            </div>`;
          return `
            <div style="display:flex;align-items:center;justify-content:space-between">
              ${btn('mdi:minus', +Math.max(min, t - step).toFixed(1))}
              <div style="font-size:24px;font-weight:700;color:var(--primary-text-color);opacity:${off ? 0.5 : 1}">${t}°</div>
              ${btn('mdi:plus', +Math.min(max, t + step).toFixed(1))}
            </div>`;
        ]]]
      modes: |
        [[[
          const icons = { off: 'mdi:power', cool: 'mdi:snowflake', heat: 'mdi:fire', auto: 'mdi:thermostat-auto',
                          heat_cool: 'mdi:sun-snowflake-variant', dry: 'mdi:water-percent', fan_only: 'mdi:fan' };
          const cols = { off: '#8a9599', cool: '#4c8dff', heat: '#ff7a45', auto: '#30b158', heat_cool: '#30b158', dry: '#2bb5a6', fan_only: '#8a9599' };
          const avail = entity.attributes.hvac_modes || variables.modes;
          const modes = variables.modes.filter(m => avail.includes(m));
          return `<div style="display:flex;gap:4px">${modes.map(m => {
            const on = entity.state === m;
            return `<div onclick="event.stopPropagation(); document.querySelector('home-assistant').hass.callService('climate','set_hvac_mode',{entity_id:'${entity.entity_id}',hvac_mode:'${m}'})"
              style="flex:1;height:28px;border-radius:10px;display:grid;place-items:center;cursor:pointer;
              background:${on ? cols[m] : 'rgba(var(--rgb-primary-text-color),0.06)'}">
              <ha-icon icon="${icons[m] || 'mdi:help'}" style="--mdc-icon-size:16px;color:${on ? '#fff' : 'var(--secondary-text-color)'}"></ha-icon>
            </div>`;
          }).join('')}</div>`;
        ]]]
    styles:
      card:
        - padding: 10px
        - border-radius: 18px
        - box-shadow: none
        - border: 1px solid rgba(var(--rgb-primary-text-color),0.1)
        - background: |
            [[[
              return entity.state === 'off'
                ? 'rgba(var(--rgb-primary-text-color),0.05)'
                : `color-mix(in srgb, ${variables.mode_color} 14%, transparent)`;
            ]]]
      grid:
        - grid-template-areas: '"i n" "i s" "temp temp" "modes modes"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content min-content auto auto
        - column-gap: 8px
      img_cell:
        - width: 32px
        - height: 32px
        - border-radius: 50%
        - background: |
            [[[ return `color-mix(in srgb, ${variables.mode_color} 20%, transparent)`; ]]]
      icon:
        - width: 18px
        - color: '[[[ return variables.mode_color; ]]]'
      name:
        - justify-self: start
        - font-size: 12px
        - font-weight: 700
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      state:
        - justify-self: start
        - font-size: 10px
        - opacity: 0.7
      custom_fields:
        temp:
          - margin-top: 10px
        modes:
          - margin-top: 8px

  # ---- Phone card: battery, location info, Ping button --------------------
  b_phone:
    show_icon: true
    show_name: true
    show_state: true
    show_label: true
    tap_action:
      action: more-info
    variables:
      device: ''
      info: ''
      tint: var(--primary-color)
    state_display: |
      [[[ return isNaN(parseFloat(entity.state)) ? entity.state : Math.round(entity.state) + '%'; ]]]
    label: |
      [[[ return variables.info && states[variables.info] ? states[variables.info].state : ''; ]]]
    custom_fields:
      ping:
        card:
          type: custom:button-card
          name: Ping
          icon: mdi:bell-ring-outline
          show_state: false
          tap_action:
            action: perform-action
            perform_action: icloud3.find_iphone_alert
            data:
              device_name: '[[[ return variables.device; ]]]'
          hold_action:
            action: none
          styles:
            card:
              - width: 52px
              - padding: 7px 4px
              - border-radius: 12px
              - box-shadow: none
              - border: none
              - background: '[[[ return `color-mix(in srgb, ${variables.tint} 16%, transparent)`; ]]]'
            grid:
              - grid-template-areas: '"i" "n"'
              - row-gap: 2px
            icon:
              - width: 18px
              - color: '[[[ return variables.tint; ]]]'
            name:
              - font-size: 9.5px
              - font-weight: 700
              - color: '[[[ return variables.tint; ]]]'
    styles:
      card:
        - padding: 10px
        - border-radius: 18px
        - box-shadow: none
        - border: 1px solid rgba(var(--rgb-primary-text-color),0.1)
        - background: rgba(var(--rgb-primary-text-color),0.05)
      grid:
        - grid-template-areas: '"i n ping" "i s ping" "i l ping"'
        - grid-template-columns: 30px 1fr auto
        - column-gap: 8px
      icon:
        - width: 24px
        - color: |
            [[[
              const b = parseFloat(entity.state);
              return isNaN(b) ? 'var(--secondary-text-color)' : b < 20 ? 'var(--red-color)' : b < 50 ? 'var(--amber-color)' : 'var(--green-color)';
            ]]]
      name:
        - justify-self: start
        - font-size: 11.5px
        - font-weight: 700
      state:
        - justify-self: start
        - font-size: 18px
        - font-weight: 800
        - line-height: 1.1
      label:
        - justify-self: start
        - font-size: 9.5px
        - opacity: 0.65
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%


  # ---- Small round quick button (TV Remote volume / power) ---------------
  b_qbtn:
    show_name: false
    show_state: false
    hold_action:
      action: none
    variables:
      color: var(--primary-text-color)
    styles:
      card:
        - width: 34px
        - height: 34px
        - padding: 0
        - border-radius: 50%
        - box-shadow: none
        - border: none
        - background: rgba(var(--rgb-primary-text-color),0.09)
      grid:
        - grid-template-areas: '"i"'
      icon:
        - width: 19px
        - color: '[[[ return variables.color; ]]]'


  # ---- Bento home (option C) ------------------------------------------
  b_bento:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      label: ''
      icon: mdi:circle-small
      tint: var(--secondary-text-color)
      height: auto
    custom_fields:
      lbl: |-
        [[[
          return `<div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--secondary-text-color)">
            <ha-icon icon="${variables.icon}" style="--mdc-icon-size:15px;color:${variables.tint}"></ha-icon>${variables.label}</div>`;
        ]]]
    styles:
      card:
      - padding: 13px
      - border-radius: 22px
      - box-shadow: none
      - border: 1px solid rgba(var(--rgb-primary-text-color),0.07)
      - background: rgba(var(--rgb-primary-text-color),0.05)
      - height: '[[[ return variables.height; ]]]'
      - box-sizing: border-box
      - overflow: hidden
      grid:
      - grid-template-areas: '"lbl" "body"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content 1fr
      - align-content: start
      custom_fields:
        lbl:
        - justify-self: start
        body:
        - justify-self: stretch
        - text-align: left
        - min-width: '0'
  b_mini:
    show_name: false
    show_state: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
      - height: 34px
      - padding: '0'
      - border-radius: 12px
      - box-shadow: none
      - border: none
      - background: rgba(var(--rgb-primary-text-color),0.08)
      grid:
      - grid-template-areas: '"i"'
      icon:
      - width: 18px
      - color: var(--primary-text-color)
    state:
    - value: 'on'
      styles:
        card:
        - background: '#ff9a56'
        icon:
        - color: '#1d1002'
  b_act:
    show_name: true
    show_state: false
    hold_action:
      action: none
    styles:
      card:
      - padding: '0'
      - background: none
      - box-shadow: none
      - border: none
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-rows: 48px min-content
      img_cell:
      - width: 44px
      - height: 44px
      - border-radius: 50%
      - justify-self: center
      - background: rgba(var(--rgb-primary-text-color),0.08)
      icon:
      - width: 22px
      - color: var(--primary-text-color)
      name:
      - font-size: 10.5px
      - font-weight: '600'
      - color: var(--secondary-text-color)
      - margin-top: 2px

views:
  - title: Mobile Dashboard
    path: mobile-hub
    icon: cil:iphone-modern
    type: sections
    max_columns: 1
    dense_section_placement: true
    badges: []
    cards: []
    header:
      card:
        type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        triggers_update:
        - person.sushenmathur
        - person.paro
        - sensor.sushen_current_to_home_driving_time
        - sensor.paro_current_to_home_driving_time
        custom_fields:
          greet: |-
            [[[
              const h = new Date().getHours();
              const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
              const date = new Date().toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
              const etaFor = (person, sensor) => {
                if (!states[person] || states[person].state === 'home') return '';
                const m = Math.round(Math.abs(parseFloat(states[sensor] ? states[sensor].state : 0) || 0));
                if (!m) return '';
                return ' · ' + (m >= 60 ? `${Math.floor(m / 60)}hr ${m % 60}min` : `${m} min`) + ' from home';
              };
              let eta = '';
              if (user.name === 'Sushen') eta = etaFor('person.sushenmathur', 'sensor.sushen_current_to_home_driving_time');
              else if (user.name === 'Paro') eta = etaFor('person.paro', 'sensor.paro_current_to_home_driving_time');
              return `<div style="font-size:11.5px;font-weight:600;color:var(--secondary-text-color)">${date} · ${g}${eta}</div>
                <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1">${user.name}</div>`;
            ]]]
          sushen:
            card:
              type: custom:button-card
              template: b_avatar
              entity: person.sushenmathur
          paro:
            card:
              type: custom:button-card
              template: b_avatar
              entity: person.paro
        styles:
          card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px 4px 0
          - overflow: visible
          grid:
          - grid-template-areas: '"greet sushen paro"'
          - grid-template-columns: 1fr auto auto
          - column-gap: 8px
          - align-items: end
          custom_fields:
            greet:
            - justify-self: start
            - text-align: left
    sections:
    - type: grid
      cards:
      - type: custom:alert-ticker-card
        alerts:
        - conditions: []
          entity: binary_sensor.garage_door_sensor_contact
          icon: 🚨
          message: Garage Door Open
          name: Garage Door
          operator: '='
          priority: 1
          secondary_entity: switch.sonoff_1000f6b15b
          state: 'on'
          theme: emergency
          tts_engine: tts.google_ai_tts
          tts_entity: media_player.kitchen_speaker
          tts_notify_service: mobile_app_sushen_iphone
          use_ha_icon: false
          visible_to: null
        - conditions:
          - entity: binary_sensor.crimsafe_door_contact
            operator: '='
            state: 'on'
          entity: binary_sensor.front_door_contact
          icon: 🚨
          message: Front Door Open
          operator: '='
          priority: 1
          state: 'on'
          theme: emergency
          use_ha_icon: false
        - entity: binary_sensor.crimsafe_door_contact
          icon: 🔔
          message: Security Door Open
