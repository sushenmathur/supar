              # ---------------- Tesla ----------------
              - title: Tesla
                icon: mdi:car-sports
                card:
                  type: custom:button-card
                  entity: sensor.bluey_battery_level
                  show_icon: false
                  show_name: false
                  show_state: false
                  triggers_update:
                    - sensor.bluey_battery_level
                    - sensor.bluey_battery_range
                    - sensor.bluey_shift_state
                    - binary_sensor.bluey_charge_cable
                    - switch.bluey_charge
                    - sensor.bluey_inside_temperature
                    - sensor.bluey_time_to_full_charge
                    - input_boolean.bluey_show_range
                    - lock.bluey_lock
                    - climate.bluey_climate
                    - cover.bluey_trunk
                    - cover.bluey_frunk
                    - cover.bluey_charge_port_door
                    - device_tracker.bluey_location
                    - number.bluey_charge_limit
                    - number.bluey_charge_current
                  extra_styles: |
                    @keyframes chargepulse {
