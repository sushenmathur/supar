# ==========================================================================
# Mobile Hub - FULL raw configuration (Option B Home view + all other views)
#
# Dashboard > (pencil) Edit dashboard > three dots > Raw configuration editor
# Select everything, delete it, paste this whole file, Save.
# ==========================================================================

button_card_templates:

  # ---- Square control (the core of Option B) ------------------------------
  b_sq:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    variables:
      on_color: rgba(255, 169, 77, 0.95)
      on_text: '#1d1002'
      icon_color: var(--secondary-text-color)
      active: |
        [[[
          return entity
            ? ['on','open','opening','closing','unlocked','playing','cleaning','heat','cool','heat_cool'].includes(entity.state)
            : false;
        ]]]
    styles:
      card:
        - aspect-ratio: 1 / 1
        - padding: 10px
        - border-radius: 18px
        - box-shadow: none
        - border: |
            [[[ return variables.active ? '1px solid transparent' : '1px solid rgba(255,255,255,0.11)'; ]]]
        - background: |
            [[[ return variables.active ? variables.on_color : 'rgba(255,255,255,0.055)'; ]]]
        - color: |
            [[[ return variables.active ? variables.on_text : 'var(--primary-text-color)'; ]]]
        - transition: transform 0.12s ease
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      img_cell:
        - justify-content: flex-start
        - align-items: flex-start
      icon:
        - width: 22px
        - color: |
            [[[ return variables.active ? variables.on_text : variables.icon_color; ]]]
      name:
        - justify-self: start
        - text-align: left
        - font-size: 11px
        - font-weight: 700
        - line-height: 1.15
        - white-space: normal
      state:
        - justify-self: start
        - text-align: left
        - font-size: 10px
        - opacity: 0.75
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%

  # ---- Square light: fills from the bottom with brightness ----------------
  b_sq_light:
    template: b_sq
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state_display: |
      [[[
        if (entity.state !== 'on') return 'Off';
        const b = entity.attributes.brightness;
        return b ? Math.round(b / 2.55) + '%' : 'On';
      ]]]
    styles:
      card:
        - background: |
            [[[
              if (entity.state !== 'on') return 'rgba(255,255,255,0.055)';
              const b = entity.attributes.brightness;
              const p = b ? Math.round(b / 2.55) : 100;
              return `linear-gradient(to top, rgba(255,169,77,0.95) ${p}%, rgba(255,169,77,0.45) ${p}%)`;
            ]]]

  # ---- Square charger switch (Garage tab) ---------------------------------
  b_sq_charge:
    template: b_sq
    tap_action:
      action: toggle
    variables:
      on_color: rgba(0, 230, 118, 0.9)
      on_text: '#032612'
    state_display: |
      [[[ return entity.state === 'on' ? '⚡ Charging' : 'Start charging'; ]]]
    extra_styles: |
      @keyframes bpulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
    styles:
      icon:
        - animation: |
            [[[ return entity.state === 'on' ? 'bpulse 1.5s infinite' : 'none'; ]]]

  # ---- Round status button (replaces the old view badges) -----------------
  b_round:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    variables:
      tint: var(--secondary-text-color)
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 2px 0
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 46px min-content min-content
      img_cell:
        - width: 40px
        - height: 40px
        - border-radius: 50%
        - justify-self: center
        - background: |
            [[[ return `color-mix(in srgb, ${variables.tint} 20%, transparent)`; ]]]
      icon:
        - width: 20px
        - color: '[[[ return variables.tint; ]]]'
      name:
        - font-size: 10px
        - font-weight: 600
        - margin-top: 2px
      state:
        - font-size: 9.5px
        - opacity: 0.65
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%

  # ---- Person avatar for the header ---------------------------------------
  b_avatar:
    show_entity_picture: true
    show_icon: true
    show_name: false
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
        - overflow: visible
      grid:
        - grid-template-areas: '"i" "s"'
        - grid-template-rows: 36px min-content
      img_cell:
        - width: 34px
        - height: 34px
        - justify-self: center
      entity_picture:
        - width: 32px
        - height: 32px
        - border-radius: 50%
        - object-fit: cover
        - border: |
            [[[ return entity.state === 'home' ? '2px solid var(--green-color)' : '2px solid var(--amber-color)'; ]]]
      state:
        - font-size: 9.5px
        - opacity: 0.7
        - margin-top: 2px

  # ---- Money stat (Solar tab) ---------------------------------------------
  b_stat:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    variables:
      tint: var(--secondary-text-color)
    state_display: |
      [[[ return '$' + entity.state; ]]]
    styles:
      card:
        - padding: 8px 4px
        - border-radius: 14px
        - box-shadow: none
        - border: none
        - background: |
            [[[ return `color-mix(in srgb, ${variables.tint} 15%, transparent)`; ]]]
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-rows: 20px min-content min-content
      icon:
        - width: 16px
        - color: '[[[ return variables.tint; ]]]'
      name:
        - font-size: 9.5px
        - opacity: 0.8
      state:
        - font-size: 11.5px
        - font-weight: 700
        - color: '[[[ return variables.tint; ]]]'

  # ---- Tesla action button (inside the Tesla card) ------------------------
  b_tesla_act:
    show_name: true
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 0
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 42px 16px
      img_cell:
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - justify-self: center
        - background: rgba(255, 255, 255, 0.09)
      icon:
        - width: 20px
        - height: 20px
      name:
        - color: '#8f8f8f'
        - font-size: 10px
        - margin-top: 2px


views:
  - title: Mobile Dashboard
    path: mobile-hub
    icon: cil:iphone-modern
    type: sections
    max_columns: 1
    dense_section_placement: true
    badges: []
    cards: []

    # ---------------------------------------------------------------------
    # Header: greeting + name, family avatars, weather / date / ETA strip
    # ---------------------------------------------------------------------
    header:
      card:
        type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        triggers_update:
          - weather.north_lakes_weather
          - weather.forecast_home_2
          - sensor.home_apparent_temperature
          - person.sushenmathur
          - person.paro
          - sensor.sushen_eta_home_2
          - sensor.paro_eta_home_2
        custom_fields:
          greet: |
            [[[
              const h = new Date().getHours();
              const g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
              return `
                <div style="font-size:11px;font-weight:600;color:var(--secondary-text-color);letter-spacing:.02em">${g}</div>
                <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05;
                  background:linear-gradient(90deg,#ff9a56,#ffd56b);-webkit-background-clip:text;
                  background-clip:text;-webkit-text-fill-color:transparent">${user.name}</div>`;
            ]]]
          sushen:
            card:
              type: custom:button-card
              template: b_avatar
              entity: person.sushenmathur
          paro:
            card:
              type: custom:button-card
              template: b_avatar
              entity: person.paro
          wx: |
            [[[
              const cond = states['weather.north_lakes_weather'] ? states['weather.north_lakes_weather'].state : '';
              const map = {
                'clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','fog':'mdi:weather-fog',
                'hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy',
                'partlycloudy':'mdi:weather-partly-cloudy','pouring':'mdi:weather-pouring','rainy':'mdi:weather-rainy',
                'snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','sunny':'mdi:weather-sunny',
                'windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy-variant','exceptional':'mdi:alert-circle-outline'
              };
              const icon = map[cond] || 'mdi:weather-cloudy';
              const pretty = cond ? cond.charAt(0).toUpperCase() + cond.slice(1) : '';
              const w = states['weather.forecast_home_2'] ? states['weather.forecast_home_2'].attributes : {};
              const feels = states['sensor.home_apparent_temperature'] ? states['sensor.home_apparent_temperature'].state : '–';
              const date = new Date().toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });

              const etaFor = (person, sensor) => {
                if (!states[person] || states[person].state === 'home') return '';
                const m = Math.round(Math.abs(parseFloat(states[sensor] ? states[sensor].state : 0) || 0));
                if (!m) return '';
                return ' · 🚗 ' + (m >= 60 ? `${Math.floor(m / 60)}hr ${m % 60}min` : `${m} mins`) + ' to home';
              };
              let eta = '';
              if (user.name === 'Sushen') eta = etaFor('person.sushenmathur', 'sensor.sushen_eta_home_2');
              else if (user.name === 'Paro') eta = etaFor('person.paro', 'sensor.paro_eta_home_2');

              return `
                <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;
                  background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.11);text-align:left">
                  <div style="display:flex;align-items:center;gap:4px;font-size:26px;font-weight:600;line-height:1;white-space:nowrap">
                    <ha-icon icon="${icon}" style="--mdc-icon-size:24px;color:#ffc53d"></ha-icon>${w.temperature ?? '–'}°
                  </div>
                  <div style="font-size:11.5px;line-height:1.35;color:var(--secondary-text-color);min-width:0">
                    <b style="color:var(--primary-text-color)">${pretty}</b> · feels ${feels}° · ${w.humidity ?? '–'}%<br>${date}${eta}
                  </div>
                </div>`;
            ]]]
        styles:
          card:
            - background: none
            - box-shadow: none
            - border: none
            - padding: 4px 4px 0
            - overflow: visible
          grid:
            - grid-template-areas: '"greet sushen paro" "wx wx wx"'
            - grid-template-columns: 1fr auto auto
            - column-gap: 10px
            - row-gap: 10px
            - align-items: end
          custom_fields:
            greet:
              - justify-self: start
              - text-align: left
            wx:
              - justify-self: stretch

    sections:

      # -------------------------------------------------------------------
      # Alerts (unchanged)
      # -------------------------------------------------------------------
      - type: grid
        cards:
          - type: custom:alert-ticker-card
            alerts:
              - conditions: []
                entity: binary_sensor.garage_door_sensor_contact
                icon: 🚨
                message: Garage Door Open
                name: Garage Door
                operator: '='
                priority: 1
                secondary_entity: switch.sonoff_1000f6b15b
                state: 'on'
                theme: emergency
                tts_engine: tts.google_ai_tts
                tts_entity: media_player.kitchen_speaker
                tts_notify_service: mobile_app_sushen_iphone
                use_ha_icon: false
                visible_to: null
              - conditions:
                  - entity: binary_sensor.crimsafe_door_contact
                    operator: '='
                    state: 'on'
                entity: binary_sensor.front_door_contact
                icon: 🚨
                message: Front Door Open
                operator: '='
                priority: 1
                state: 'on'
                theme: emergency
                use_ha_icon: false
              - entity: binary_sensor.crimsafe_door_contact
                icon: 🔔
                message: Security Door Open
                name: Security Screen Open
                operator: '='
                priority: 3
                state: 'on'
                theme: notification
              - entity: binary_sensor.patio_door_contact
                icon: 🚪
                message: Patio Door
                name: Patio
                operator: '='
                priority: 3
                push_notify: true
                push_notify_service: mobile_app_suparhub2
                state: 'on'
                theme: door
              - entity: binary_sensor.laundrydoorsensor_contact
                icon: 🚪
                message: Laundry Door Door
                name: Laundry Door Open
                operator: '='
                priority: 3
                state: 'on'
                theme: door
              - entity: binary_sensor.side_door_contact
                icon: ''
                message: Side Door
                name: Side Door
                operator: '='
                priority: 1
                state: 'on'
                theme: emergency
              - entity: sensor.robbie_dock_dock_error
                icon: 💧
                message: Roborock Water Tank Empty
                name: Vaccum Water Tank Empty
                operator: '!='
                priority: 3
                state: ok
                theme: leak
            clear_message: ''
            clear_theme: success
            cycle_animation: slide
            cycle_interval: 5
            grid_options:
              columns: 12
              rows: auto
            ha_theme: true
            overlay_duration: 10
            overlay_mode: true
            overlay_position: bottom
            overlay_scale: 1.5
            show_when_clear: false
            swipe_to_snooze: true

      # -------------------------------------------------------------------
      # Status row + Security squares + Calendar
      # -------------------------------------------------------------------
      - type: grid
        cards:
          - type: grid
            columns: 5
            square: false
            cards:
              - type: custom:button-card
                template: b_round
                entity: device_tracker.kia_gps_location
                name: Kia
                icon: mdi:car
                variables:
                  tint: var(--primary-text-color)
              - type: custom:button-card
                template: b_round
                entity: device_tracker.bluey_location
                name: Tesla
                icon: mdi:car-electric
                variables:
                  tint: var(--blue-color)
              - type: custom:button-card
                template: b_round
                entity: sensor.general_waste_daysto
                name: Bins
                icon: mdi:trash-can-outline
                triggers_update:
                  - sensor.recycle_waste_daysto
                  - sensor.garden_waste_daysto
                variables:
                  tint: var(--amber-color)
                state_display: |
                  [[[
                    const due = s => [0, 1].includes(parseInt(states[s] ? states[s].state : 99));
                    let out = '';
                    if (due('sensor.general_waste_daysto')) out += '🔴';
                    if (due('sensor.recycle_waste_daysto')) out += '🟡';
                    if (due('sensor.garden_waste_daysto')) out += '🟢';
                    return out ? out + ' out' : 'None due';
                  ]]]
                visibility:
                  - condition: or
                    conditions:
                      - condition: numeric_state
                        entity: sensor.garden_waste_daysto
                        above: 0
                        below: 2
                      - condition: numeric_state
                        entity: sensor.general_waste_daysto
                        above: 0
                        below: 2
                      - condition: numeric_state
                        entity: sensor.recycle_waste_daysto
                        above: 0
                        below: 2
              - type: custom:button-card
                template: b_round
                entity: binary_sensor.shanaya_room_occupancy_status
                name: Shanaya
                icon: mdi:teddy-bear
                state_display: |
                  [[[ return entity.state === 'on' ? 'Occupied' : 'Clear'; ]]]
                variables:
                  tint: |
                    [[[ return entity.state === 'on' ? 'var(--red-color)' : 'var(--green-color)'; ]]]
              - type: custom:button-card
                template: b_round
                entity: binary_sensor.samar_room_occupancy_new
                name: Samar
                icon: mdi:bed
                state_display: |
                  [[[ return entity.state === 'on' ? 'Occupied' : 'Clear'; ]]]
                variables:
                  tint: |
                    [[[ return entity.state === 'on' ? 'var(--red-color)' : 'var(--green-color)'; ]]]

          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                template: b_sq
                entity: cover.garage_door_v2
                name: Garage Door
                tap_action:
                  action: toggle
                triggers_update:
                  - input_select.garage_door_state
                variables:
                  on_color: rgba(255, 90, 79, 0.92)
                  on_text: '#ffffff'
                icon: |
                  [[[
                    const s = entity.state;
                    if (s === 'open') return 'mdi:garage-open-variant';
                    if (s === 'opening') return 'mdi:arrow-up-bold-box-outline';
                    if (s === 'closing') return 'mdi:arrow-down-bold-box-outline';
                    return 'mdi:garage-variant';
                  ]]]
                state_display: |
                  [[[ return states['input_select.garage_door_state'] ? states['input_select.garage_door_state'].state : entity.state; ]]]
              - type: custom:button-card
                template: b_sq
                entity: input_boolean.front_door
                name: Front Door
                tap_action:
                  action: toggle
                triggers_update:
                  - binary_sensor.front_door_contact
                variables:
                  on_color: rgba(255, 90, 79, 0.92)
                  on_text: '#ffffff'
                icon: |
                  [[[ return entity.state === 'off' ? 'mdi:lock' : 'mdi:lock-off-outline'; ]]]
                state_display: |
                  [[[ return entity.state === 'off' ? 'Locked' : 'Unlocked'; ]]]
                custom_fields:
                  door: |
                    [[[
                      return states['binary_sensor.front_door_contact'] && states['binary_sensor.front_door_contact'].state === 'on'
                        ? '<ha-icon icon="mdi:door-open" style="--mdc-icon-size:16px;color:var(--red-color)"></ha-icon>'
                        : '';
                    ]]]
                styles:
                  custom_fields:
                    door:
                      - position: absolute
                      - top: 8px
                      - right: 8px
              - type: custom:button-card
                template: b_sq
                entity: alarm_control_panel.home_alarm
                name: Alarm
                icon: mdi:shield-home
                variables:
                  on_color: rgba(48, 209, 88, 0.9)
                  on_text: '#04210d'
                  active: |
                    [[[ return entity.state !== 'disarmed' && entity.state !== 'unavailable'; ]]]
              - type: picture-entity
                entity: camera.driveway_live_view
                camera_image: camera.driveway_live_view
                camera_view: auto
                aspect_ratio: '1:1'
                fit_mode: cover
                name: Driveway
                show_name: true
                show_state: false

          - type: custom:calendar-card-pro
            entities:
              - calendar.supar_family
            compact_days_to_show: 1
            compact_events_complete_days: true
            compact_events_to_show: 3
            filter_duplicates: true
            show_location: false
            tap_action:
              action: expand
            today_weekday_color: Blue
            visibility:
              - condition: screen
                media_query: '(min-width: 0px)'
              - condition: state
                entity: sensor.upcoming_events
                state_not: none
            weather:
              date:
                color: var(--primary-text-color)
                font_size: 12px
                icon_size: 14px
                show_conditions: true
                show_high_temp: true
                show_low_temp: false
              event:
                color: var(--primary-text-color)
                font_size: 12px
                icon_size: 14px
                show_conditions: true
                show_temp: true
              position: event

      # -------------------------------------------------------------------
      # Tabs
      # -------------------------------------------------------------------
      - type: grid
        cards:
          - type: custom:simple-tabs
            alignment: center
            bar_background: glass
            button_active_background: Orange
            haptic_feedback: true
            hide_inactive_tab_titles: true
            remember_tab: per_device
            tabs:

              # ---------------- Favourites ----------------
              - id: 'TabFav '
                title: Favourites
                icon: mdi:heart
                cards:
                  - type: custom:mushroom-chips-card
                    alignment: justify
                    chips:
                      - type: entity
                        entity: script.say_tts_message
                        content_info: name
                      - type: entity
                        entity: script.attention_paro
                        icon: mdi:phone
                        content_info: name
                      - type: entity
                        entity: script.lost_phone
                        content_info: name
                  - type: grid
                    columns: 4
                    square: false
                    cards:
                      - type: custom:button-card
                        template: b_sq
                        entity: scene.good_night
                        name: Good Night
                        show_state: false
                        variables:
                          icon_color: var(--blue-color)
                      - type: custom:button-card
                        template: b_sq
                        entity: scene.good_morning
                        name: Good Morning
                        show_state: false
                        variables:
                          icon_color: var(--amber-color)
                      - type: custom:button-card
                        template: b_sq_light
                        entity: light.kitchen_pendant_lights
                        name: Pendant Lights
                        icon: mdi:ceiling-light-multiple
                      - type: custom:button-card
                        template: b_sq_light
                        entity: light.driveway_light_2
                        name: Driveway
                        icon: mdi:light-flood-down
                      - type: custom:button-card
                        template: b_sq
                        entity: cover.garage_door_v2
                        name: Garage
                        icon: mdi:garage-variant
                        tap_action:
                          action: toggle
                        variables:
                          on_color: rgba(255, 90, 79, 0.92)
                          on_text: '#ffffff'
                      - type: custom:button-card
                        template: b_sq
                        entity: media_player.tv
                        name: Netflix
                        icon: phu:netflix
                        show_state: false
                        variables:
                          icon_color: '#E50914'
                          active: |
                            [[[ return entity.attributes.source === 'Netflix'; ]]]
                        tap_action:
                          action: perform-action
                          perform_action: media_player.select_source
                          target:
                            entity_id: media_player.tv
                          data:
                            source: Netflix
                      - type: custom:button-card
                        template: b_sq
                        entity: media_player.tv
                        name: YouTube
                        icon: phu:youtube
                        show_state: false
                        variables:
                          icon_color: '#FF0000'
                          active: |
                            [[[ return entity.attributes.source === 'YouTube'; ]]]
                        tap_action:
                          action: perform-action
                          perform_action: media_player.select_source
                          target:
                            entity_id: media_player.tv
                          data:
                            source: YouTube
                      - type: custom:button-card
                        template: b_sq
                        entity: media_player.tv
                        name: Stremio
                        icon: phu:stremio
                        show_state: false
                        variables:
                          icon_color: '#61D3E4'
                          active: |
                            [[[ return entity.attributes.source === 'Stremio'; ]]]
                        tap_action:
                          action: perform-action
                          perform_action: media_player.select_source
                          target:
                            entity_id: media_player.tv
                          data:
                            source: Stremio
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: tile
                        entity: media_player.tv
                        show_entity_picture: true
                        vertical: false
                        features:
                          - type: media-player-playback
                        features_position: bottom
                        state_content:
                          - state
                          - source
                        hold_action:
                          action: toggle
                        icon_tap_action:
                          action: perform-action
                          perform_action: script.media_tv_power
                          target: {}
                      - type: tile
                        entity: media_player.kitchen_speaker
                        show_entity_picture: true
                        vertical: false
                        features:
                          - type: media-player-playback
                        features_position: bottom
                        state_content:
