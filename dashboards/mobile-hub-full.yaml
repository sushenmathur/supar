                  </div>`;
              ]]]
            car: |
              [[[
                const cableConnected = states['binary_sensor.bluey_charge_cable'].state === 'on';
                const charging = states['switch.bluey_charge'].state === 'on';
                const carImage = cableConnected ? '/local/tesla_charging.png' : '/local/bluey_icon.png';
                const chargePulse = charging ? `
                  <div style="position:absolute;bottom:2%;left:50%;transform:translateX(-50%);width:70%;height:12px;pointer-events:none;">
                    <div style="position:absolute;inset:0;border-radius:999px;
                      background:radial-gradient(ellipse at center, rgba(0,255,136,0.6) 0%, rgba(0,255,136,0) 72%);
                      animation: chargepulse 1.6s ease-in-out infinite;"></div>
