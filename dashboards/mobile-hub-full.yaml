                <div style="display:flex;gap:12px;margin-top:8px;font-size:10.5px;color:var(--secondary-text-color);flex-wrap:wrap">
                  ${leg('#ffb020', 'Solar ' + sPct + '%')}${leg('#a67cff', 'Grid ' + gPct + '%')}${leg('#30d158', 'Cars ' + fmt(cars).join(' '))}</div>`;
            ]]]
