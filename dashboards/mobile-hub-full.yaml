  - title: 'Cameras '
    path: mobile-cameras
    icon: mdi:webcam
    type: sections
    subview: true
    max_columns: 1
    dense_section_placement: true
    badges: []
    cards: []

    # Header: title + live summary of doors and motion
    header:
      card:
        type: custom:button-card
        template: b_title
        triggers_update:
          - binary_sensor.patiopresencesensor_occupancy
          - binary_sensor.side_door_contact
          - binary_sensor.laundrydoorsensor_contact
          - binary_sensor.patio_door
        variables:
          title: Cameras
          sub: |
            [[[
              const doors = ['binary_sensor.side_door_contact','binary_sensor.laundrydoorsensor_contact','binary_sensor.patio_door']
                .filter(d => states[d] && states[d].state === 'on').length;
              const motion = states['binary_sensor.patiopresencesensor_occupancy']
                && states['binary_sensor.patiopresencesensor_occupancy'].state === 'on';
              const bits = ['7 cameras'];
              bits.push(doors ? `<span style="color:var(--red-color)">${doors} door${doors > 1 ? 's' : ''} open</span>` : 'all doors closed');
              if (motion) bits.push('<span style="color:var(--amber-color)">motion on patio</span>');
              return bits.join(' · ');
            ]]]

    sections:

      # Status row: motion + doors (replaces the old badges)
      - type: grid
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                template: b_round
                entity: binary_sensor.patiopresencesensor_occupancy
                name: Patio
                icon: mdi:motion-sensor
                state_display: |
                  [[[ return entity.state === 'on' ? 'Motion' : 'Clear'; ]]]
                variables:
                  tint: |
                    [[[ return entity.state === 'on' ? 'var(--amber-color)' : 'var(--green-color)'; ]]]
              - type: custom:button-card
                template: b_round
                entity: binary_sensor.side_door_contact
                name: Side Door
                icon: |
                  [[[ return entity.state === 'on' ? 'mdi:door-open' : 'mdi:door-closed'; ]]]
