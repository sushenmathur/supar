  - title: HVAC
    path: hvac-mobile
    icon: cil:home-climate
    type: sections
    subview: true
    max_columns: 1
    dense_section_placement: true
    badges: []
    cards: []

    header:
      card:
        type: custom:button-card
        template: b_title
        triggers_update:
          - climate.bed_ac
          - climate.living_room
          - climate.samar_room
          - climate.shanaya_room
          - sensor.living_room_inside_temperature
          - sensor.bedroom_temperature_temperature
          - sensor.aarlo_temperature_samar_cam
          - sensor.shanayaroomtemp_temperature
        variables:
          title: Climate
          sub: |
            [[[
              const acs = ['climate.bed_ac', 'climate.living_room', 'climate.samar_room', 'climate.shanaya_room'];
              const running = acs.filter(a => states[a] && !['off', 'unavailable'].includes(states[a].state)).length;
              const temps = ['sensor.living_room_inside_temperature', 'sensor.bedroom_temperature_temperature',
                             'sensor.aarlo_temperature_samar_cam', 'sensor.shanayaroomtemp_temperature']
                .map(s => parseFloat(states[s] ? states[s].state : NaN)).filter(n => !isNaN(n));
              const avg = temps.length ? (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1) : '–';
              return `4 rooms · avg ${avg} °C · ` + (running ? `<span style="color:var(--amber-color)">${running} running</span>` : 'all off');
            ]]]

    sections:
      - type: grid
        cards:
