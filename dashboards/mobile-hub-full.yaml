  - title: Devices
    path: devices-mobile
    icon: mdi:devices
    type: sections
    subview: true
    show_icon_and_title: true
    max_columns: 1
    dense_section_placement: true
    badges: []
    cards: []

    header:
      card:
        type: custom:button-card
        template: b_title
        triggers_update:
          - sensor.sushen_phone_battery
          - sensor.paro_phone_battery
          - media_player.tv
          - switch.bedroom_tv
          - media_player.media_apple_tv
          - media_player.bedroom_apple_tv
        variables:
          title: Devices
          sub: |
            [[[
              const on = e => states[e] && !['off', 'unavailable', 'standby'].includes(states[e].state);
              const tag = (e, n) => on(e) ? `<span style="color:var(--amber-color)">${n} on</span>` : `${n} off`;
              return [tag('media_player.tv', 'Media TV'), tag('switch.bedroom_tv', 'Bedroom TV'),
                      tag('media_player.media_apple_tv', 'Media Apple TV'),
                      tag('media_player.bedroom_apple_tv', 'Bedroom Apple TV')].join(' · ');
            ]]]

    sections:
      - type: grid
        cards:
          # Phones: battery + iCloud3 info + Ping (replaces the two ping badges)
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: b_phone
                entity: sensor.sushen_phone_battery
                name: Sushen iPhone
                triggers_update:
                  - sensor.sushen_phone_badge
                variables:
                  device: b4c6338c2f8906f56d55bb1d873be555
                  info: sensor.sushen_phone_badge
                  tint: '#9b6bff'
              - type: custom:button-card
                template: b_phone
                entity: sensor.paro_phone_battery
                name: Paro iPhone
                triggers_update:
                  - sensor.paro_phone_info
                variables:
                  device: 1ff71fcd1fb9dfa21717952630c8f773
                  info: sensor.paro_phone_info
                  tint: '#3a8dff'

          # TVs
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: b_wide
                entity: media_player.tv
                name: Media TV
                icon: mdi:television
                show_entity_picture: false
                state_display: |
                  [[[ return entity.state === 'off' ? 'Off · tap for power' : (entity.attributes.source || entity.state); ]]]
                tap_action:
                  action: perform-action
                  perform_action: script.media_tv_power
                hold_action:
                  action: more-info
              - type: custom:button-card
                template: b_wide
                entity: switch.bedroom_tv
                name: Bedroom TV
                icon: mdi:television-classic
                tap_action:
                  action: toggle
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: b_wide
                entity: media_player.media_apple_tv
                name: Media Apple TV
                icon: mdi:apple
                variables:
                  on_color: rgba(191, 90, 242, 0.9)
                  on_text: '#ffffff'
                  active: |
                    [[[ return !['off', 'standby', 'unavailable'].includes(entity.state); ]]]
                state_display: |
                  [[[
                    if (['off', 'standby', 'unavailable'].includes(entity.state)) return 'Off';
                    const a = entity.attributes;
                    const what = a.media_title || a.app_name || '';
                    const st = entity.state.charAt(0).toUpperCase() + entity.state.slice(1);
                    return what ? `${st} · ${what}` : st;
                  ]]]
                tap_action:
                  action: more-info
                hold_action:
                  action: perform-action
                  perform_action: media_player.media_play_pause
                  target:
                    entity_id: media_player.media_apple_tv
              - type: custom:button-card
                template: b_wide
                entity: media_player.bedroom_apple_tv
                name: Bedroom Apple TV
                icon: mdi:apple
                variables:
                  on_color: rgba(191, 90, 242, 0.9)
                  on_text: '#ffffff'
                  active: |
                    [[[ return !['off', 'standby', 'unavailable'].includes(entity.state); ]]]
                state_display: |
                  [[[
                    if (['off', 'standby', 'unavailable'].includes(entity.state)) return 'Off';
                    const a = entity.attributes;
                    const what = a.media_title || a.app_name || '';
                    const st = entity.state.charAt(0).toUpperCase() + entity.state.slice(1);
                    return what ? `${st} · ${what}` : st;
                  ]]]
                tap_action:
                  action: more-info
                hold_action:
                  action: perform-action
                  perform_action: media_player.media_play_pause
                  target:
                    entity_id: media_player.bedroom_apple_tv

          # TV Remote launcher: opens the Bubble Card pop-up (#tv-remote)
          - type: custom:button-card
            entity: media_player.tv
            name: TV Remote
            icon: mdi:remote-tv
            show_state: true
            tap_action:
              action: navigate
              navigation_path: '#tv-remote'
            hold_action:
              action: more-info
            state_display: |
              [[[
                if (entity.state === 'off' || entity.state === 'unavailable') return 'Media TV · Off';
                return 'Media TV · ' + (entity.attributes.source || entity.state);
              ]]]
            custom_fields:
              quick:
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      template: b_qbtn
                      icon: mdi:power
                      variables:
                        color: var(--red-color)
                      tap_action:
                        action: perform-action
                        perform_action: script.media_tv_power
                    - type: custom:button-card
                      template: b_qbtn
                      icon: '[[[ return entity.attributes.is_volume_muted ? "mdi:volume-off" : "mdi:volume-mute"; ]]]'
                      variables:
                        color: '[[[ return entity.attributes.is_volume_muted ? "var(--amber-color)" : "var(--primary-text-color)"; ]]]'
                      tap_action:
                        action: perform-action
                        perform_action: media_player.volume_mute
                        target:
                          entity_id: media_player.tv
                        data:
                          is_volume_muted: '[[[ return entity.attributes.is_volume_muted !== true; ]]]'
                    - type: custom:button-card
