                      - return_home
                    fill_container: true
                    icon_animation: true
                    layout: horizontal
                  - type: grid
                    columns: 3
                    square: false
                    cards:
                      - type: custom:button-card
                        template: b_sq
                        entity: button.robbie_media_kitchen2
                        name: Media & Kitchen
                        icon: mdi:silverware-clean
                        show_state: false
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.robbie_media_kitchen2
                      - type: custom:button-card
                        template: b_sq
                        entity: button.robbie_tiled_area_clean
                        name: Mop Tiled Area
                        icon: mdi:vacuum-outline
                        show_state: false
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.robbie_tiled_area_clean
                      - type: custom:button-card
                        template: b_sq
                        entity: button.robbie_media_clean
                        name: Media Clean
                        icon: mdi:television-shimmer
                        show_state: false
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.robbie_media_clean
