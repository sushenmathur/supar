# Electricity bill history: keeps the previous period's bill for comparison.
#
# The billing period runs from the 16th to the 15th. At 00:00 on the 16th the
# "Reset Monthly Billing Data" automation zeroes input_number.billing_import_total,
# billing_solar_credit and the previous_daily_* helpers. One minute earlier
# (23:59 on the 15th), this package copies the final bill-to-date into
# input_number.electricity_last_bill, so it is saved before anything resets.
# The Energy dashboard compares the current estimated bill against it.
#
# Seed it once with your last actual bill: set input_number.electricity_last_bill
# in Settings > Devices & services > Helpers (or Developer tools > Actions).
#
# Put this file in /config/packages/ (packages must be enabled in configuration.yaml)
# and restart Home Assistant.

input_number:
  electricity_last_bill:
    name: Electricity Last Bill
    min: 0
    max: 5000
    step: 0.01
    mode: box
    unit_of_measurement: "$"
    icon: mdi:receipt-text-clock

automation:
  - id: electricity_store_last_bill
    alias: Electricity - store last bill at period end
    description: >-
      Copies the final bill-to-date into input_number.electricity_last_bill
      at 23:59 on the 15th, the last day of each billing period.
    mode: single
    triggers:
      - trigger: time
        at: "23:59:00"
    conditions:
      - condition: template
        value_template: "{{ now().day == 15 }}"
      - condition: template
        value_template: "{{ has_value('sensor.electricity_bill_to_date') }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.electricity_last_bill
        data:
          value: "{{ states('sensor.electricity_bill_to_date') | float(0) | round(2) }}"
