header:
  card:
    cards:
      - content: '# Garage'
        text_only: true
        type: markdown
      - alignment: center
        chips:
          - entity: binary_sensor.garage_door_sensor_contact
            type: entity
          - entity: binary_sensor.hallwaydoorsensor_contact
            type: entity
          - content_info: state
            entity: binary_sensor.garagemotionsensor_occupancy
            type: entity
          - entity: sensor.garagemotionsensor_device_temperature
            type: entity
        type: custom:mushroom-chips-card
    type: vertical-stack
  layout: center
icon: mdi:garage-lock
max_columns: 3
path: garage
sections:
  - type: grid
    cards:
      - assets_path: /local/garage-card-custom-v3
        car1_presence_entity: binary_sensor.tesla_at_home
        car2_presence_entity: binary_sensor.kia_at_home
        door_entity: cover.garage_door_v2
        grid_options:
          columns: full
          rows: auto
        keep_open_entity: input_boolean.keep_garage_door_open
        light_entity: light.garage_light
        type: custom:garage-card
      - cameras:
          - camera_entity: camera.garage_live_view
        dimensions:
          aspect_ratio_mode: static
          aspect_ratio: [16, 7]
        grid_options:
          columns: full
        type: custom:advanced-camera-card
  - type: grid
    cards:
      - type: custom:button-card
        entity: sensor.bluey_battery_level
        template: glass_vehicle
        variables:
          title: Bluey
          image: /api/image/serve/cdd510be49f2493bc87fd540c01cea69/512x512
          battery: sensor.bluey_battery_level
          tracker: device_tracker.bluey_location
          onroad: input_boolean.tesla_onroad
          charging: '[[[ return states["sensor.bluey_charging"]?.state === "Charging"; ]]]'
        grid_options:
          columns: 12
          rows: 8
      - type: custom:button-card
        entity: sensor.bluey_battery_range
        name: Range
        icon: mdi:gauge
        template: glass_chip
        label: >-
          [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        entity: sensor.bluey_charge_energy_added
        name: Last Charge
        icon: mdi:lightning-bolt
        template: glass_chip
        label: >-
          [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        entity: lock.bluey_lock
        name: Lock
        icon: mdi:lock
        template: glass_chip
        label: >-
          [[[ return entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' '); ]]]
        tap_action:
          action: toggle
          confirmation:
            text: Lock or unlock Bluey?
        grid_options:
          columns: 4
          rows: 1
      - type: custom:button-card
        entity: cover.bluey_trunk
        name: Boot
        icon: phu:tesla-trunk
        template: glass_chip
        label: >-
          [[[ return entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' '); ]]]
        tap_action:
          action: toggle
          confirmation:
            text: Open or close the boot?
        grid_options:
          columns: 4
          rows: 1
      - type: custom:button-card
        entity: switch.bluey_charge
        name: Charger
        icon: mdi:ev-station
        template: glass_chip
        label: >-
          [[[ return entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' '); ]]]
        tap_action:
          action: toggle
        grid_options:
          columns: 4
          rows: 1
  - type: grid
    cards:
      - type: custom:button-card
        entity: input_number.kia_battery_estimate
        template: glass_vehicle
        variables:
          title: Kia
          image: /api/image/serve/b0801eee9b5f2d6fcf7972d71f0d7711/512x512
          battery: input_number.kia_battery_estimate
          tracker: device_tracker.kia_gps_location
          onroad: input_boolean.kia_onroad
          charging: '[[[ return parseFloat(states["sensor.kia_charger_power"]?.state) > 10; ]]]'
        grid_options:
          columns: 12
          rows: 8
      - type: custom:button-card
        entity: sensor.kia_charger_power
        name: Charge Power
        icon: mdi:flash
        template: glass_chip
        label: >-
          [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        entity: sensor.kia_last_charge_added
        name: Last Charge
        icon: mdi:lightning-bolt
        template: glass_chip
        label: >-
          [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
        grid_options:
          columns: 6
          rows: 1
      - type: custom:button-card
        entity: switch.kia_charger
        name: Charger
        icon: mdi:ev-station
        template: glass_chip
        label: >-
          [[[ return entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' '); ]]]
        tap_action:
          action: toggle
        grid_options:
          columns: 4
          rows: 1
      - type: custom:button-card
        entity: input_boolean.kia_onroad
        name: On Road
        icon: mdi:road-variant
        template: glass_chip
        label: >-
          [[[ return entity.state === 'on' ? 'Driving' : 'Parked'; ]]]
        tap_action:
          action: toggle
        grid_options:
          columns: 4
          rows: 1
      - type: custom:button-card
        entity: binary_sensor.kia_at_home
        name: Home
        icon: mdi:home-map-marker
        template: glass_chip
        label: >-
          [[[ return entity.state === 'on' ? 'At home' : 'Away'; ]]]
        tap_action:
          action: more-info
        grid_options:
          columns: 4
          rows: 1
      - template: main
        type: custom:navbar-card
subview: true
title: Garage
type: sections
theme: Glass
cards: []
