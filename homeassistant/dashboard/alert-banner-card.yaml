type: conditional
grid_options:
  columns: full
conditions:
  - condition: or
    conditions:
      - condition: state
        entity: binary_sensor.garage_door_sensor_contact
        state: 'on'
      - condition: state
        entity: binary_sensor.side_door_contact
        state: 'on'
      - condition: and
        conditions:
          - condition: state
            entity: input_boolean.alert_banner_snooze
            state: 'off'
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.front_door_contact
                state: 'on'
              - condition: state
                entity: binary_sensor.crimsafe_door_contact
                state: 'on'
              - condition: state
                entity: binary_sensor.patio_door_contact
                state: 'on'
              - condition: state
                entity: binary_sensor.laundrydoorsensor_contact
                state: 'on'
              - condition: and
                conditions:
                  - condition: state
                    entity: sensor.robbie_dock_dock_error
                    state_not: ok
                  - condition: state
                    entity: sensor.robbie_dock_dock_error
                    state_not: unavailable
                  - condition: state
                    entity: sensor.robbie_dock_dock_error
                    state_not: unknown
card:
  type: custom:button-card
  show_icon: false
  show_name: false
  show_state: false
  triggers_update: all
  tap_action:
    action: navigate
    navigation_path: /dashboard-hub/security
  extra_styles: |
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 24px rgba(244,63,94,.45), inset 0 1px 0 rgba(255,255,255,.5); }
      50% { box-shadow: 0 0 56px rgba(244,63,94,.85), inset 0 1px 0 rgba(255,255,255,.5); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  variables:
    alerts: |
      [[[
        const s = id => states[id]?.state;
        const on = id => s(id) === 'on';
        const snoozed = on('input_boolean.alert_banner_snooze');
        const front = on('binary_sensor.front_door_contact');
        const screen = on('binary_sensor.crimsafe_door_contact');
        const robbie = s('sensor.robbie_dock_dock_error');
        const list = [];
        // Garage and side door are never snoozed. Turning "keep open" on calms them down instead.
        if (on('binary_sensor.garage_door_sensor_contact')) {
          const kept = on('input_boolean.keep_garage_door_open');
          list.push({ p: kept ? 3 : 1, id: 'binary_sensor.garage_door_sensor_contact', msg: kept ? 'Garage door kept open' : 'Garage door open', icon: 'mdi:garage-open-variant' });
        }
        if (on('binary_sensor.side_door_contact')) {
          const kept = on('input_boolean.keep_side_door_open');
          list.push({ p: kept ? 3 : 1, id: 'binary_sensor.side_door_contact', msg: kept ? 'Side door kept open' : 'Side door open', icon: 'mdi:door-open' });
        }
        // Everything below can be snoozed.
        if (!snoozed) {
          if (front && screen)
            list.push({ p: 1, id: 'binary_sensor.front_door_contact', msg: 'Front and security doors open', icon: 'mdi:door-open' });
          if (front && !screen)
            list.push({ p: 2, id: 'binary_sensor.front_door_contact', msg: 'Front door open', icon: 'mdi:home-alert' });
          if (screen && !front)
            list.push({ p: 3, id: 'binary_sensor.crimsafe_door_contact', msg: 'Security door open', icon: 'mdi:shield-home' });
          if (on('binary_sensor.patio_door_contact'))
            list.push({ p: 3, id: 'binary_sensor.patio_door_contact', msg: 'Patio door open', icon: 'mdi:door-open' });
          if (on('binary_sensor.laundrydoorsensor_contact'))
            list.push({ p: 3, id: 'binary_sensor.laundrydoorsensor_contact', msg: 'Laundry door open', icon: 'mdi:door-open' });
          if (robbie && !['ok', 'unavailable', 'unknown'].includes(robbie))
            list.push({ p: 3, id: 'sensor.robbie_dock_dock_error', msg: 'Roborock water tank empty', icon: 'mdi:water-alert' });
        }
        return list.sort((a, b) => a.p - b.p);
      ]]]
  custom_fields:
    body: |
      [[[
        const list = variables.alerts;
        if (!list.length) return `<div style="font-size:15px;font-weight:600;color:#fff;text-align:left">No active alerts</div>`;
        const top = list[0];
        const since = new Date(states[top.id].last_changed).getTime();
        const mins = Math.max(0, Math.round((Date.now() - since) / 60000));
        const dur = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${mins % 60} min`;
        const more = list.slice(1).map(a => a.msg.replace(/ open$/, '')).join(' · ');
        const sub = (more ? `${dur} · Also: ${more}` : `For ${dur}`);
        return `<div style="display:flex;align-items:center;gap:18px;text-align:left;color:#fff">
          <div style="width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none">
            <ha-icon icon="${top.icon}" style="--mdc-icon-size:30px;display:block;width:30px;height:30px"></ha-icon></div>
          <div style="min-width:0">
            <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap">${top.msg}</div>
            <div style="font-size:13px;opacity:.9;margin-top:2px;white-space:nowrap">${sub}</div></div></div>`;
      ]]]
    close:
      card:
        type: custom:button-card
        entity: cover.garage_door_v2
        name: Close door
        show_icon: false
        show_state: false
        triggers_update: all
        styles:
          card:
            - display: "[[[ return states['binary_sensor.garage_door_sensor_contact']?.state === 'on' && entity.state === 'open' ? 'flex' : 'none'; ]]]"
            - margin-left: 10px
            - background: '#fff'
            - color: '#be123c'
            - border-radius: 18px
            - padding: 12px 20px
            - font-weight: 700
            - font-size: 14px
            - box-shadow: none
            - border: 0
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Close the garage door?
              content: The door will start closing straight away. Make sure nothing is in the way.
              left_button: Cancel
              right_button: Close door
              right_button_action:
                service: cover.close_cover
                target:
                  entity_id: cover.garage_door_v2
    keepgarage:
      card:
        type: custom:button-card
        entity: input_boolean.keep_garage_door_open
        name: Keep garage open
        show_icon: false
        show_state: false
        triggers_update: all
        tap_action:
          action: toggle
        styles:
          card:
            - display: "[[[ return states['binary_sensor.garage_door_sensor_contact']?.state === 'on' ? 'flex' : 'none'; ]]]"
            - margin-left: 10px
            - background: "[[[ return entity.state === 'on' ? '#fff' : 'rgba(255,255,255,.22)'; ]]]"
            - color: "[[[ return entity.state === 'on' ? '#334155' : '#fff'; ]]]"
            - border-radius: 18px
            - padding: 12px 20px
            - font-weight: 700
            - font-size: 14px
            - box-shadow: none
            - border: 1px solid rgba(255,255,255,.55)
    keepside:
      card:
        type: custom:button-card
        entity: input_boolean.keep_side_door_open
        name: Keep side open
        show_icon: false
        show_state: false
        triggers_update: all
        tap_action:
          action: toggle
        styles:
          card:
            - display: "[[[ return states['binary_sensor.side_door_contact']?.state === 'on' ? 'flex' : 'none'; ]]]"
            - margin-left: 10px
            - background: "[[[ return entity.state === 'on' ? '#fff' : 'rgba(255,255,255,.22)'; ]]]"
            - color: "[[[ return entity.state === 'on' ? '#334155' : '#fff'; ]]]"
            - border-radius: 18px
            - padding: 12px 20px
            - font-weight: 700
            - font-size: 14px
            - box-shadow: none
            - border: 1px solid rgba(255,255,255,.55)
    snooze:
      card:
        type: custom:button-card
        entity: input_boolean.alert_banner_snooze
        name: Snooze 30 min
        show_icon: false
        show_state: false
        triggers_update: all
        tap_action:
          action: toggle
        styles:
          card:
            - display: |
                [[[
                  const on = id => states[id]?.state === 'on';
                  const robbie = states['sensor.robbie_dock_dock_error']?.state;
                  const any = on('binary_sensor.front_door_contact') || on('binary_sensor.crimsafe_door_contact')
                    || on('binary_sensor.patio_door_contact') || on('binary_sensor.laundrydoorsensor_contact')
                    || (robbie && !['ok', 'unavailable', 'unknown'].includes(robbie));
                  return any && !on('input_boolean.alert_banner_snooze') ? 'flex' : 'none';
                ]]]
            - margin-left: 10px
            - background: rgba(255,255,255,.22)
            - color: '#fff'
            - border-radius: 18px
            - padding: 12px 20px
            - font-weight: 700
            - font-size: 14px
            - box-shadow: none
            - border: 1px solid rgba(255,255,255,.55)
  styles:
    card:
      - height: 84px
      - border-radius: 28px
      - padding: 0 30px
      - background: |
          [[[
            const p = variables.alerts[0]?.p || 3;
            return p === 1 ? 'linear-gradient(135deg, rgba(244,63,94,.92), rgba(190,18,60,.88))'
              : p === 2 ? 'linear-gradient(135deg, rgba(245,158,11,.92), rgba(217,119,6,.88))'
              : 'linear-gradient(135deg, rgba(71,85,105,.92), rgba(51,65,85,.9))';
          ]]]
      - border: 1px solid rgba(255,255,255,.45)
      - animation: "[[[ return (variables.alerts[0]?.p || 3) === 1 ? 'alert-pulse 2.4s ease-in-out infinite' : 'none'; ]]]"
    grid:
      - grid-template-areas: '"body close keepgarage keepside snooze"'
      - grid-template-columns: 1fr auto auto auto auto
      - column-gap: 0
      - align-items: center
    custom_fields:
      body:
        - justify-self: start
      close:
        - justify-self: end
      keepgarage:
        - justify-self: end
      keepside:
        - justify-self: end
      snooze:
        - justify-self: end
