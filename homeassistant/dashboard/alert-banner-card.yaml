type: conditional
grid_options:
  columns: full
conditions:
  - condition: state
    entity: sun.sun
    state: below_horizon
  - condition: or
    conditions:
      - condition: state
        entity: cover.garage_door_v2
        state: open
      - condition: state
        entity: binary_sensor.front_door_contact
        state: 'on'
      - condition: state
        entity: binary_sensor.hallwaydoorsensor_contact
        state: 'on'
      - condition: state
        entity: binary_sensor.patio_door_contact
        state: 'on'
      - condition: state
        entity: binary_sensor.side_door_contact
        state: 'on'
      - condition: state
        entity: binary_sensor.laundrydoorsensor_contact
        state: 'on'
card:
  type: custom:button-card
  show_icon: false
  show_name: false
  show_state: false
  triggers_update: all
  tap_action:
    action: navigate
    navigation_path: /dashboard-hub/security
  extra_styles: |
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 24px rgba(244,63,94,.45), inset 0 1px 0 rgba(255,255,255,.5); }
      50% { box-shadow: 0 0 56px rgba(244,63,94,.85), inset 0 1px 0 rgba(255,255,255,.5); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  custom_fields:
    body: |
      [[[
        const items = [
          ['cover.garage_door_v2', 'Garage door', 'open'],
          ['binary_sensor.front_door_contact', 'Front door', 'on'],
          ['binary_sensor.hallwaydoorsensor_contact', 'Hallway door', 'on'],
          ['binary_sensor.patio_door_contact', 'Patio door', 'on'],
          ['binary_sensor.side_door_contact', 'Side door', 'on'],
          ['binary_sensor.laundrydoorsensor_contact', 'Laundry door', 'on']
        ].filter(([id, , on]) => states[id]?.state === on);
        if (!items.length) return `<div style="font-size:15px;font-weight:600;color:#fff;text-align:left">All doors closed</div>`;
        const since = Math.min(...items.map(([id]) => new Date(states[id].last_changed).getTime()));
        const mins = Math.max(0, Math.round((Date.now() - since) / 60000));
        const dur = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${mins % 60} min`;
        const title = items.length === 1 ? `${items[0][1]} open` : `${items.length} doors open`;
        const sub = items.length === 1 ? `Open for ${dur} · after dark` : `${items.map(i => i[1]).join(', ')} · open for ${dur}`;
        return `<div style="display:flex;align-items:center;gap:18px;text-align:left;color:#fff">
          <div style="width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none">
            <ha-icon icon="mdi:shield-alert" style="--mdc-icon-size:30px;display:block;width:30px;height:30px"></ha-icon></div>
          <div style="min-width:0">
            <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap">${title}</div>
            <div style="font-size:13px;opacity:.9;margin-top:2px;white-space:nowrap">${sub}</div></div></div>`;
      ]]]
    close:
      card:
        type: custom:button-card
        entity: cover.garage_door_v2
        name: Close door
        show_icon: false
        show_state: false
        triggers_update:
          - cover.garage_door_v2
        styles:
          card:
            - display: "[[[ return entity.state === 'open' ? 'flex' : 'none'; ]]]"
            - background: '#fff'
            - color: '#be123c'
            - border-radius: 18px
            - padding: 14px 26px
            - font-weight: 700
            - font-size: 15px
            - box-shadow: none
            - border: 0
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Close the garage door?
              content: The door will start closing straight away. Make sure nothing is in the way.
              left_button: Cancel
              right_button: Close door
              right_button_action:
                service: cover.close_cover
                target:
                  entity_id: cover.garage_door_v2
  styles:
    card:
      - height: 84px
      - border-radius: 28px
      - padding: 0 30px
      - background: linear-gradient(135deg, rgba(244,63,94,.92), rgba(190,18,60,.88))
      - border: 1px solid rgba(255,170,190,.8)
      - animation: alert-pulse 2.4s ease-in-out infinite
    grid:
      - grid-template-areas: '"body close"'
      - grid-template-columns: 1fr auto
      - align-items: center
    custom_fields:
      body:
        - justify-self: start
      close:
        - justify-self: end
