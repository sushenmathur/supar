type: custom:button-card
entity: device_tracker.bluey_location
name: Bluey
template: glass_chip
show_icon: false
triggers_update:
- device_tracker.bluey_location
- sensor.bluey_battery_level
- sensor.bluey_charging
extra_styles: |
  @keyframes bluey-ring-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(16,185,129,0)); }
    50% { filter: drop-shadow(0 0 6px rgba(16,185,129,.9)); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
label: |
  [[[
    const place = entity.state === 'home' ? 'Home' : entity.state === 'not_home' ? 'Away' : entity.state;
    const pct = parseFloat(states['sensor.bluey_battery_level']?.state);
    const charging = states['sensor.bluey_charging']?.state === 'Charging';
    if (isNaN(pct)) return place;
    return `${place} · ${Math.round(pct)}%${charging ? ' · charging' : ''}`;
  ]]]
custom_fields:
  ring: |
    [[[
      const pct = parseFloat(states['sensor.bluey_battery_level']?.state);
      const has = !isNaN(pct);
      const p = has ? Math.max(0, Math.min(100, pct)) : 0;
      const col = !has ? 'var(--divider-color)' : p < 20 ? '#ef4444' : p < 50 ? '#f59e0b' : '#10b981';
      const charging = states['sensor.bluey_charging']?.state === 'Charging';
      return `<div style="position:relative;width:34px;height:34px;${charging ? 'animation:bluey-ring-pulse 1.6s ease-in-out infinite' : ''}">
        <div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(${col} ${p * 3.6}deg, rgba(var(--rgb-primary-text-color),0.15) 0);-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px))"></div>
        <ha-icon icon="phu:tesla-icon" style="position:absolute;left:50%;top:50%;margin:-8px 0 0 -8px;width:16px;height:16px;--mdc-icon-size:16px;color:var(--primary-text-color);display:block"></ha-icon>
      </div>`;
    ]]]
styles:
  grid:
  - grid-template-areas: '"ring n" "ring l"'
  - grid-template-columns: 36px minmax(0, 1fr)
  - column-gap: 10px
  custom_fields:
    ring:
    - justify-self: center
    - align-self: center
grid_options:
  columns: 6
  rows: 1
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Bluey
      icon: mdi:car-electric
      dismissable: true
      size: normal
      style:
        .: |
          :host {
            --mdc-dialog-scrim-color: rgba(15, 20, 50, 0.45);
            --popup-background-color: rgba(255, 255, 255, 0.35);
          }
        ha-dialog$: |
          .mdc-dialog__surface {
            background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(220,230,255,.35)) !important;
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255,255,255,.7);
          }
      content:
        type: vertical-stack
        cards:
        - type: custom:button-card
          entity: sensor.bluey_battery_level
          template: glass_vehicle
          variables:
            title: Bluey
            image: /api/image/serve/cdd510be49f2493bc87fd540c01cea69/512x512
            battery: sensor.bluey_battery_level
            tracker: device_tracker.bluey_location
            onroad: input_boolean.tesla_onroad
            charging: '[[[ return states["sensor.bluey_charging"]?.state === "Charging"; ]]]'
          styles:
            card:
            - height: 330px
        - type: horizontal-stack
          cards:
          - type: custom:button-card
            entity: sensor.bluey_battery_range
            name: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                return tick('Range', 13);
              ]]]
            icon: mdi:gauge
            template: glass_chip
            label: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                const v = parseFloat(entity.state);
                const u = entity.attributes.unit_of_measurement;
                const text = isNaN(v) ? entity.state.charAt(0).toUpperCase() + entity.state.slice(1) : Math.round(v) + (u ? ' ' + u : '');
                return tick(text, 15);
              ]]]
            styles:
              card:
              - height: 54px
          - type: custom:button-card
            entity: sensor.bluey_charge_energy_added
            name: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                return tick('Last Charge', 13);
              ]]]
            icon: mdi:lightning-bolt
            template: glass_chip
            label: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                const u = entity.attributes.unit_of_measurement;
                const text = entity.state + (u ? ' ' + u : '');
                return tick(text, 15);
              ]]]
            styles:
              card:
              - height: 54px
        - type: horizontal-stack
          cards:
          - type: custom:button-card
            entity: lock.bluey_lock
            name: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                return tick('Lock', 7);
              ]]]
            icon: mdi:lock
            template: glass_chip
            label: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                const text = entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' ');
                return tick(text, 9);
              ]]]
            tap_action:
              action: toggle
              confirmation:
                text: Lock or unlock Bluey?
            styles:
              card:
              - height: 54px
          - type: custom:button-card
            entity: cover.bluey_trunk
            name: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                return tick('Boot', 7);
              ]]]
            icon: phu:tesla-trunk
            template: glass_chip
            label: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                const text = entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' ');
                return tick(text, 9);
              ]]]
            tap_action:
              action: toggle
              confirmation:
                text: Open or close the boot?
            styles:
              card:
              - height: 54px
          - type: custom:button-card
            entity: switch.bluey_charge
            name: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                return tick('Charger', 7);
              ]]]
            icon: mdi:ev-station
            template: glass_chip
            label: |
              [[[
                const tick = (t, n) => t.length <= n ? t : `<span class="mq"><span class="run"><span>${t}</span><span>${t}</span></span></span>`;
                const text = entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' ');
                return tick(text, 9);
              ]]]
            tap_action:
              action: toggle
            styles:
              card:
              - height: 54px
