navbar-templates:
  main:
    desktop:
      min_width: 600
      position: left
      show_labels: true
      show_popup_label_backgrounds: false
    layout:
      auto_padding:
        desktop_px: 120
        enabled: true
        mobile_px: 100
      reflect_child_state: true
    mobile:
      mode: docked
      show_labels: true
    routes:
    - icon: mdi:home
      label: Home
      url: /dashboard-hub/hubhome
    - icon: mdi:floor-plan
      label: Rooms
      popup:
      - icon: mdi:sofa
        label: Living
        url: /dashboard-hub/living-room
      - icon: mdi:teddy-bear
        label: Kids
        url: /dashboard-hub/kidsroom
      - icon: mdi:garage-variant
        label: Garage
        url: /dashboard-hub/garage
      - icon: mdi:gate
        label: Outdoor
        url: /dashboard-hub/outdoor
      - icon: mdi:washing-machine
        label: Laundry
        url: /dashboard-hub/laundry
      tap_action:
        action: open-popup
    - badge:
        count: "[[[ return Object.values(states).filter(e =>\n      e.entity_id.startsWith('light.') &&\n      !e.entity_id.startsWith('light.browser') && e.state === 'on').length; ]]]\n"
        show: "[[[ return Object.values(states).some(e =>\n      e.entity_id.startsWith('light.') &&\n      !e.entity_id.startsWith('light.browser') && e.state === 'on'); ]]]\n"
      icon: mdi:lightbulb-outline
      icon_selected: mdi:lightbulb-on
      label: Lights
      url: /dashboard-hub/lights
    - icon: mdi:thermometer
      label: Climate
      url: /dashboard-hub/homeclimate
    - badge:
        count: "[[[ return ['binary_sensor.garage_door_sensor_contact',\n            'binary_sensor.front_door_contact',\n            'binary_sensor.hallwaydoorsensor_contact',\n            'binary_sensor.patio_door_contact',\n\
          \            'binary_sensor.side_door_contact',\n            'binary_sensor.laundrydoorsensor_contact']\n      .filter(id => states[id]?.state === 'on').length; ]]]\n"
        show: "[[[ return ['binary_sensor.garage_door_sensor_contact',\n            'binary_sensor.front_door_contact',\n            'binary_sensor.hallwaydoorsensor_contact',\n            'binary_sensor.patio_door_contact',\n\
          \            'binary_sensor.side_door_contact',\n            'binary_sensor.laundrydoorsensor_contact']\n      .some(id => states[id]?.state === 'on'); ]]]\n"
      icon: mdi:security
      label: Security
      url: /dashboard-hub/security
    - icon: mdi:music
      label: Music
      url: /dashboard-hub/music
    - icon: mdi:dots-horizontal
      label: More
      popup:
      - icon: mdi:devices
        label: iCloud3
        url: /ic3db-icloud3
      - icon: mdi:cog
        label: Settings
        url: /config
      - icon: mdi:hammer
        label: Dev tools
        url: /developer-tools/yaml
      - icon: mdi:restart
        label: Restart
        tap_action:
          action: perform-action
          confirmation:
            text: Are you sure you want to restart Home Assistant?
          perform_action: homeassistant.restart
      tap_action:
        action: open-popup
    styles: "/* Glass rail. Sizes are left to navbar-card so icon + label always fit on every view. */\n.navbar-card.desktop {\n  background: var(--glass-bg) !important;\n  backdrop-filter: blur(34px) saturate(190%);\n\
      \  -webkit-backdrop-filter: blur(34px) saturate(190%);\n  border: 1px solid var(--glass-border) !important;\n  border-radius: 32px !important;\n  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi)\
      \ !important;\n  overflow: visible !important;\n}\n.navbar.desktop.left { padding: 12px 8px !important; justify-content: center; }\n.button { border-radius: 20px !important; }\n.button.active {\n\
      \  background: var(--glass-bg-soft) !important;\n  box-shadow: inset 0 1px 0 var(--glass-hi), 0 6px 16px rgba(0,0,0,0.12) !important;\n  border-radius: 20px !important;\n}\n.icon.active, .label.active\
      \ { color: var(--primary-text-color) !important; }\n.icon, .label { color: var(--secondary-text-color); }\n.navbar-popup {\n  background: var(--popup-background-color) !important;\n  backdrop-filter:\
      \ blur(34px) saturate(190%);\n  -webkit-backdrop-filter: blur(34px) saturate(190%);\n  border: 1px solid var(--glass-border);\n  border-radius: 28px !important;\n  padding: 10px !important;\n  gap:\
      \ 8px !important;\n  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi) !important;\n}\n/* Each sub route is its own glass tile: icon over label, equal width, comfortable touch target\
      \ */\n.popup-item {\n  min-width: 84px !important;\n  padding: 12px 10px 10px !important;\n  border-radius: 20px !important;\n  background: var(--glass-bg-soft) !important;\n  border: 1px solid var(--glass-border)\
      \ !important;\n  box-shadow: inset 0 1px 0 var(--glass-hi) !important;\n  display: flex !important;\n  flex-direction: column !important;\n  align-items: center !important;\n  gap: 6px !important;\n\
      \  color: var(--primary-text-color) !important;\n}\n.popup-item:active { transform: scale(0.96); }\n.popup-item ha-icon, .popup-item .icon { --mdc-icon-size: 30px; color: var(--primary-text-color)\
      \ !important; }\n.popup-item .label, .popup-label, .popup-label-text {\n  background: transparent !important;\n  box-shadow: none !important;\n  padding: 0 !important;\n  font-size: 13px !important;\n\
      \  font-weight: 600 !important;\n  color: var(--primary-text-color) !important;\n  position: static !important;\n  transform: none !important;\n}\n"
