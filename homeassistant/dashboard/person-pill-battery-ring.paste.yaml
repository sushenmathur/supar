# 1) Under button_card_templates:, replace the whole glass_person_pill block with this:
  glass_person_pill:
    section_mode: true
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[
          const place = {
            home: 'Home', not_home: 'Away', 'Sushen - Work': 'Office',
            'Paro - Work': 'Work', Gym: 'Gym'
          }[entity.state] || entity.state;
          const batt = parseFloat(states[variables.battery]?.state);
          const first = String(entity.attributes.friendly_name || '').split(' ')[0];
          const pic = entity.attributes.entity_picture
            ? `<img src="${entity.attributes.entity_picture}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--glass-hi);flex:none">`
            : `<div style="width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--primary-color);color:#fff;flex:none">${first[0] || '?'}</div>`;
          const has = !isNaN(batt);
          const p = has ? Math.max(0, Math.min(100, batt)) : 0;
          const col = !has ? 'var(--divider-color)' : p < 20 ? 'var(--glass-level-low, #ef4444)' : p < 50 ? 'var(--glass-level-warn, #f59e0b)' : 'var(--glass-level-ok, #10b981)';
          const charging = String(states[variables.charge_state]?.state || '').toLowerCase() === 'charging';
          const ring = `<div style="position:relative;width:32px;height:32px;flex:none;--pc:${col};${charging ? 'animation:phone-ring-pulse 1.6s ease-in-out infinite' : ''}">
            <div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(${col} ${p * 3.6}deg, rgba(var(--rgb-primary-text-color),0.15) 0);-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px))"></div>
            <ha-icon icon="${charging ? 'mdi:cellphone-charging' : 'mdi:cellphone'}" style="position:absolute;left:50%;top:50%;margin:-9px 0 0 -9px;width:18px;height:18px;--mdc-icon-size:18px;color:var(--primary-text-color);display:block"></ha-icon></div>`;
          return `<div style="display:flex;align-items:center;gap:8px;width:100%;text-align:left">${pic}
            <b style="font-size:13px;white-space:nowrap">${first}</b>
            <span style="font-size:12px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${place}</span>
            <b style="margin-left:auto;font-size:12px;color:${charging ? 'var(--glass-ok)' : 'var(--primary-text-color)'}">${has ? Math.round(batt) + '%' : ''}</b>${ring}</div>`;
        ]]]
    styles:
      card:
        - height: 48px
        - border-radius: 22px
        - padding: 0 10px
        - background: var(--glass-bg)
        - border: 1px solid var(--glass-border)
        - box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - width: 100%
    extra_styles: |
      @keyframes phone-ring-pulse {
        0%, 100% { filter: drop-shadow(0 0 0 transparent); }
        50% { filter: drop-shadow(0 0 6px var(--pc)); }
      }
    variables:
      battery: ''
      charge_state: ''

