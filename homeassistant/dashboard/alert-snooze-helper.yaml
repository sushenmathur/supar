# 1) Helper: add to configuration.yaml (or create it in Settings > Devices & services > Helpers > Toggle,
#    name "Alert banner snooze" so the entity ID is input_boolean.alert_banner_snooze)
input_boolean:
  alert_banner_snooze:
    name: Alert banner snooze
    icon: mdi:bell-sleep

