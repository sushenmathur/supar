<div class="kp">
<style>
.kp{text-align:center;user-select:none;-webkit-user-select:none;padding:4px 0 8px}
.kp .ph{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.kp .ph button{height:38px;padding:0 22px;border-radius:19px;border:1px solid var(--glass-border,rgba(255,255,255,.7));background:var(--glass-bg-soft,rgba(255,255,255,.34));color:var(--primary-text-color);font:600 14px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-hi,rgba(255,255,255,.9))}
.kp .ph button.on{background:linear-gradient(135deg,#7dd3fc,#818cf8);color:#0b1020;border-color:transparent}
.kp .dots{font-size:24px;letter-spacing:6px;height:40px;line-height:40px;font-weight:700;color:var(--primary-text-color)}
.kp .msg{height:22px;font-size:13px;font-weight:600;color:var(--secondary-text-color)}
.kp .msg.good{color:#15803d}.kp .msg.bad{color:#be123c}
.kp .grid{display:grid;grid-template-columns:repeat(3,66px);gap:12px;justify-content:center;margin-top:6px}
.kp .grid button{height:66px;border-radius:50%;border:1px solid var(--glass-border,rgba(255,255,255,.7));background:var(--glass-bg-soft,rgba(255,255,255,.34));color:var(--primary-text-color);font-family:inherit;font-size:26px;font-weight:500;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-hi,rgba(255,255,255,.9));transition:transform .12s}
.kp .grid button:active{transform:scale(.92)}
.kp .grid .x{color:#be123c;font-size:22px}
.kp .grid .ok{background:rgba(34,197,94,.32);color:#15803d;font-size:26px}
.kp.bad .dots{animation:kp-shake .4s}
@keyframes kp-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
<div class="ph"><button data-phone="Sushen" class="on">Sushen</button><button data-phone="Paro">Paro</button></div>
<div class="dots">&ndash; &ndash; &ndash; &ndash;</div>
<div class="msg">Enter passcode</div>
<div class="grid"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="x" data-k="x">&#10005;</button><button data-k="0">0</button><button class="ok" data-k="ok">&#10003;</button></div>
<img src="data:," alt="" style="display:none" onerror="const r=this.parentNode;let code='',phone='Sushen',busy=false;const d=r.querySelector('.dots'),m=r.querySelector('.msg');const draw=()=>{d.textContent=code.length?'\u25CF '.repeat(code.length).trim():'\u2013 \u2013 \u2013 \u2013'};const say=(t,c)=>{m.textContent=t;m.className='msg '+(c||'')};const bid=()=>(window.browser_mod&&window.browser_mod.browserID)||'THIS';const ha=()=>document.querySelector('home-assistant').hass;r.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.phone){phone=b.dataset.phone;r.querySelectorAll('.ph button').forEach(x=>x.classList.toggle('on',x===b));return}const k=b.dataset.k;if(!k)return;r.classList.remove('bad');if(/^[0-9]$/.test(k)){if(code.length<12){code+=k;draw();say('Enter passcode')}return}if(k==='x'){code='';draw();say('Enter passcode');return}if(k==='ok'){if(!code.length){say('Enter passcode');return}busy=true;say('Checking\u2026');try{await ha().callService('script','lost_phone',{browser_id:bid(),passcode:code,phone:phone});say('Alert sent to '+phone,'good');setTimeout(()=>{try{ha().callService('browser_mod','close_popup',{browser_id:bid()})}catch(_){}},1500)}catch(err){say('Access denied','bad');r.classList.add('bad');code='';draw()}busy=false}});this.onerror=null">
</div>
