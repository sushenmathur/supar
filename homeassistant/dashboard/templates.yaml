# Paste these two top-level blocks into the dashboard's raw configuration editor,
# replacing your existing `button_card_templates:` and `navbar-templates:` blocks.
# (Raw config editor: dashboard > pencil > three dots > Raw configuration editor.)
# Everything is driven by the Glass theme variables, so it follows light/dark automatically.

button_card_templates:

  # ---- Quick actions (Good Night / Announce / Lost Phone / WiFi) ----
  glass_action:
    section_mode: true
    show_icon: true
    show_name: true
    show_state: false
    styles:
      card:
        - height: 84px
        - border-radius: 24px
        - background: var(--glass-bg-soft)
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
        - padding: 10px 4px
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
      icon:
        - width: 24px
        - color: var(--primary-text-color)
      name:
        - font-size: 11px
        - font-weight: 600
        - color: var(--primary-text-color)

  # ---- Room tiles. Tint is an "r,g,b" string; lit when any listed light is on ----
  room_tile:
    section_mode: true
    show_label: true
    show_state: false
    label: |
      [[[
        const on = (variables.lights || []).filter(e => states[e]?.state === 'on').length;
        return on ? `${on} on` : 'All off';
      ]]]
    variables:
      tint: '150,150,200'
      lights: []
      force_on: false
    styles:
      card:
        - height: 96px
        - border-radius: 26px
        - padding: 0 18px
        - background: |
            [[[
              const lit = variables.force_on || (variables.lights || []).some(e => states[e]?.state === 'on');
              return lit
                ? 'linear-gradient(135deg, rgba(255,196,90,0.62), rgba(255,140,40,0.34))'
                : `linear-gradient(135deg, rgba(${variables.tint},0.42), rgba(${variables.tint},0.14))`;
            ]]]
        - box-shadow: |
            [[[
              const lit = variables.force_on || (variables.lights || []).some(e => states[e]?.state === 'on');
              return (lit ? 'var(--glass-on-glow), ' : '') + 'inset 0 1px 0 var(--glass-hi)';
            ]]]
        - border: 1px solid var(--glass-border)
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 52px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 14px
      img_cell:
        - width: 52px
        - height: 52px
        - border-radius: 18px
        - background: var(--glass-field)
        - align-self: center
      icon:
        - width: 26px
        - color: var(--primary-text-color)
      name:
        - justify-self: start
        - align-self: end
        - font-weight: 700
        - font-size: 16px
        - color: var(--primary-text-color)
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)

  # ---- Light / switch tile: icon on top, name below, glows when on ----
  glass_toggle:
    section_mode: true
    show_state: false
    show_label: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - height: 100%
        - border-radius: 22px
        - padding: 12px 14px
        - background: |
            [[[ return entity.state === 'on' ? 'var(--glass-on-bg)' : 'var(--glass-bg-soft)'; ]]]
        - box-shadow: |
            [[[ return (entity.state === 'on' ? 'var(--glass-on-glow), ' : '') + 'inset 0 1px 0 var(--glass-hi)'; ]]]
        - border: 1px solid var(--glass-border)
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
        - grid-template-columns: 1fr
      icon:
        - width: 28px
        - justify-self: start
        - align-self: start
        - color: |
            [[[ return entity.state === 'on' ? 'var(--primary-text-color)' : 'var(--secondary-text-color)'; ]]]
      name:
        - justify-self: start
        - text-align: left
        - font-size: 14px
        - font-weight: 600
        - line-height: 1.2
        - white-space: normal
        - color: var(--primary-text-color)

  # ---- Status chip: vehicles and room occupancy ----
  glass_chip:
    section_mode: true
    show_state: false
    show_label: true
    styles:
      card:
        - height: 100%
        - border-radius: 22px
        - padding: 0 14px
        - background: |
            [[[ return variables.hot ? 'linear-gradient(145deg, rgba(255,120,150,0.4), rgba(255,80,120,0.15))' : 'var(--glass-bg-soft)'; ]]]
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 30px 1fr
        - column-gap: 11px
      icon:
        - width: 22px
        - color: |
            [[[ return variables.hot ? 'var(--glass-bad)' : 'var(--primary-text-color)'; ]]]
      name:
        - justify-self: start
        - align-self: end
        - font-size: 14px
        - font-weight: 700
        - color: var(--primary-text-color)
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
    variables:
      hot: false

  # ---- Person: avatar, place, battery, network ----
  glass_person:
    section_mode: true
    show_icon: false
    show_name: false
    show_state: false
    triggers_update: all
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[
          const place = {
            home: 'Home', not_home: 'Away', 'Sushen - Work': 'Office',
            'Paro - Work': 'Work', Gym: 'Gym'
          }[entity.state] || entity.state;
          const batt = parseFloat(states[variables.battery]?.state);
          const net = variables.network ? states[variables.network]?.state : null;
          const ago = (() => {
            const m = Math.max(0, Math.round((Date.now() - new Date(entity.last_changed)) / 60000));
            return m < 60 ? `${m} min ago` : `${Math.round(m / 60)} hrs ago`;
          })();
          const pic = entity.attributes.entity_picture
            ? `<img src="${entity.attributes.entity_picture}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--glass-hi)">`
            : `<div style="width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--primary-color);color:#fff">${entity.attributes.friendly_name[0]}</div>`;
          return `<div style="display:flex;gap:12px;align-items:center">${pic}
            <div style="text-align:left;line-height:1.35">
              <div style="font-size:16px;font-weight:700">${entity.attributes.friendly_name}</div>
              <div style="font-size:12px;color:var(--secondary-text-color)">${place} · ${ago}</div>
              <div style="font-size:12px;font-weight:600;color:${batt > 20 ? 'var(--glass-ok)' : 'var(--glass-bad)'}">
                ${isNaN(batt) ? '' : Math.round(batt) + '%'}${net ? ' · ' + net : ''}</div>
            </div></div>`;
        ]]]
    styles:
      card:
        - height: 96px
        - border-radius: 24px
        - padding: 10px 14px
        - background: var(--glass-bg)
        - border: 1px solid var(--glass-border)
        - box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - justify-self: start
    variables:
      battery: ''
      network: ''

  # ---- World clock (day/night aware) ----
  world_clock:
    icon: |-
      [[[ return states[variables.daytime]?.state === 'on'
            ? 'mdi:weather-sunny' : 'mdi:weather-night'; ]]]
    layout: icon_name_state2nd
    section_mode: true
    show_state: true
    state_display: |-
      [[[ return new Date().toLocaleTimeString('en-AU', {
            timeZone: variables.tz, hour: 'numeric', minute: '2-digit' }); ]]]
    styles:
      card:
        - height: 100%
        - padding: 6px 14px
        - border-radius: 22px
        - background: |-
            [[[ return states[variables.daytime]?.state === 'on'
                ? 'linear-gradient(135deg, rgba(143,211,255,0.55), rgba(255,233,168,0.45))'
                : 'linear-gradient(135deg, rgba(15,27,61,0.55), rgba(42,58,107,0.4))'; ]]]
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
      icon:
        - width: 24px
        - color: |-
            [[[ return states[variables.daytime]?.state === 'on' ? '#f59e0b' : '#c7d2fe'; ]]]
      name:
        - font-size: 12px
        - font-weight: 600
        - color: var(--secondary-text-color)
      state:
        - font-size: 19px
        - font-weight: 700
        - color: var(--primary-text-color)
    triggers_update: all
    variables:
      daytime: ''
      tz: UTC

navbar-templates:
  main:
    desktop:
      min_width: 600
      position: left
      show_labels: true
      show_popup_label_backgrounds: true
    layout:
      auto_padding:
        desktop_px: 120
        enabled: true
        mobile_px: 100
      reflect_child_state: true
    mobile:
      mode: docked
      show_labels: true
    routes:
      - icon: mdi:home
        label: Home
        url: /dashboard-hub/hubhome
      - icon: mdi:floor-plan
        label: Rooms
        popup:
          - icon: mdi:sofa
            label: Living
            url: /dashboard-hub/living-room
          - icon: mdi:teddy-bear
            label: Kids
            url: /dashboard-hub/kidsroom
          - icon: mdi:garage-variant
            label: Garage
            url: /dashboard-hub/garage
          - icon: mdi:gate
            label: Outdoor
            url: /dashboard-hub/outdoor
          - icon: mdi:washing-machine
            label: Laundry
            url: /dashboard-hub/laundry
        tap_action:
          action: open-popup
      - badge:
          count: |
            [[[ return Object.values(states).filter(e =>
                  e.entity_id.startsWith('light.') &&
                  !e.entity_id.startsWith('light.browser') && e.state === 'on').length; ]]]
          show: |
            [[[ return Object.values(states).some(e =>
                  e.entity_id.startsWith('light.') &&
                  !e.entity_id.startsWith('light.browser') && e.state === 'on'); ]]]
        icon: mdi:lightbulb-outline
        icon_selected: mdi:lightbulb-on
        label: Lights
        url: /dashboard-hub/lights
      - icon: mdi:thermometer
        label: Climate
        url: /dashboard-hub/homeclimate
      - badge:
          count: |
            [[[ return ['binary_sensor.garage_door_sensor_contact',
                        'binary_sensor.front_door_contact',
                        'binary_sensor.hallwaydoorsensor_contact',
                        'binary_sensor.patio_door_contact',
                        'binary_sensor.side_door_contact',
                        'binary_sensor.laundrydoorsensor_contact']
                  .filter(id => states[id]?.state === 'on').length; ]]]
          show: |
            [[[ return ['binary_sensor.garage_door_sensor_contact',
                        'binary_sensor.front_door_contact',
                        'binary_sensor.hallwaydoorsensor_contact',
                        'binary_sensor.patio_door_contact',
                        'binary_sensor.side_door_contact',
                        'binary_sensor.laundrydoorsensor_contact']
                  .some(id => states[id]?.state === 'on'); ]]]
        icon: mdi:security
        label: Security
        url: /dashboard-hub/security
      - icon: mdi:multimedia
        label: Media
        url: /dashboard-hub/media_new
      - icon: mdi:dots-horizontal
        label: More
        popup:
          - icon: mdi:devices
            label: iCloud3
            url: /ic3db-icloud3
          - icon: mdi:cog
            label: Settings
            url: /config
          - icon: mdi:hammer
            label: Dev tools
            url: /developer-tools/yaml
          - icon: mdi:restart
            label: Restart
            tap_action:
              action: perform-action
              confirmation:
                text: Are you sure you want to restart Home Assistant?
              perform_action: homeassistant.restart
        tap_action:
          action: open-popup
    styles: |
      .navbar-card.desktop {
        background: var(--glass-bg) !important;
        backdrop-filter: blur(34px) saturate(190%);
        -webkit-backdrop-filter: blur(34px) saturate(190%);
        border: 1px solid var(--glass-border);
        border-radius: 32px !important;
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi) !important;
      }
      .navbar.desktop.left { padding: 14px 10px !important; justify-content: center; }
      .button { border-radius: 22px !important; }
      .button.active {
        background: var(--glass-bg-soft) !important;
        box-shadow: inset 0 1px 0 var(--glass-hi), 0 8px 20px rgba(0,0,0,0.15);
        border-radius: 22px !important;
        width: 72px !important;
        height: 66px !important;
        min-width: 72px !important;
        min-height: 66px !important;
        margin: 0 auto !important;
      }
      .icon.active { color: var(--primary-text-color); }
      .navbar-popup {
        background: var(--popup-background-color) !important;
        backdrop-filter: blur(34px) saturate(190%);
        -webkit-backdrop-filter: blur(34px) saturate(190%);
        border: 1px solid var(--glass-border);
        border-radius: 28px !important;
      }
