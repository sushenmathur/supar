        const when = d <= 0 ? 'Today' : d === 1 ? 'Tomorrow' : start.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
        return a.all_day ? `${when} · all day` : `${when} · ${start.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true })}`;
        ]]]
