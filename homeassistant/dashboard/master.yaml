                  state: 'on'
                - condition: state
                  entity: binary_sensor.patio_door_contact
                  state: 'on'
                - condition: state
                  entity: binary_sensor.laundrydoorsensor_contact
                  state: 'on'
      grid_options:
        columns: full
        rows: 2
      triggers_update:
      - binary_sensor.crimsafe_door_contact
      - binary_sensor.front_door_contact
      - binary_sensor.garage_door_sensor_contact
      - binary_sensor.laundrydoorsensor_contact
      - binary_sensor.patio_door_contact
      - binary_sensor.side_door_contact
      - input_boolean.alert_banner_snooze
      - sensor.robbie_dock_dock_error
      - sensor.side_battery
      - sun.sun
      - input_boolean.keep_garage_door_open
      - input_boolean.keep_side_door_open
      - cover.garage_door_v2
      - sensor.time
      tap_action:
        action: navigate
        navigation_path: /home-2-0/security
      variables:
        alerts: |-
          [[[
          const s = id => states[id]?.state;
          const on = id => s(id) === 'on';
          const snoozed = on('input_boolean.alert_banner_snooze');
          const front = on('binary_sensor.front_door_contact');
          const screen = on('binary_sensor.crimsafe_door_contact');
          const robbie = s('sensor.robbie_dock_dock_error');
          const list = [];
          // Garage and side door are never snoozed; "keep open" calms them to low priority instead.
          if (on('binary_sensor.garage_door_sensor_contact')) {
            const kept = on('input_boolean.keep_garage_door_open');
            list.push({ p: kept ? 3 : 1, id: 'binary_sensor.garage_door_sensor_contact', msg: kept ? 'Garage door kept open' : 'Garage door open', icon: 'mdi:garage-open-variant' });
          }
          if (on('binary_sensor.side_door_contact')) {
            const kept = on('input_boolean.keep_side_door_open');
            list.push({ p: kept ? 3 : 1, id: 'binary_sensor.side_door_contact', msg: kept ? 'Side door kept open' : 'Side door open', icon: 'mdi:door-open' });
          }
          if (screen) list.push({ p: 1, id: 'binary_sensor.crimsafe_door_contact', msg: front ? 'Front and security doors open' : 'Security door open', icon: 'mdi:shield-home' });
          // Snoozable: front door medium; patio, laundry, Robbie and the camera battery low. Doors only alert after dark.
          if (!snoozed) {
            const night = s('sun.sun') === 'below_horizon';
            if (night && front && !screen) list.push({ p: 2, id: 'binary_sensor.front_door_contact', msg: 'Front door open', icon: 'mdi:home-alert' });
            if (night && on('binary_sensor.patio_door_contact')) list.push({ p: 3, id: 'binary_sensor.patio_door_contact', msg: 'Patio door open', icon: 'mdi:door-open' });
            if (night && on('binary_sensor.laundrydoorsensor_contact')) list.push({ p: 3, id: 'binary_sensor.laundrydoorsensor_contact', msg: 'Laundry door open', icon: 'mdi:door-open' });
            if (robbie && !['ok', 'unavailable', 'unknown'].includes(robbie)) list.push({ p: 3, id: 'sensor.robbie_dock_dock_error', msg: 'Robbie water tank empty', icon: 'mdi:water-alert' });
            const bat = parseFloat(s('sensor.side_battery'));
            if (!isNaN(bat) && bat < 20) list.push({ p: 3, id: 'sensor.side_battery', msg: 'Side camera battery low', icon: 'mdi:battery-20' });
          }
          return list.sort((a, b) => a.p - b.p);
          ]]]
      icon: |-
        [[[
        return variables.alerts[0]?.icon || 'mdi:bell-check';
        ]]]
      name: |-
        [[[
        return variables.alerts[0]?.msg || 'No active alerts';
        ]]]
      label: |-
        [[[
        const list = variables.alerts; const top = list[0];
        if (!top) return '';
        const mins = Math.max(0, Math.round((Date.now() - new Date(states[top.id].last_changed).getTime()) / 60000));
        const dur = mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${mins % 60} min`;
        const more = list.slice(1).map(a => a.msg.replace(/ open$/, '')).join(' · ');
        return more ? `${dur} · also: ${more}` : `For ${dur}`;
        ]]]
