                        --ha-dialog-width-md: min(var(--popup-width), 92vw);
                      dismissable: true
                      size: normal
                      content: The door will start closing straight away. Make sure nothing is in the way.
                      title: Close the garage door?
                      left_button: Cancel
                      right_button: Close door
                      right_button_action:
                        service: cover.close_cover
                        target:
                          entity_id: cover.garage_door_v2
            - type: conditional
              conditions:
              - condition: state
                entity: binary_sensor.garage_door_sensor_contact
                state: 'on'
              card:
                type: custom:button-card
                template: qg_chip
                entity: input_boolean.keep_garage_door_open
                name: Keep garage
                icon: mdi:garage-open-variant
                tap_action:
                  action: toggle
                state:
