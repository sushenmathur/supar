      custom_fields:
        flow: |-
          [[[
          const w = id => { const e = states[id]; const v = parseFloat(e?.state); if (isNaN(v)) return 0; return Math.abs((e.attributes.unit_of_measurement || '').toLowerCase() === 'kw' ? v * 1000 : v); };
          const fmt = v => v >= 1000 ? (v / 1000).toFixed(1) + ' kW' : Math.round(v) + ' W';
          const solar = w('sensor.sh50rs_a21c2106894_mppt_total_power'), imp = w('sensor.sh50rs_a21c2106894_purchased_power'), exp = w('sensor.sh50rs_a21c2106894_total_export_active_power');
          const ev = w('sensor.bluey_charger_power') + w('sensor.kia_charger_power');
          const load = Math.max(0, solar + imp - exp - ev) + ev;
          const self = load > 0 ? Math.round(Math.min(1, solar / load) * 100) : 0;
          const node = (icon, val, cap) => `<div style="display:flex;align-items:center;gap:var(--space-2);min-width:0">
            <ha-icon icon="${icon}" style="--mdc-icon-size:var(--icon-md);color:var(--text-2);flex:none"></ha-icon>
            <div style="min-width:0;line-height:var(--lh-tight)"><div style="font-size:var(--fs-body);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums">${val}</div>
            <div style="font-size:var(--fs-caption);color:var(--text-2);white-space:nowrap">${cap}</div></div></div>`;
          return `<div style="display:flex;flex-direction:column;justify-content:space-between;height:100%"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-top:var(--space-4)">
            ${node(solar > 0 ? 'mdi:solar-power-variant' : 'mdi:weather-night', fmt(solar), solar > 0 ? 'Solar' : 'Solar idle')}
            ${node('mdi:transmission-tower', fmt(exp || imp), exp > 0 ? 'Exporting' : imp > 0 ? 'From grid' : 'Grid idle')}
            ${node(ev > 0 ? 'mdi:ev-station' : 'mdi:car-electric', ev > 0 ? fmt(ev) : 'Idle', ev > 0 ? 'Car charging' : 'Car')}
          </div>
          <div style="display:flex;align-items:center;gap:var(--space-3);font-size:var(--fs-secondary);color:var(--text-2)">
            <span style="white-space:nowrap">Self-powered</span>
            <span style="flex:1;height:var(--bar);border-radius:var(--radius-pill);background:var(--surface-2);overflow:hidden"><i style="display:block;height:100%;width:${self}%;background:var(--state-ok);border-radius:var(--radius-pill)"></i></span>
            <b style="color:var(--text-1);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums">${self}%</b>
          </div></div>`;
          ]]]
      styles:
        grid:
        - grid-template-areas: '"l" "n" "flow"'
        - grid-template-rows: min-content min-content 1fr
        - align-content: stretch
        card:
        - padding: var(--space-4)
        custom_fields:
          flow:
          - width: 100%
          - height: 100%
          - min-height: 0
        name:
        - font-size: var(--fs-hero)
