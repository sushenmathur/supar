button_card_templates:
  glass_action:
    section_mode: true
    show_icon: true
    show_name: true
    show_state: false
    styles:
      card:
        - height: 84px
        - border-radius: 24px
        - background: var(--glass-bg-soft)
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
        - padding: 10px 4px
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
      icon:
        - width: 24px
        - color: var(--primary-text-color)
      name:
        - font-size: 11px
        - font-weight: 600
        - color: var(--primary-text-color)
  room_tile:
    section_mode: true
    show_label: true
    show_state: false
    label: |
      [[[
        const on = (variables.lights || []).filter(e => states[e]?.state === 'on').length;
        return on ? `${on} on` : 'All off';
      ]]]
    variables:
      tint: 150,150,200
      lights: []
      force_on: false
    styles:
      card:
        - height: 96px
        - border-radius: 26px
        - padding: 0 18px
        - background: |
            [[[
              const lit = variables.force_on || (variables.lights || []).some(e => states[e]?.state === 'on');
              return lit
                ? 'linear-gradient(135deg, rgba(255,196,90,0.62), rgba(255,140,40,0.34))'
                : `linear-gradient(135deg, rgba(${variables.tint},0.42), rgba(${variables.tint},0.14))`;
            ]]]
        - box-shadow: |
            [[[
              const lit = variables.force_on || (variables.lights || []).some(e => states[e]?.state === 'on');
              return (lit ? 'var(--glass-on-glow), ' : '') + 'inset 0 1px 0 var(--glass-hi)';
            ]]]
        - border: 1px solid var(--glass-border)
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 52px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 14px
      img_cell:
        - width: 52px
        - height: 52px
        - border-radius: 18px
        - background: var(--glass-field)
        - align-self: center
      icon:
        - width: 26px
        - color: var(--primary-text-color)
      name:
        - justify-self: start
        - align-self: end
        - font-weight: 700
        - font-size: 16px
        - color: var(--primary-text-color)
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
  glass_toggle:
    section_mode: true
    show_state: false
    show_label: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - height: 100%
        - border-radius: 22px
        - padding: 12px 14px
        - background: >
            [[[ return entity.state === 'on' ? 'var(--glass-on-bg)' :
            'var(--glass-bg-soft)'; ]]]
        - box-shadow: >
            [[[ return (entity.state === 'on' ? 'var(--glass-on-glow), ' : '') +
            'inset 0 1px 0 var(--glass-hi)'; ]]]
        - border: 1px solid var(--glass-border)
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
        - grid-template-columns: 1fr
      icon:
        - width: 28px
        - justify-self: start
        - align-self: start
        - color: >
            [[[ return entity.state === 'on' ? 'var(--primary-text-color)' :
            'var(--secondary-text-color)'; ]]]
      name:
        - justify-self: start
        - text-align: left
        - font-size: 14px
        - font-weight: 600
        - line-height: 1.2
        - white-space: normal
        - color: var(--primary-text-color)
  glass_chip:
    section_mode: true
    show_state: false
    show_label: true
    styles:
      card:
        - height: 100%
        - border-radius: 22px
        - padding: 0 14px
        - background: >
            [[[ return variables.hot ? 'linear-gradient(145deg,
            rgba(255,120,150,0.4), rgba(255,80,120,0.15))' :
            'var(--glass-bg-soft)'; ]]]
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 30px 1fr
        - column-gap: 11px
      icon:
        - width: 22px
        - color: >
            [[[ return variables.hot ? 'var(--glass-bad)' :
            'var(--primary-text-color)'; ]]]
      name:
        - justify-self: start
        - align-self: end
        - font-size: 14px
        - font-weight: 700
        - color: var(--primary-text-color)
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
    variables:
      hot: false
  glass_person:
    section_mode: true
    show_icon: false
    show_name: false
    show_state: false
    triggers_update: all
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[
          const place = {
            home: 'Home', not_home: 'Away', 'Sushen - Work': 'Office',
            'Paro - Work': 'Work', Gym: 'Gym'
          }[entity.state] || entity.state;
          const batt = parseFloat(states[variables.battery]?.state);
          const net = variables.network ? states[variables.network]?.state : null;
          const ago = (() => {
            const m = Math.max(0, Math.round((Date.now() - new Date(entity.last_changed)) / 60000));
            return m < 60 ? `${m} min ago` : `${Math.round(m / 60)} hrs ago`;
          })();
          const pic = entity.attributes.entity_picture
            ? `<img src="${entity.attributes.entity_picture}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--glass-hi)">`
            : `<div style="width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--primary-color);color:#fff">${entity.attributes.friendly_name[0]}</div>`;
          return `<div style="display:flex;gap:12px;align-items:center">${pic}
            <div style="text-align:left;line-height:1.35">
              <div style="font-size:16px;font-weight:700">${entity.attributes.friendly_name}</div>
              <div style="font-size:12px;color:var(--secondary-text-color)">${place} · ${ago}</div>
              <div style="font-size:12px;font-weight:600;color:${batt > 20 ? 'var(--glass-ok)' : 'var(--glass-bad)'}">
                ${isNaN(batt) ? '' : Math.round(batt) + '%'}${net ? ' · ' + net : ''}</div>
            </div></div>`;
        ]]]
    styles:
      card:
        - height: 96px
        - border-radius: 24px
        - padding: 10px 14px
        - background: var(--glass-bg)
        - border: 1px solid var(--glass-border)
        - box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - justify-self: start
    variables:
      battery: ''
      network: ''
  world_clock:
    icon: |-
      [[[ return states[variables.daytime]?.state === 'on'
            ? 'mdi:weather-sunny' : 'mdi:weather-night'; ]]]
    layout: icon_name_state2nd
    section_mode: true
    show_state: true
    state_display: |-
      [[[ return new Date().toLocaleTimeString('en-AU', {
            timeZone: variables.tz, hour: 'numeric', minute: '2-digit' }); ]]]
    styles:
      card:
        - height: 100%
        - padding: 6px 14px
        - border-radius: 22px
        - background: |-
            [[[ return states[variables.daytime]?.state === 'on'
                ? 'linear-gradient(135deg, rgba(143,211,255,0.55), rgba(255,233,168,0.45))'
                : 'linear-gradient(135deg, rgba(15,27,61,0.55), rgba(42,58,107,0.4))'; ]]]
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
      icon:
        - width: 24px
        - color: >-
            [[[ return states[variables.daytime]?.state === 'on' ? '#f59e0b' :
            '#c7d2fe'; ]]]
      name:
        - font-size: 12px
        - font-weight: 600
        - color: var(--secondary-text-color)
      state:
        - font-size: 19px
        - font-weight: 700
        - color: var(--primary-text-color)
    triggers_update: all
    variables:
      daytime: ''
      tz: UTC
navbar-templates:
  main:
    desktop:
      min_width: 600
      position: left
      show_labels: true
      show_popup_label_backgrounds: true
    layout:
      auto_padding:
        desktop_px: 120
        enabled: true
        mobile_px: 100
      reflect_child_state: true
    mobile:
      mode: docked
      show_labels: true
    routes:
      - icon: mdi:home
        label: Home
        url: /dashboard-hub/hubhome
      - icon: mdi:floor-plan
        label: Rooms
        popup:
          - icon: mdi:sofa
            label: Living
            url: /dashboard-hub/living-room
          - icon: mdi:teddy-bear
            label: Kids
            url: /dashboard-hub/kidsroom
          - icon: mdi:garage-variant
            label: Garage
            url: /dashboard-hub/garage
          - icon: mdi:gate
            label: Outdoor
            url: /dashboard-hub/outdoor
          - icon: mdi:washing-machine
            label: Laundry
            url: /dashboard-hub/laundry
        tap_action:
          action: open-popup
      - badge:
          count: |
            [[[ return Object.values(states).filter(e =>
                  e.entity_id.startsWith('light.') &&
                  !e.entity_id.startsWith('light.browser') && e.state === 'on').length; ]]]
          show: |
            [[[ return Object.values(states).some(e =>
                  e.entity_id.startsWith('light.') &&
                  !e.entity_id.startsWith('light.browser') && e.state === 'on'); ]]]
        icon: mdi:lightbulb-outline
        icon_selected: mdi:lightbulb-on
        label: Lights
        url: /dashboard-hub/lights
      - icon: mdi:thermometer
        label: Climate
        url: /dashboard-hub/homeclimate
      - badge:
          count: |
            [[[ return ['binary_sensor.garage_door_sensor_contact',
                        'binary_sensor.front_door_contact',
                        'binary_sensor.hallwaydoorsensor_contact',
                        'binary_sensor.patio_door_contact',
                        'binary_sensor.side_door_contact',
                        'binary_sensor.laundrydoorsensor_contact']
                  .filter(id => states[id]?.state === 'on').length; ]]]
          show: |
            [[[ return ['binary_sensor.garage_door_sensor_contact',
                        'binary_sensor.front_door_contact',
                        'binary_sensor.hallwaydoorsensor_contact',
                        'binary_sensor.patio_door_contact',
                        'binary_sensor.side_door_contact',
                        'binary_sensor.laundrydoorsensor_contact']
                  .some(id => states[id]?.state === 'on'); ]]]
        icon: mdi:security
        label: Security
        url: /dashboard-hub/security
      - icon: glyphs-poly:music
        label: Music
        url: /dashboard-hub/media_new
      - icon: mdi:dots-horizontal
        label: More
        popup:
          - icon: mdi:devices
            label: iCloud3
            url: /ic3db-icloud3
          - icon: mdi:cog
            label: Settings
            url: /config
          - icon: mdi:hammer
            label: Dev tools
            url: /developer-tools/yaml
          - icon: mdi:restart
            label: Restart
            tap_action:
              action: perform-action
              confirmation:
                text: Are you sure you want to restart Home Assistant?
              perform_action: homeassistant.restart
        tap_action:
          action: open-popup
    styles: |
      /* Glass rail. Sizes are left to navbar-card so icon + label always fit on every view. */
      .navbar-card.desktop {
        background: var(--glass-bg) !important;
        backdrop-filter: blur(34px) saturate(190%);
        -webkit-backdrop-filter: blur(34px) saturate(190%);
        border: 1px solid var(--glass-border) !important;
        border-radius: 32px !important;
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi) !important;
        overflow: visible !important;
      }
      .navbar.desktop.left { padding: 12px 8px !important; justify-content: center; }
      .button { border-radius: 20px !important; }
      .button.active {
        background: var(--glass-bg-soft) !important;
        box-shadow: inset 0 1px 0 var(--glass-hi), 0 6px 16px rgba(0,0,0,0.12) !important;
        border-radius: 20px !important;
      }
      .icon.active, .label.active { color: var(--primary-text-color) !important; }
      .icon, .label { color: var(--secondary-text-color); }
      .navbar-popup {
        background: var(--popup-background-color) !important;
        backdrop-filter: blur(34px) saturate(190%);
        -webkit-backdrop-filter: blur(34px) saturate(190%);
        border: 1px solid var(--glass-border);
        border-radius: 28px !important;
      }
views:
  - background:
      opacity: 20
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
    badges:
      - color: red
        content: Side Camera Battery Low
        entity: sensor.side_battery
        icon: mdi:battery-20
        tap_action:
          action: more-info
        type: custom:mushroom-template-badge
        visibility:
          - below: 20
            condition: numeric_state
            entity: sensor.side_battery
    dense_section_placement: true
    header:
      badges_position: top
      badges_wrap: scroll
      layout: center
    icon: mdi:home-assistant
    max_columns: 3
    path: hubhome
    title: Home
    top_margin: false
    type: sections
    sections:
      - column_span: 3
        type: grid
        cards:
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: custom:button-card
                triggers_update: all
                show_icon: false
                show_name: false
                show_state: false
                custom_fields:
                  body: |
                    [[[
                      const d = new Date();
                      const tz = { timeZone: 'Australia/Brisbane' };
                      const h = parseInt(d.toLocaleTimeString('en-AU', { ...tz, hour: 'numeric', hour12: false }));
                      const hello = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
                      const date = d.toLocaleDateString('en-AU', { ...tz, weekday: 'long', day: 'numeric', month: 'long' });
                      return `<div style="text-align:left">
                        <div style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--secondary-text-color)">${date}</div>
                        <div style="font-size:40px;font-weight:600;letter-spacing:-.03em;margin-top:4px">${hello}</div>
                      </div>`;
                    ]]]
                styles:
                  card:
                    - height: 110px
                    - border-radius: 28px
                    - padding: 0 30px
                  grid:
                    - grid-template-areas: '"body"'
                  custom_fields:
                    body:
                      - width: 100%
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:button-card
                    entity: person.sushenmathur
                    template: glass_person
                    variables:
                      battery: sensor.iphone_battery_level
                      network: sensor.iphone_connection_type
                  - type: custom:button-card
                    entity: person.paro
                    template: glass_person
                    variables:
                      battery: sensor.paro_phone_battery
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    entity: scene.good_night
                    icon: mdi:weather-night
                    name: Good Night
                    template: glass_action
                    tap_action:
                      action: perform-action
                      confirmation:
                        text: Run the Good Night scene?
                      perform_action: scene.turn_on
                      target:
                        entity_id: scene.good_night
                  - type: custom:button-card
                    entity: script.say_tts_message
                    icon: mdi:bullhorn
                    name: Announce
                    template: glass_action
                    tap_action:
                      action: more-info
                  - type: custom:button-card
                    entity: script.lost_phone
                    icon: mdi:cellphone-arrow-down
                    name: Lost Phone
                    template: glass_action
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.popup
                        data:
                          title: Lost Phone
                          content:
                            - default: Sushen
                              label: Phone
                              name: phone
                              selector:
                                select:
                                  options:
                                    - Paro
                                    - Sushen
                            - label: Passcode
                              name: passcode
                              selector:
                                text:
                                  type: password
                          left_button: Cancel
                          right_button: Send alert
                          right_button_action:
                            service: script.lost_phone
                            data:
                              browser_id: THIS
                              passcode: '{{ passcode }}'
                              phone: '{{ phone }}'
                  - type: custom:button-card
                    icon: mdi:wifi
                    name: WiFi
                    template: glass_action
                    tap_action:
                      action: perform-action
                      perform_action: browser_mod.popup
                      data:
                        title: Scan for WiFi
                        content:
                          type: picture
                          image:
                            media_content_id: >-
                              media-source://image_upload/50750ef2d78e15cc901576e1c9fa2bae
                            media_content_type: image/png
          - type: grid
            columns: 6
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:button-card
                icon: mdi:sofa
                name: Living
                template: room_tile
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-hub/living-room
                variables:
                  tint: 206,120,236
                  lights:
                    - light.dining_light
                    - light.kitchen_pendants
                    - light.kitchen_downlights
                    - light.kitchenled
                    - light.sonoff_1000dbd8b7
                    - switch.sonoff_100090d020
              - type: custom:button-card
                icon: mdi:teddy-bear
                name: Kids
                template: room_tile
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-hub/kidsroom
                variables:
                  tint: 255,196,110
                  lights:
                    - light.aarlo_samar_cam
                    - light.tall_lamp
              - type: custom:button-card
                entity: cover.garage_door_v2
                icon: mdi:garage-variant
                name: Garage
                template: room_tile
                label: |
                  [[[
                    return ({ open: 'Door open', closed: 'Door closed',
                              opening: 'Door opening', closing: 'Door closing' })[entity.state]
                           || `Door ${entity.state}`;
                  ]]]
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-hub/garage
                variables:
                  tint: 170,185,205
                  force_on: >-
                    [[[ return states["cover.garage_door_v2"]?.state === "open";
                    ]]]
              - type: custom:button-card
                icon: mdi:gate
                name: Outdoor
                template: room_tile
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-hub/outdoor
                variables:
                  tint: 110,220,160
                  lights:
                    - switch.patio_lights
                    - light.backyard_light
                    - light.driveway_light
                    - light.laundry_light
                    - switch.sonoff_100053e676
                    - switch.sonoff_1000905c71
              - type: custom:button-card
                icon: mdi:washing-machine
                name: Laundry
                template: room_tile
                label: |
                  [[[ const w = states['sensor.washer_current_status']?.state;
                      const d = states['sensor.dryer_current_status']?.state;
                      const on = s => s && !['power_off','unavailable','unknown'].includes(s);
                      if (on(w) && on(d)) return 'Washer & dryer running';
                      if (on(w)) return 'Washer running';
                      if (on(d)) return 'Dryer running';
                      return 'Idle'; ]]]
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-hub/laundry
                variables:
                  tint: 100,180,255
                  force_on: >
                    [[[ const on = s => s &&
                    !['power_off','unavailable','unknown'].includes(s);
                        return on(states['sensor.washer_current_status']?.state)
                            || on(states['sensor.dryer_current_status']?.state); ]]]
              - type: custom:button-card
                entity: media_player.tv
                icon: mdi:multimedia
                name: Media
                template: room_tile
                triggers_update: all
                label: |
                  [[[
                    const skip = variables.skip || [], names = variables.names || {}, sw = variables.switches || {};
                    const playing = Object.values(states).filter(e =>
                      e.entity_id.startsWith('media_player.') && e.state === 'playing' &&
                      !skip.some(s => e.entity_id.startsWith(s)))
                      .map(e => names[e.entity_id] || e.attributes.friendly_name || e.entity_id);
                    const on = Object.entries(sw).filter(([id, s]) =>
                      states[id]?.state === 'on' && states[s.player]?.state !== 'playing').map(([id, s]) => s.name);
                    const parts = [];
                    if (playing.length === 1) parts.push(`${playing[0]} playing`);
                    if (playing.length > 1) parts.push(`${playing.length} playing`);
                    on.forEach(n => parts.push(`${n} on`));
                    return parts.length ? parts.join(' · ') : 'All off';
                  ]]]
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Media
                      dismissable: true
                      size: normal
                      content:
                        type: grid
                        columns: 2
                        square: false
                        cards:
                          - type: tile
                            entity: media_player.tv
                            name: TV
                            vertical: false
                            state_content:
                              - state
                              - app_name
                              - media_title
                            features:
                              - type: media-player-playback
                              - type: media-player-volume-slider
                            features_position: bottom
                          - type: tile
                            entity: switch.bedroom_tv
                            name: Bedroom TV
                            icon: mdi:television-classic
                            vertical: false
                            features:
                              - type: toggle
                            features_position: bottom
                          - type: tile
                            entity: media_player.media_apple_tv
                            name: Media Apple TV
                            vertical: false
                            features:
                              - type: media-player-playback
                              - type: media-player-volume-slider
                            features_position: bottom
                          - type: tile
                            entity: media_player.bedroom_apple_tv
                            name: Bedroom Apple TV
                            vertical: false
                            state_content:
                              - state
                              - app_name
                              - media_title
                            features:
                              - type: media-player-playback
                              - type: media-player-volume-slider
                            features_position: bottom
                variables:
                  tint: 160,130,235
                  names:
                    media_player.hubs_bedroom_apple_tv: Bedroom Apple TV
                    media_player.media_apple_tv: Media Apple TV
                    media_player.tv: TV
                  skip:
                    - media_player.browser_
                    - media_player.aarlo_
                    - media_player.home_speakers_2
                    - media_player.bluey_media_player
                  switches:
                    switch.bedroom_tv:
                      name: Bedroom TV
                      player: media_player.hubs_bedroom_apple_tv
                  force_on: |
                    [[[
                      const skip = variables.skip || [], sw = variables.switches || {};
                      return Object.values(states).some(e =>
                          e.entity_id.startsWith('media_player.') && e.state === 'playing' &&
                          !skip.some(s => e.entity_id.startsWith(s)))
                        || Object.keys(sw).some(id => states[id]?.state === 'on');
                    ]]]
      - type: grid
        cards:
          - type: heading
            heading: Favourites
            heading_style: title
            icon: mdi:home-heart
          - type: tile
            entity: media_player.tv
            icon: mdi:television
            show_entity_picture: true
            state_content:
              - state
              - source
            vertical: false
            grid_options:
              columns: 12
              rows: 2
            hold_action:
              action: toggle
            icon_tap_action:
              action: perform-action
              perform_action: script.media_tv_power
            features:
              - type: media-player-playback
            features_position: bottom
          - type: tile
            entity: climate.living_room
            name: Aircon
            icon: mdi:air-conditioner
            vertical: false
            grid_options:
              columns: 12
              rows: 2
            features:
              - type: climate-hvac-modes
