# Quiet Glass dashboard (master). Single source of truth: paste this whole file into
# Dashboard > pencil > three dots > Raw configuration editor. Pair it with themes/glass.yaml.
# Rules: no hex / rgba literals here (all colour, radius, size, shadow and duration come from the theme
# as var(--token)); 8 button-card templates (qg_*); native tile / heading / grid for simple entities.
# Home = top bar | Now (conditional, priority order) | Rooms + favourites | Energy, event, scenes.
kiosk_mode:
  user_settings:
  - users:
    - suparhome
    hide_header: true
    hide_sidebar: true
button_card_templates:
  qg_card:
    section_mode: true
    show_icon: false
    show_name: true
    show_state: false
    show_label: false
    styles:
      card:
      - --qg-on: 0
      - --qg-tone: var(--state-on)
      - --qg-tone-ink: var(--state-on-ink)
      - --qg-tone-tint: var(--state-on-tint)
      - height: 100%
      - min-height: var(--tap)
      - box-sizing: border-box
      - padding: var(--space-3)
      - font-family: var(--font-sans)
      - font-size: var(--fs-body)
      - font-weight: var(--fw-medium)
      - line-height: var(--lh-tight)
      - color: var(--text-1)
      - background: var(--surface-1)
      - background: color-mix(in srgb, var(--qg-tone-tint) calc(var(--qg-on) * 100%), var(--surface-1))
      - border: 1px solid var(--hairline)
      - border: 1px solid color-mix(in srgb, var(--qg-tone) calc(var(--qg-on) * 35%), var(--hairline))
      - border-radius: var(--radius-lg)
      - box-shadow: var(--shadow-card)
      - transition: background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease), opacity var(--dur-base) var(--ease)
      img_cell:
      - width: var(--disc)
      - height: var(--disc)
      - border-radius: var(--radius-pill)
      - background: var(--surface-2)
      - background: color-mix(in srgb, var(--qg-tone) calc(var(--qg-on) * 26%), var(--surface-2))
      - justify-self: start
      - align-self: center
      icon:
      - width: var(--icon-md)
      - color: var(--text-2)
      - color: color-mix(in srgb, var(--qg-tone-ink) calc(var(--qg-on) * 100%), var(--text-2))
      name:
      - justify-self: start
      - text-align: left
      - font-size: var(--fs-body)
      - font-weight: var(--fw-semibold)
      - color: var(--text-1)
      - min-width: 0
      - max-width: 100%
      - overflow: hidden
      - text-overflow: ellipsis
      - white-space: nowrap
      label:
      - justify-self: start
      - text-align: left
      - font-size: var(--fs-secondary)
      - font-weight: var(--fw-regular)
      - color: var(--text-2)
      - min-width: 0
      - max-width: 100%
      - overflow: hidden
      - text-overflow: ellipsis
      - white-space: nowrap
      state:
      - justify-self: start
      - font-size: var(--fs-secondary)
      - font-weight: var(--fw-regular)
      - color: var(--text-2)
    state:
    - value: unavailable
      styles:
        card:
        - opacity: var(--opacity-dim)
    extra_styles: |
      @keyframes qg-pulse {
        0%, 100% { box-shadow: var(--shadow-card), 0 0 0 0 color-mix(in srgb, var(--state-alert) 0%, transparent); }
        50% { box-shadow: var(--shadow-card), 0 0 0 var(--ring-size) color-mix(in srgb, var(--state-alert) 28%, transparent); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
  qg_room:
    template: qg_card
    show_icon: true
    show_label: true
    variables:
      watch: []
    label: |-
      [[[
      const n = (variables.watch || []).filter(e => states[e]?.state === 'on').length;
      return n ? `${n} on` : 'All off';
      ]]]
    styles:
      card:
      - --qg-on: |-
          [[[
          const lit = variables.active ?? (variables.watch || []).some(e => states[e]?.state === 'on');
          return lit ? 1 : 0;
          ]]]
      - padding: var(--space-4)
      grid:
      - grid-template-areas: '"i" "n" "l"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr min-content min-content
      - row-gap: var(--space-1)
      name:
      - font-size: var(--fs-title)
  qg_toggle:
    template: qg_card
    show_icon: true
    show_label: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    label: |-
      [[[
      const s = entity.state;
      return s === 'unavailable' ? 'unavailable' : s === 'on' ? 'On' : 'Off';
      ]]]
    styles:
      card:
      - padding: var(--space-2) var(--space-3)
      - border-radius: var(--radius-sm)
      grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: var(--icon-md) minmax(0, 1fr)
      - column-gap: var(--space-3)
      - align-items: center
      label:
      - font-size: var(--fs-caption)
    state:
    - value: 'on'
      styles:
        card:
        - --qg-on: 1
    - value: unavailable
      styles:
        card:
        - opacity: var(--opacity-dim)
  qg_chip:
    template: qg_card
    show_icon: true
    styles:
      card:
      - padding: 0 var(--space-3)
      - border-radius: var(--radius-sm)
      - background: var(--surface-2)
      - box-shadow: none
      - cursor: pointer
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: var(--icon-md) minmax(0, 1fr)
      - column-gap: var(--space-2)
      - align-items: center
      name:
      - font-size: var(--fs-secondary)
      - font-weight: var(--fw-medium)
  qg_stat:
    template: qg_card
    show_label: true
    variables:
      calc: ''
      dp: 0
      prefix: ''
      suffix: ''
    name: |-
      [[[
      const w = id => {
        const e = states[id]; const v = parseFloat(e?.state); if (isNaN(v)) return 0;
        return Math.abs((e.attributes.unit_of_measurement || '').toLowerCase() === 'kw' ? v * 1000 : v);
      };
      const fmt = v => v >= 1000 ? (v / 1000).toFixed(1) + ' kW' : Math.round(v) + ' W';
      const solar = w('sensor.sh50rs_a21c2106894_mppt_total_power'), imp = w('sensor.sh50rs_a21c2106894_purchased_power');
      const exp = w('sensor.sh50rs_a21c2106894_total_export_active_power');
      const ev = w('sensor.bluey_charger_power') + w('sensor.kia_charger_power');
      const house = Math.max(0, solar + imp - exp - ev), load = house + ev;
      if (variables.calc === 'home') return fmt(load);
      if (variables.calc === 'self') return (load > 0 ? Math.round(Math.min(1, solar / load) * 100) : 0) + '%';
      const v = parseFloat(entity?.state);
      return isNaN(v) ? (entity?.state ?? '') : variables.prefix + v.toFixed(variables.dp) + variables.suffix;
      ]]]
    styles:
      grid:
      - grid-template-areas: '"l" "n"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content min-content
      - align-content: center
      - row-gap: var(--space-1)
      name:
      - font-size: var(--fs-hero)
      - font-weight: var(--fw-semibold)
      - font-variant-numeric: tabular-nums
      label:
      - font-size: var(--fs-secondary)
  qg_person:
    template: qg_card
    show_icon: false
    show_name: false
    show_label: true
    show_entity_picture: true
    tap_action:
      action: more-info
    label: |-
      [[[
      const place = { home: 'Home', not_home: 'Away', 'Sushen - Work': 'Office', 'Paro - Work': 'Work', Gym: 'Gym' };
      const first = String(entity.attributes.friendly_name || '').split(' ')[0];
      return `<b style="font-weight:var(--fw-semibold);color:var(--text-1)">${first}</b><br>${place[entity.state] || entity.state}`;
      ]]]
    custom_fields:
      dot: <i></i>
    state:
    - value: home
      styles:
        custom_fields:
          dot:
          - background: var(--state-ok)
    - value: unavailable
      styles:
        card:
        - opacity: var(--opacity-dim)
    styles:
      card:
      - background: transparent
      - border: none
      - box-shadow: none
      - padding: var(--space-1)
      grid:
      - grid-template-areas: '"i" "l"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content min-content
      - justify-items: center
      - align-content: center
      - row-gap: var(--space-1)
      img_cell:
      - width: var(--disc)
      - height: var(--disc)
      - justify-self: center
      entity_picture:
      - width: var(--disc)
      - height: var(--disc)
      - border-radius: var(--radius-pill)
      - object-fit: cover
      label:
      - text-align: center
      - justify-self: center
      - font-size: var(--fs-caption)
      - line-height: var(--lh-tight)
      custom_fields:
        dot:
        - width: var(--dot)
        - height: var(--dot)
        - border-radius: var(--radius-pill)
        - background: var(--text-2)
        - border: 2px solid var(--surface-1)
        - grid-area: i
        - justify-self: end
        - align-self: end
        - margin-right: var(--space-3)
  qg_scene:
    template: qg_card
    show_icon: true
    styles:
      card:
      - padding: var(--space-2)
      - border-radius: var(--radius-sm)
      - cursor: pointer
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr min-content
      - justify-items: center
      - row-gap: var(--space-2)
      icon:
      - width: var(--icon-lg)
      - color: var(--text-1)
      name:
      - justify-self: center
      - text-align: center
      - font-size: var(--fs-secondary)
      - font-weight: var(--fw-medium)
  qg_now_item:
    template: qg_card
    show_icon: true
    show_label: true
    styles:
      card:
      - --qg-on: 1
      - padding: var(--space-2) var(--space-3)
      grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: var(--disc) minmax(0, 1fr)
      - column-gap: var(--space-3)
      - align-items: center
      icon:
      - width: var(--icon-md)
navbar-templates:
  main:
    desktop:
      min_width: 600
      position: left
      show_labels: true
      show_popup_label_backgrounds: false
    layout:
      auto_padding:
        desktop_px: 112
        enabled: true
        mobile_px: 100
      reflect_child_state: true
    mobile:
      mode: docked
      show_labels: true
    routes:
    - icon: mdi:home
      label: Home
      url: /home-2-0/hubhome
    - icon: mdi:floor-plan
      label: Rooms
      popup:
      - icon: mdi:sofa
        label: Living
        url: /home-2-0/living-room
      - icon: mdi:teddy-bear
        label: Kids
        url: /home-2-0/kidsroom
      - icon: mdi:garage-variant
        label: Garage
        url: /home-2-0/garage
      - icon: mdi:gate
        label: Outdoor
        url: /home-2-0/outdoor
      - icon: mdi:washing-machine
        label: Laundry
        url: /home-2-0/laundry
      tap_action:
        action: open-popup
    - icon: mdi:lightbulb-outline
      icon_selected: mdi:lightbulb-on
      label: Lights
      url: /home-2-0/lights
    - icon: mdi:thermometer
      label: Climate
      url: /home-2-0/homeclimate
    - badge:
        count: |-
          [[[
          const on = id => states[id]?.state === 'on';
          const night = states['sun.sun']?.state === 'below_horizon';
          const open = ['binary_sensor.garage_door_sensor_contact', 'binary_sensor.side_door_contact', 'binary_sensor.crimsafe_door_contact']
            .concat(night ? ['binary_sensor.front_door_contact', 'binary_sensor.patio_door_contact', 'binary_sensor.laundrydoorsensor_contact', 'binary_sensor.hallwaydoorsensor_contact'] : [])
            .filter(on);
          return open.length;
          ]]]
        show: |-
          [[[
          const on = id => states[id]?.state === 'on';
          const night = states['sun.sun']?.state === 'below_horizon';
          const open = ['binary_sensor.garage_door_sensor_contact', 'binary_sensor.side_door_contact', 'binary_sensor.crimsafe_door_contact']
            .concat(night ? ['binary_sensor.front_door_contact', 'binary_sensor.patio_door_contact', 'binary_sensor.laundrydoorsensor_contact', 'binary_sensor.hallwaydoorsensor_contact'] : [])
            .filter(on);
          return open.length > 0;
          ]]]
      icon: mdi:security
      label: Security
      url: /home-2-0/security
    - icon: mdi:music
      label: Music
      url: /home-2-0/music
    - icon: mdi:dots-horizontal
      label: More
      popup:
      - icon: mdi:devices
        label: Phones
        url: /ic3db-icloud3
      - icon: mdi:cog
        label: Settings
        url: /config
      - icon: mdi:hammer
        label: Dev tools
        url: /developer-tools/yaml
      - icon: mdi:restart
        label: Restart
        tap_action:
          action: perform-action
          confirmation:
            text: Are you sure you want to restart Home Assistant?
          perform_action: homeassistant.restart
      tap_action:
        action: open-popup
    styles: |
      /* Quiet Glass rail: the only glass on the Home view. Tokens come from themes/glass.yaml. */
      .navbar-card.desktop {
        background: var(--glass-bg) !important;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border) !important;
        border-radius: var(--radius-lg) !important;
        box-shadow: var(--shadow-pop) !important;
        overflow: visible !important;
      }
      .navbar.desktop.left { padding: var(--space-3) var(--space-2) !important; justify-content: center; }
      .button { border-radius: var(--radius-sm) !important; min-height: var(--tap); transition: background var(--dur-fast) var(--ease); }
      .button.active { background: var(--surface-2) !important; }
      .icon.active, .label.active { color: var(--text-1) !important; }
      .icon, .label { color: var(--text-2); font-family: var(--font-sans); font-size: var(--fs-caption); font-weight: var(--fw-medium); }
      .badge { background: var(--state-alert) !important; color: var(--on-alert) !important; font-size: var(--fs-caption); font-weight: var(--fw-semibold); }
      .navbar-popup {
        background: var(--popup-bg) !important;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg) !important;
        padding: var(--space-2) !important;
        gap: var(--space-2) !important;
        box-shadow: var(--shadow-pop) !important;
      }
      .popup-item {
        min-width: calc(var(--tap) * 2) !important;
        min-height: var(--tap) !important;
        padding: var(--space-3) var(--space-2) !important;
        border-radius: var(--radius-sm) !important;
        background: var(--surface-2) !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: var(--space-1) !important;
        color: var(--text-1) !important;
      }
      .popup-item:active { background: var(--surface-1) !important; }
      .popup-item ha-icon, .popup-item .icon { --mdc-icon-size: var(--icon-lg); color: var(--text-1) !important; }
      .popup-item .label, .popup-label, .popup-label-text {
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
        font-size: var(--fs-secondary) !important;
        font-weight: var(--fw-medium) !important;
        color: var(--text-1) !important;
        position: static !important;
        transform: none !important;
      }
views:
- title: Home
  path: hubhome
  icon: mdi:home-assistant
  type: sections
  max_columns: 3
  dense_section_placement: true
  top_margin: false
  theme: Glass
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:button-card
      template: qg_stat
      triggers_update:
      - sensor.time
      grid_options:
        columns: 3
        rows: 2
      tap_action:
        action: none
      name: |-
        [[[
        const t = new Date().toLocaleTimeString('en-AU', { timeZone: 'Australia/Brisbane', hour: 'numeric', minute: '2-digit', hour12: true }).split(/\s+/);
        return `${t[0]}<span style="font-size:var(--fs-title);font-weight:var(--fw-medium);color:var(--text-2);margin-left:var(--space-2)">${(t[1] || '').toUpperCase()}</span>`;
        ]]]
      label: |-
        [[[
        return new Date().toLocaleDateString('en-AU', { timeZone: 'Australia/Brisbane', weekday: 'long', day: 'numeric', month: 'long' });
        ]]]
      styles:
        card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: var(--space-2) var(--space-3)
        name:
        - font-size: var(--fs-clock)
        - font-weight: var(--fw-medium)
        - line-height: 1
        - letter-spacing: -0.02em
        - overflow: visible
        label:
        - font-size: var(--fs-body)
        - color: var(--text-2)
    - type: custom:button-card
      template: qg_stat
      show_label: false
      triggers_update:
      - sensor.time
      - input_boolean.front_door
      - select.grid_import_tariff
      - binary_sensor.front_door_contact
      - binary_sensor.crimsafe_door_contact
      - binary_sensor.garage_door_sensor_contact
      - binary_sensor.hallwaydoorsensor_contact
      - binary_sensor.patio_door_contact
      - binary_sensor.side_door_contact
      - binary_sensor.laundrydoorsensor_contact
      - light.dining_light
      - light.kitchen_pendants
      - light.kitchenled
      - light.kitchen_downlights
      - light.sonoff_1000dbd8b7
      - light.corridor_light
      - light.tall_lamp
      - light.aarlo_samar_cam
      - light.hallway_light
      - light.garage_light
      - light.driveway_light
      - light.backyard_light
      - light.laundry_light
      grid_options:
        columns: 5
        rows: 2
      tap_action:
        action: navigate
        navigation_path: /home-2-0/security
      name: |-
        [[[
        const on = id => states[id]?.state === 'on';
        const doors = { 'binary_sensor.front_door_contact': 'Front door', 'binary_sensor.crimsafe_door_contact': 'Security door', 'binary_sensor.garage_door_sensor_contact': 'Garage door',
          'binary_sensor.hallwaydoorsensor_contact': 'Hallway door', 'binary_sensor.patio_door_contact': 'Patio door', 'binary_sensor.side_door_contact': 'Side door', 'binary_sensor.laundrydoorsensor_contact': 'Laundry door' };
        const issues = Object.entries(doors).filter(([id]) => on(id)).map(([, n]) => n + ' open');
        if (on('input_boolean.front_door')) issues.push('Front door unlocked');
        const lights = Object.values(states).filter(e => e.entity_id.startsWith('light.') && !e.entity_id.startsWith('light.browser') && e.state === 'on').length;
        const tariff = states['select.grid_import_tariff']?.state;
        const parts = [issues.length ? issues[0] + (issues.length > 1 ? ` +${issues.length - 1}` : '') : 'All secure',
          lights ? `${lights} light${lights === 1 ? '' : 's'} on` : 'Lights off'];
        if (tariff && !['unknown', 'unavailable'].includes(tariff)) parts.push(tariff);
        const icon = issues.length ? 'mdi:shield-alert-outline' : 'mdi:shield-check-outline';
        const ink = issues.length ? 'var(--state-warn-ink)' : 'var(--state-ok-ink)';
        return `<ha-icon icon="${icon}" style="--mdc-icon-size:var(--icon-md);color:${ink};vertical-align:middle;margin-right:var(--space-2)"></ha-icon>${parts.join(' · ')}`;
        ]]]
      styles:
        card:
        - background: transparent
        - border: none
        - box-shadow: none
        - align-content: center
        grid:
        - grid-template-areas: '"n"'
        - justify-items: center
        - align-content: center
        name:
        - font-size: var(--fs-title)
        - font-weight: var(--fw-medium)
        - white-space: normal
        - text-align: center
        - justify-self: center
    - type: custom:button-card
      template: qg_chip
      entity: weather.north_lakes_weather
      show_icon: true
      show_state: true
      triggers_update:
      - weather.north_lakes_weather
      grid_options:
        columns: 2
        rows: 2
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            style: |
              --ha-dialog-surface-background: var(--popup-bg);
              --ha-dialog-surface-backdrop-filter: var(--glass-blur);
              --mdc-dialog-scrim-color: var(--scrim);
              --ha-dialog-border-radius: var(--radius-lg);
              --mdc-dialog-min-width: min(var(--popup-width), 92vw);
              --mdc-dialog-max-width: min(var(--popup-width), 92vw);
              --ha-dialog-width-md: min(var(--popup-width), 92vw);
            dismissable: true
            size: normal
            content:
              type: vertical-stack
              cards:
              - type: heading
                heading: Brisbane
                heading_style: title
                icon: mdi:weather-partly-cloudy
              - type: custom:clock-weather-card
                entity: weather.north_lakes_weather
                name: Brisbane
                sun_entity: sun.sun
                date_pattern: ccc, d MMM yyyy
                forecast_rows: 5
                show_humidity: true
                use_browser_time: true
                weather_icon_type: fill
              - type: grid
                columns: 3
                square: false
                cards:
                - type: custom:button-card
                  template: qg_chip
                  name: |-
                    [[[
                    const f = iso => iso ? new Date(iso).toLocaleTimeString('en-AU', { timeZone: 'Australia/Brisbane', hour: 'numeric', minute: '2-digit', hour12: false }) : '–';
                    return 'Sunrise ' + f(states['sun.sun']?.attributes?.next_rising);
                    ]]]
                  icon: mdi:weather-sunset-up
                  triggers_update:
                  - sun.sun
                  show_name: true
                - type: custom:button-card
                  template: qg_chip
                  name: |-
                    [[[
                    const f = iso => iso ? new Date(iso).toLocaleTimeString('en-AU', { timeZone: 'Australia/Brisbane', hour: 'numeric', minute: '2-digit', hour12: false }) : '–';
                    return 'Sunset ' + f(states['sun.sun']?.attributes?.next_setting);
                    ]]]
                  icon: mdi:weather-sunset-down
                  triggers_update:
                  - sun.sun
                  show_name: true
                - type: custom:button-card
                  template: qg_chip
                  icon: mdi:weather-windy
                  triggers_update:
                  - weather.north_lakes_weather
                  name: |-
                    [[[
                    const a = states['weather.north_lakes_weather']?.attributes || {};
                    return a.wind_speed !== undefined ? 'Wind ' + Math.round(a.wind_speed) + ' ' + (a.wind_speed_unit || 'km/h') : 'Wind –';
                    ]]]
      name: |-
        [[[
        const t = parseFloat(entity.attributes.temperature);
        return isNaN(t) ? '–' : Math.round(t) + '°';
