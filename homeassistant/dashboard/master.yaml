          - type: custom:button-card
            entity: sensor.sh50rs_a21c2106894_mppt_total_power
            show_icon: false
            show_name: false
            show_state: false
            grid_options:
              columns: full
            tap_action:
              action: navigate
              navigation_path: /energy-new/energy
            triggers_update:
              - sensor.sh50rs_a21c2106894_mppt_total_power
              - sensor.sh50rs_a21c2106894_purchased_power
              - sensor.sh50rs_a21c2106894_total_export_active_power
              - sensor.bluey_charger_power
              - sensor.kia_charger_power
              - sensor.daily_import_cost
              - sensor.daily_solar_credit
              - sensor.current_energy_rate
            extra_styles: >
              .fs-wire{position:relative;height:5px;border-radius:3px;background:rgba(var(--rgb-primary-text-color),0.12);margin:0
              6px 30px;overflow:hidden}

              .fs-wire
              i{position:absolute;top:0;bottom:0;width:30%;border-radius:3px;animation:fsrun
              1.6s linear infinite}

              .fs-rev i{animation-direction:reverse}

              .fs-idle i{display:none}

              @keyframes fsrun{from{left:-30%}to{left:100%}}

              @media (prefers-reduced-motion: reduce){.fs-wire
              i{animation:none;left:35%}}
            custom_fields:
              flow: |
                [[[
                  const num = id => { const v = parseFloat(states[id]?.state); return isNaN(v) ? 0 : v; };
                  const w = id => {
                    const e = states[id]; if (!e) return 0;
                    const v = parseFloat(e.state); if (isNaN(v)) return 0;
                    const u = (e.attributes.unit_of_measurement || '').toLowerCase();
                    return Math.abs(u === 'kw' ? v * 1000 : v);
                  };
                  const solar = w('sensor.sh50rs_a21c2106894_mppt_total_power');
                  const imp = w('sensor.sh50rs_a21c2106894_purchased_power');
                  const exp = w('sensor.sh50rs_a21c2106894_total_export_active_power');
                  const tesla = w('sensor.bluey_charger_power');
                  const kia = w('sensor.kia_charger_power');
                  const fmt = v => v >= 1000 ? (v / 1000).toFixed(1) + ' kW' : Math.round(v) + ' W';
                  const money = id => '$' + num(id).toFixed(2);
                  const house = Math.max(0, solar + imp - exp - tesla - kia);
                  const load = house + tesla + kia;
                  const self = load > 0 ? Math.round(Math.min(1, solar / load) * 100) : 0;
                  const C = { solar: '#f59e0b', grid: '#8b5cf6', home: '#3b82f6', ev: '#10b981', kia: '#14b8a6' };
                  const mute = 'var(--secondary-text-color)';
                  const gridCol = C.grid;
                  const gridCls = exp > 0 ? 'fs-rev' : (imp > 0 ? '' : 'fs-idle');
                  const speed = v => Math.max(0.5, 2.2 - (v / 1000) * 0.4).toFixed(2) + 's';
                  const tint = (col, a) => `color-mix(in srgb, ${col} ${a}%, transparent)`;
                  const tariff = states['select.grid_import_tariff']?.state || '';
                  const rate = states['sensor.current_energy_rate']?.state;

                  const stat = (v, l, col) => `<div><div style="font-size:17px;font-weight:700;color:${col || 'inherit'}">${v}</div><div style="font-size:11px;color:${mute}">${l}</div></div>`;
                  const node = (icon, col, val, label, big) => `
                    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0">
                      <div style="width:${big ? 70 : 56}px;height:${big ? 70 : 56}px;border-radius:${big ? 23 : 19}px;display:grid;place-items:center;background:${tint(col, 24)};box-shadow:0 0 26px ${tint(col, 40)}, inset 0 1px 0 var(--glass-hi)">
                        <ha-icon icon="${icon}" style="--mdc-icon-size:${big ? 34 : 26}px;color:${col}"></ha-icon>
                      </div>
                      <div style="font-size:15px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums">${val}</div>
                      <div style="font-size:11px;color:${mute};white-space:nowrap">${label}</div>
                    </div>`;
                  const wire = (cls, col, v) => `<div class="fs-wire ${cls}"><i style="background:${col};animation-duration:${speed(v)}"></i></div>`;
                  const ev = (icon, col, name, v) => `
                    <div style="display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:16px;background:var(--glass-field);min-width:0">
                      <ha-icon icon="${icon}" style="--mdc-icon-size:18px;color:${v > 0 ? col : mute}"></ha-icon>
                      <div style="min-width:0;text-align:left">
                        <div style="font-size:13px;font-weight:700">${name}</div>
                        <div style="font-size:11px;color:${mute};white-space:nowrap">${v > 0 ? 'Charging' : 'Not charging'}</div>
                      </div>
                      <div style="margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:${v > 0 ? col : mute}">${fmt(v)}</div>
                    </div>`;

                  return `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                      <div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:${mute}">
                        <ha-icon icon="mdi:home-lightning-bolt" style="--mdc-icon-size:15px"></ha-icon>Energy</div>
                      <div style="font-size:12px;color:${mute}">${tariff}${rate ? ' · $' + Number(rate).toFixed(2) + '/kWh' : ''}</div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-bottom:14px">
                      ${stat(money('sensor.daily_import_cost'), 'Today')}
                      ${stat(money('sensor.daily_solar_credit'), 'Sold', 'var(--glass-ok)')}
                      ${stat(money('sensor.electricity_bill_to_date'), 'Bill to date')}
                      ${stat(money('sensor.electricity_estimated_bill'), 'Est. bill')}
                    </div>
                    <div style="display:grid;grid-template-columns:70px 1fr 84px 1fr 70px;align-items:center">
                      ${node('mdi:transmission-tower', C.grid, fmt(exp || imp), exp > 0 ? 'Exporting' : imp > 0 ? 'From grid' : 'Grid idle')}
                      ${wire(gridCls, gridCol, exp || imp)}
                      ${node('mdi:home', C.home, fmt(load), 'Home', true)}
                      ${wire(solar > 0 ? 'fs-rev' : 'fs-idle', C.solar, solar)}
                      ${node(solar > 0 ? 'mdi:solar-power-variant' : 'mdi:weather-night', C.solar, fmt(solar), 'Solar')}
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
                      ${ev('phu:tesla-car', C.ev, 'Tesla', tesla)}
                      ${ev('mdi:car-estate', C.kia, 'Kia', kia)}
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:${mute}">
                      <ha-icon icon="mdi:white-balance-sunny" style="--mdc-icon-size:14px;color:${C.solar}"></ha-icon>
                      <span>Self-powered</span>
                      <span style="flex:1;height:7px;border-radius:4px;background:rgba(var(--rgb-primary-text-color),0.12);overflow:hidden">
                        <i style="display:block;height:100%;width:${self}%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:4px"></i>
                      </span>
                      <b style="color:var(--primary-text-color);font-variant-numeric:tabular-nums">${self}%</b>
                    </div>`;
                ]]]
            styles:
              card:
                - padding: 20px 22px
                - border-radius: 28px
              custom_fields:
                flow:
                  - width: 100%
              grid:
                - grid-template-areas: '"flow"'
                - grid-template-columns: 1fr
