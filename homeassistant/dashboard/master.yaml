        const playing = Object.values(states).filter(e => e.entity_id.startsWith('media_player.') && e.state === 'playing' && !skip.some(s => e.entity_id.startsWith(s)))
          .map(e => (names[e.entity_id] || e.attributes.friendly_name || e.entity_id) + ' playing');
        if (states['switch.bedroom_tv']?.state === 'on' && states['media_player.hubs_bedroom_apple_tv']?.state !== 'playing') playing.push('Bedroom TV on');
        if (!['off', 'unavailable', 'unknown'].includes(states['media_player.tv']?.state) && !playing.some(p => p.startsWith('TV'))) playing.push('TV on');
        return playing.join(' · ') || 'On';
        ]]]
