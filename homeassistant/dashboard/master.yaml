- title: Screensaver
  path: saver
  icon: mdi:clock-outline
  type: panel
  subview: true
  theme: Glass Saver
  cards:
  - type: custom:button-card
    template: qg_card
    triggers_update:
    - sensor.time
    - weather.north_lakes_weather
    - calendar.supar_family
    - binary_sensor.front_door_contact
    - binary_sensor.crimsafe_door_contact
    - binary_sensor.garage_door_sensor_contact
    - binary_sensor.hallwaydoorsensor_contact
    - binary_sensor.patio_door_contact
    - binary_sensor.side_door_contact
    - binary_sensor.laundrydoorsensor_contact
    - sensor.side_battery
    - sensor.robbie_dock_dock_error
    - vacuum.robbie
    tap_action:
      action: navigate
      navigation_path: /home-2-0/hubhome
    show_name: false
    custom_fields:
      body: |-
        [[[
        const tz = { timeZone: 'Australia/Brisbane' };
        const d = new Date();
        const t = d.toLocaleTimeString('en-AU', { ...tz, hour: 'numeric', minute: '2-digit', hour12: true }).split(/\s+/);
        const w = states['weather.north_lakes_weather'];
        const temp = parseFloat(w?.attributes?.temperature);
        const cal = states['calendar.supar_family']?.attributes || {};
        const when = cal.start_time ? new Date(String(cal.start_time).replace(' ', 'T')).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true }) : '';
        const doors = { 'binary_sensor.front_door_contact': 'Front door', 'binary_sensor.crimsafe_door_contact': 'Security door', 'binary_sensor.garage_door_sensor_contact': 'Garage door',
          'binary_sensor.hallwaydoorsensor_contact': 'Hallway door', 'binary_sensor.patio_door_contact': 'Patio door', 'binary_sensor.side_door_contact': 'Side door', 'binary_sensor.laundrydoorsensor_contact': 'Laundry door' };
        const alerts = Object.entries(doors).filter(([id]) => states[id]?.state === 'on').map(([, n]) => ['mdi:door-open', n + ' open']);
        const bat = parseFloat(states['sensor.side_battery']?.state);
        if (!isNaN(bat) && bat < 20) alerts.push(['mdi:battery-20', 'Camera battery low']);
        if (states['vacuum.robbie']?.state === 'error') alerts.push(['mdi:robot-vacuum-alert', 'Robbie needs attention']);
        const badge = ([i, n]) => `<span style="display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);background:var(--state-alert-tint);color:var(--state-alert-ink);font-size:var(--fs-body);font-weight:var(--fw-medium)"><ha-icon icon="${i}" style="--mdc-icon-size:var(--icon-md)"></ha-icon>${n}</span>`;
        return `<div style="zoom:var(--saver-scale);text-align:left">
          <div style="font-size:var(--fs-clock);font-weight:var(--fw-regular);line-height:1;letter-spacing:-0.02em">${t[0]}<span style="font-size:var(--fs-title);margin-left:var(--space-2)">${(t[1] || '').toUpperCase()}</span></div>
          <div style="font-size:var(--fs-body);color:var(--text-2);margin-top:var(--space-2)">${d.toLocaleDateString('en-AU', { ...tz, weekday: 'long', day: 'numeric', month: 'long' })}</div>
        </div>
        <div style="margin-top:var(--space-6);display:flex;gap:var(--space-6);align-items:center;font-size:var(--fs-title);color:var(--text-1)">
          <span style="display:inline-flex;align-items:center;gap:var(--space-3)"><ha-icon icon="mdi:thermometer" style="--mdc-icon-size:var(--icon-lg);color:var(--text-2)"></ha-icon>${isNaN(temp) ? '–' : Math.round(temp) + '°'}</span>
          ${cal.message ? `<span style="display:inline-flex;align-items:center;gap:var(--space-3)"><ha-icon icon="mdi:calendar" style="--mdc-icon-size:var(--icon-lg);color:var(--text-2)"></ha-icon>${cal.message}<span style="color:var(--text-2);font-size:var(--fs-body)">${when}</span></span>` : ''}
        </div>
        <div style="margin-top:var(--space-5);display:flex;gap:var(--space-3);flex-wrap:wrap">${alerts.map(badge).join('')}</div>
        <div style="position:absolute;left:0;right:0;bottom:var(--space-5);text-align:center;font-size:var(--fs-secondary);color:var(--text-2)">Tap anywhere to return</div>`;
        ]]]
    styles:
      card:
      - background: transparent
      - border: none
      - box-shadow: none
      - padding: var(--space-6)
      - height: 100vh
      - cursor: pointer
      grid:
      - grid-template-areas: '"body"'
      - align-content: center
      - justify-items: start
      custom_fields:
        body:
        - width: 100%
