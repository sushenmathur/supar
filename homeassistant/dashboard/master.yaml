        [[[
        const a = entity.attributes;
        if (!a.message || !a.start_time) return 'Next event';
        const start = new Date(String(a.start_time).replace(' ', 'T'));
        const day = new Date(start).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0);
