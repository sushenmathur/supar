type: custom:button-card
entity: script.say_tts_message
icon: mdi:bullhorn
name: Announce
template: glass_action
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Announce
      icon: mdi:bullhorn
      dismissable: true
      size: normal
      content:
        type: vertical-stack
        cards:
          - type: heading
            heading: Speakers
            heading_style: subtitle
            icon: mdi:speaker
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: input_select.announce_speaker
                name: Home speakers
                icon: mdi:speaker-multiple
                show_state: false
                triggers_update: all
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.announce_speaker
                  data:
                    option: Home
                styles:
                  card:
                    - height: 52px
                    - border-radius: 26px
                    - background: "[[[ return states['input_select.announce_speaker']?.state === 'Home' ? 'linear-gradient(135deg, rgba(125,211,252,.75), rgba(129,140,248,.7))' : 'var(--glass-field)'; ]]]"
                    - border: 1px solid var(--glass-border)
                    - box-shadow: inset 0 1px 0 var(--glass-hi)
                  name:
                    - font-weight: 600
                    - font-size: 13px
              - type: custom:button-card
                entity: input_select.announce_speaker
                name: Kitchen
                icon: mdi:silverware-fork-knife
                show_state: false
                triggers_update: all
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.announce_speaker
                  data:
                    option: Kitchen
                styles:
                  card:
                    - height: 52px
                    - border-radius: 26px
                    - background: "[[[ return states['input_select.announce_speaker']?.state === 'Kitchen' ? 'linear-gradient(135deg, rgba(125,211,252,.75), rgba(129,140,248,.7))' : 'var(--glass-field)'; ]]]"
                    - border: 1px solid var(--glass-border)
                    - box-shadow: inset 0 1px 0 var(--glass-hi)
                  name:
                    - font-weight: 600
                    - font-size: 13px
          - type: heading
            heading: Message
            heading_style: subtitle
            icon: mdi:message-text
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_text.announce_message
                name: ' '
          - type: heading
            heading: Volume
            heading_style: subtitle
            icon: mdi:volume-high
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.announce_volume
                name: ' '
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Cancel
                show_icon: false
                tap_action:
                  action: perform-action
                  perform_action: browser_mod.close_popup
                styles:
                  card:
                    - height: 54px
                    - border-radius: 20px
                    - background: var(--glass-field)
                    - border: 1px solid var(--glass-border)
                  name:
                    - font-weight: 700
              - type: custom:button-card
                name: Announce
                icon: mdi:bullhorn
                tap_action:
                  action: perform-action
                  perform_action: browser_mod.sequence
                  data:
                    sequence:
                      - service: script.announce_from_helpers
                      - service: browser_mod.close_popup
                styles:
                  card:
                    - height: 54px
                    - border-radius: 20px
                    - background: linear-gradient(135deg, #7dd3fc, #818cf8)
                    - color: '#0b1020'
                    - border: 0
                  name:
                    - font-weight: 700
                  icon:
                    - width: 20px
