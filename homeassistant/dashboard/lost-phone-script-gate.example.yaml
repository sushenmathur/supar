# Add this as the FIRST step of script.lost_phone (Settings > Automations & Scenes > Scripts > Lost Phone > Edit in YAML).
# The keypad popup calls the script with: passcode, phone ("Sushen" or "Paro") and browser_id.
# If the passcode is wrong the script must fail, so the keypad shows "Access denied".
# Replace the template with however you check the passcode today.
sequence:
  - if:
      - condition: template
        value_template: "{{ passcode | string == states('input_text.lost_phone_passcode') }}"   # <- your check
    then: []
    else:
      - stop: "Access denied"
        error: true
  # ...your existing steps continue here (they only run when the passcode is right)
