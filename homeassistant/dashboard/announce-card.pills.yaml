type: custom:button-card
entity: script.say_tts_message
icon: mdi:bullhorn
name: Announce
template: glass_action
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.sequence
    data:
      sequence:
      - service: input_text.set_value
        data:
          entity_id: input_text.announce_message
          value: ''
      - service: browser_mod.popup
        data:
          title: Announce
          icon: mdi:bullhorn
          dismissable: true
          size: normal
          style:
            .: |
              :host {
                --mdc-dialog-scrim-color: rgba(15, 20, 50, 0.45);
                --popup-background-color: rgba(255, 255, 255, 0.35);
              }
            ha-dialog$: |
              .mdc-dialog__surface {
                background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(220,230,255,.35)) !important;
                backdrop-filter: blur(30px) saturate(190%);
                -webkit-backdrop-filter: blur(30px) saturate(190%);
                border: 1px solid rgba(255,255,255,.7);
              }
          content:
            type: vertical-stack
            cards:
            - type: heading
              heading: Speakers
              heading_style: subtitle
              icon: mdi:speaker
            - type: horizontal-stack
              cards:
              - type: custom:button-card
                entity: input_select.announce_speaker
                name: Home speakers
                icon: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''mdi:check-circle'' : ''mdi:speaker-multiple''; ]]]'
                show_state: false
                triggers_update: all
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.announce_speaker
                  data:
                    option: Home
                styles:
                  card:
                  - height: 52px
                  - border-radius: 26px
                  - background: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''linear-gradient(135deg, #0ea5e9, #6366f1)'' : ''rgba(255,255,255,.32)''; ]]]'
                  - border: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''2px solid #fff'' : ''1px solid rgba(255,255,255,.75)''; ]]]'
                  - box-shadow: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''0 0 0 3px rgba(99,102,241,.35), 0 8px 20px rgba(99,102,241,.5)'' : ''inset 0 1px 0 rgba(255,255,255,.9)''; ]]]'
                  - backdrop-filter: blur(18px)
                  - transform: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''scale(1.03)'' : ''none''; ]]]'
                  - transition: all .2s ease
                  icon:
                  - color: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''#fff'' : ''var(--secondary-text-color)''; ]]]'
                  - width: 22px
                  name:
                  - font-weight: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? 800 : 600; ]]]'
                  - font-size: 13px
                  - color: '[[[ return states[''input_select.announce_speaker'']?.state === ''Home'' ? ''#fff'' : ''var(--secondary-text-color)''; ]]]'
              - type: custom:button-card
                entity: input_select.announce_speaker
                name: Kitchen
                icon: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''mdi:check-circle'' : ''mdi:silverware-fork-knife''; ]]]'
                show_state: false
                triggers_update: all
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.announce_speaker
                  data:
                    option: Kitchen
                styles:
                  card:
                  - height: 52px
                  - border-radius: 26px
                  - background: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''linear-gradient(135deg, #0ea5e9, #6366f1)'' : ''rgba(255,255,255,.32)''; ]]]'
                  - border: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''2px solid #fff'' : ''1px solid rgba(255,255,255,.75)''; ]]]'
                  - box-shadow: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''0 0 0 3px rgba(99,102,241,.35), 0 8px 20px rgba(99,102,241,.5)'' : ''inset 0 1px 0 rgba(255,255,255,.9)''; ]]]'
                  - backdrop-filter: blur(18px)
                  - transform: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''scale(1.03)'' : ''none''; ]]]'
                  - transition: all .2s ease
                  icon:
                  - color: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''#fff'' : ''var(--secondary-text-color)''; ]]]'
                  - width: 22px
                  name:
                  - font-weight: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? 800 : 600; ]]]'
                  - font-size: 13px
                  - color: '[[[ return states[''input_select.announce_speaker'']?.state === ''Kitchen'' ? ''#fff'' : ''var(--secondary-text-color)''; ]]]'
              - type: custom:button-card
                entity: input_select.announce_speaker
                name: Media Room
                icon: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''mdi:check-circle'' : ''mdi:television-speaker''; ]]]'
                show_state: false
                triggers_update: all
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.announce_speaker
                  data:
                    option: Media Room
                styles:
                  card:
                  - height: 52px
                  - border-radius: 26px
                  - background: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''linear-gradient(135deg, #0ea5e9, #6366f1)'' : ''rgba(255,255,255,.32)''; ]]]'
                  - border: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''2px solid #fff'' : ''1px solid rgba(255,255,255,.75)''; ]]]'
                  - box-shadow: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''0 0 0 3px rgba(99,102,241,.35), 0 8px 20px rgba(99,102,241,.5)'' : ''inset 0 1px 0 rgba(255,255,255,.9)''; ]]]'
                  - backdrop-filter: blur(18px)
                  - transform: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''scale(1.03)'' : ''none''; ]]]'
                  - transition: all .2s ease
                  icon:
                  - color: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''#fff'' : ''var(--secondary-text-color)''; ]]]'
                  - width: 22px
                  name:
                  - font-weight: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? 800 : 600; ]]]'
                  - font-size: 13px
                  - color: '[[[ return states[''input_select.announce_speaker'']?.state === ''Media Room'' ? ''#fff'' : ''var(--secondary-text-color)''; ]]]'
            - type: heading
              heading: Message
              heading_style: subtitle
              icon: mdi:message-text
            - type: entities
              show_header_toggle: false
              entities:
              - entity: input_text.announce_message
                name: ' '
              card_mod:
                style: 'ha-card { background: linear-gradient(145deg, rgba(125,211,252,.30), rgba(167,139,250,.24)); border: 1px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 6px 16px rgba(80,90,160,.12); backdrop-filter: blur(18px) saturate(180%); }'
            - type: heading
              heading: Volume
              heading_style: subtitle
              icon: mdi:volume-high
            - type: entities
              show_header_toggle: false
              entities:
              - entity: input_number.announce_volume
                name: ' '
              card_mod:
                style: 'ha-card { background: linear-gradient(145deg, rgba(125,211,252,.30), rgba(167,139,250,.24)); border: 1px solid rgba(255,255,255,.75); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 6px 16px rgba(80,90,160,.12); backdrop-filter: blur(18px) saturate(180%); }'
            - type: horizontal-stack
              cards:
              - type: custom:button-card
                name: Cancel
                tap_action:
                  action: perform-action
                  perform_action: browser_mod.close_popup
                styles:
                  card:
                  - height: 54px
                  - border-radius: 20px
                  - background: linear-gradient(145deg, rgba(125,211,252,.30), rgba(167,139,250,.24))
                  - border: 1px solid rgba(255,255,255,.75)
                  - backdrop-filter: blur(18px)
                  name:
                  - font-weight: 700
                show_icon: false
              - type: custom:button-card
                name: Announce
                tap_action:
                  action: perform-action
                  perform_action: browser_mod.sequence
                  data:
                    sequence:
                    - service: script.announce_from_helpers
                    - service: browser_mod.close_popup
                styles:
                  card:
                  - height: 54px
                  - border-radius: 20px
                  - background: 'linear-gradient(135deg, #7dd3fc, #818cf8)'
                  - border: 1px solid rgba(255,255,255,.75)
                  - backdrop-filter: blur(18px)
                  name:
                  - font-weight: 700
                  icon:
                  - width: 20px
                icon: mdi:bullhorn
