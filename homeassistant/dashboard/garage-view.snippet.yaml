            tap_action:
              action: toggle
              confirmation:
                text: Open or close the boot?
            grid_options:
              columns: 4
              rows: 1
          - type: custom:button-card
            entity: switch.bluey_charge
            name: Charger
            icon: mdi:ev-station
            template: glass_chip
            label: >-
              [[[ return entity.state.charAt(0).toUpperCase() + entity.state.slice(1).replace('_', ' '); ]]]
            tap_action:
              action: toggle
            grid_options:
              columns: 4
              rows: 1
      - type: grid
        cards:
          - type: custom:button-card
            entity: input_number.kia_battery_estimate
            template: glass_vehicle
            variables:
              title: Kia
              image: /api/image/serve/b0801eee9b5f2d6fcf7972d71f0d7711
              battery: input_number.kia_battery_estimate
              tracker: device_tracker.kia_gps_location
