            grid_options:
              columns: 12
              rows: 5
          - type: custom:button-card
            entity: sensor.kia_charger_power
            name: Charge Power
            icon: mdi:flash
            template: glass_chip
            label: >-
              [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            entity: sensor.kia_last_charge_added
            name: Last Charge
            icon: mdi:lightning-bolt
            template: glass_chip
            label: >-
              [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            entity: switch.kia_charger
