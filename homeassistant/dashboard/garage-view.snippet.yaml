# 1) Add this template under `button_card_templates:` (2-space indent, next to the other glass_* templates).
  glass_vehicle:
    section_mode: true
    show_icon: false
    show_name: false
    show_state: false
    triggers_update: all
    tap_action:
      action: more-info
    variables:
      title: ''
      image: ''
      battery: ''
      tracker: ''
      onroad: ''
      charging: false
    custom_fields:
      body: |
        [[[
          const pct = parseFloat(states[variables.battery]?.state);
          const has = !isNaN(pct);
          const col = !has ? 'var(--divider-color)' : pct < 20 ? '#ef4444' : pct < 50 ? '#f59e0b' : '#10b981';
          const loc = states[variables.tracker]?.state;
          const place = !loc || loc === 'unknown' || loc === 'unavailable' ? 'Unknown'
            : loc === 'home' ? 'Home' : loc === 'not_home' ? 'Away' : loc;
          const driving = states[variables.onroad]?.state === 'on';
          const charging = variables.charging === true || variables.charging === 'true';
          const pill = (icon, text, c) => `<div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:var(--glass-field);font-size:12px;font-weight:600;color:${c || 'var(--primary-text-color)'}"><ha-icon icon="${icon}" style="--mdc-icon-size:16px"></ha-icon>${text}</div>`;
          return `<div style="width:100%;text-align:center">
            <div style="font-size:20px;font-weight:700;letter-spacing:-.01em">${variables.title}</div>
            <div style="height:120px;display:flex;align-items:center;justify-content:center;margin:6px 0">
              <img src="${variables.image}" style="max-height:120px;max-width:90%;object-fit:contain">
            </div>
            <div style="display:flex;justify-content:center;gap:8px;margin-bottom:12px">
              ${pill('mdi:map-marker', place)}${pill(driving ? 'mdi:car' : 'mdi:car-brake-parking', driving ? 'Driving' : 'Parked', driving ? 'var(--glass-ok)' : '')}
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <div style="flex:1;height:14px;border-radius:7px;background:rgba(var(--rgb-primary-text-color),0.12);overflow:hidden">
                <i style="display:block;height:100%;width:${has ? Math.max(0, Math.min(100, pct)) : 0}%;background:${col};border-radius:7px"></i>
              </div>
              <div style="font-size:15px;font-weight:700;min-width:44px;text-align:right">${has ? Math.round(pct) + '%' : '—'}</div>
            </div>
            <div style="margin-top:6px;font-size:12px;font-weight:600;color:${charging ? 'var(--glass-ok)' : 'var(--secondary-text-color)'}">${charging ? '⚡ Charging' : 'Not charging'}</div>
          </div>`;
        ]]]
    styles:
      card:
        - height: 100%
        - border-radius: 28px
        - padding: 16px 18px
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - width: 100%

# 2) Replace the whole `path: garage` view under `views:` with this (2-space indent list item):
  - header:
      card:
        cards:
          - content: '# Garage'
            text_only: true
            type: markdown
          - alignment: center
            chips:
              - entity: binary_sensor.garage_door_sensor_contact
                type: entity
              - entity: binary_sensor.hallwaydoorsensor_contact
                type: entity
              - content_info: state
                entity: binary_sensor.garagemotionsensor_occupancy
                type: entity
              - entity: sensor.garagemotionsensor_device_temperature
                type: entity
            type: custom:mushroom-chips-card
        type: vertical-stack
      layout: center
    icon: mdi:garage-lock
    max_columns: 3
    path: garage
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.bluey_battery_level
            template: glass_vehicle
            variables:
              title: Bluey
              image: /api/image/serve/cdd510be49f2493bc87fd540c01cea69
              battery: sensor.bluey_battery_level
              tracker: device_tracker.bluey_location
              onroad: input_boolean.tesla_onroad
              charging: '[[[ return states["sensor.bluey_charging"]?.state === "Charging"; ]]]'
            grid_options:
              columns: 12
              rows: 5
          - type: custom:button-card
            entity: sensor.bluey_battery_range
            name: Range
            icon: mdi:gauge
            template: glass_chip
            label: >-
              [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
            grid_options:
              columns: 6
              rows: 1
          - type: custom:button-card
            entity: sensor.bluey_charge_energy_added
            name: Last Charge
            icon: mdi:lightning-bolt
            template: glass_chip
            label: >-
              [[[ return entity.state + (entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : ''); ]]]
