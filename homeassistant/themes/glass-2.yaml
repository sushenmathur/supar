# Quiet Glass: calm, flat content cards; glass only on layered surfaces (navbar, pop-ups, scrim).
# Follows the device light/dark mode. Every colour, radius, size, shadow and duration used by
# dashboard/master.yaml lives here as a CSS variable. master.yaml contains no hex / rgba literals.
#
# Install: copy to /config/themes/glass-2.yaml (configuration.yaml needs
#   frontend:
#     themes: !include_dir_merge_named themes
# ), Developer tools > YAML > "Reload themes", then profile: Theme "Glass", Dark mode "Auto".
# Fonts: see README (Inter is loaded by www/quiet-glass-fonts.js; falls back to system-ui).
#
# Two themes are defined: "Glass 2" (day/night, follows system) and "Glass 2 Saver" (always near-black,
# used only by the screensaver view).

Glass 2:
  # ------------------------------------------------------------------ tokens (both modes)
  # Spacing
  space-1: 4px
  space-2: 8px
  space-3: 12px
  space-4: 16px
  space-5: 24px
  space-6: 32px
  # Radius: two values, plus pill
  radius-sm: 14px
  radius-lg: 24px
  radius-pill: 999px
  # Type: one family, six sizes, three weights
  font-sans: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  fs-caption: 12px
  fs-secondary: 14px
  fs-body: 16px
  fs-title: 20px
  fs-hero: 28px
  fs-clock: 72px
  fw-regular: 400
  fw-medium: 500
  fw-semibold: 600
  lh-tight: 1.15
  lh-body: 1.35
  # Component sizes
  tap: 48px
  topbar: 88px
  disc: 40px
  dot: 10px
  bar: 8px
  icon-sm: 20px
  icon-md: 24px
  icon-lg: 28px
  ring-size: 6px
  popup-width: 560px
  saver-scale: 2.6
  opacity-dim: 0.55
  # Motion: nothing slower than 300ms. The pulse is the one looping animation (active alerts only).
  dur-fast: 150ms
  dur-base: 220ms
  dur-pulse: 2400ms
  ease: ease-out

  # ------------------------------------------------------------------ Home Assistant mapping
  primary-font-family: var(--font-sans)
  paper-font-body1_-_font-family: var(--font-sans)
  paper-font-common-base_-_font-family: var(--font-sans)
  ha-font-family-body: var(--font-sans)
  ha-font-family-heading: var(--font-sans)
  mdc-typography-font-family: var(--font-sans)
  primary-text-color: var(--text-1)
  secondary-text-color: var(--text-2)
  disabled-text-color: var(--text-2)
  divider-color: var(--hairline)
  card-background-color: var(--surface-1)
  secondary-background-color: var(--surface-2)
  ha-card-background: var(--surface-1)
  ha-card-border-radius: var(--radius-lg)
  ha-card-border-width: 1px
  ha-card-border-color: var(--hairline)
  ha-card-box-shadow: var(--shadow-card)
  state-icon-color: var(--text-2)
  state-icon-active-color: var(--state-on-ink)
  state-active-color: var(--state-on-ink)
  state-light-active-color: var(--state-on-ink)
  state-switch-active-color: var(--state-on-ink)
  state-lock-unlocked-color: var(--state-alert-ink)
  state-cover-open-color: var(--state-warn-ink)
  # sections view geometry (tune here if the Home view scrolls; see README)
  ha-view-sections-column-gap: var(--space-4)
  ha-view-sections-row-gap: var(--space-2)
  # dialogs / pop-ups (browser_mod passes the same variables per pop-up)
  popup-border-radius: var(--radius-lg)
  popup-padding-x: var(--space-5)
  popup-padding-y: var(--space-4)
  popup-background-color: var(--popup-bg)
  ha-dialog-surface-background: var(--popup-bg)
  ha-dialog-surface-backdrop-filter: var(--glass-blur)
  ha-dialog-scrim-backdrop-filter: none
  ha-dialog-border-radius: var(--radius-lg)
  mdc-dialog-scrim-color: var(--scrim)
  dialog-backdrop-filter: none
  # HA chrome (toolbar, sidebar) follows the theme too
  app-header-background-color: var(--surface-1)
  app-header-text-color: var(--text-1)
  app-header-border-bottom: 1px solid var(--hairline)
  sidebar-background-color: var(--surface-1)
  sidebar-text-color: var(--text-1)
  sidebar-icon-color: var(--text-2)
  sidebar-selected-background-color: var(--surface-2)
  sidebar-selected-text-color: var(--text-1)
  sidebar-selected-icon-color: var(--accent)
  lovelace-background: var(--surface-0)

  modes:
    light:
      primary-color: "#1f4fd1"
      accent-color: "#1f4fd1"
      text-primary-color: "#ffffff"
      rgb-primary-text-color: "15,23,42"
      rgb-card-background-color: "255,255,255"
      # colour
      surface-0: "linear-gradient(160deg, #f3f5fa 0%, #e6ebf5 100%)"
      surface-1: "#ffffff"
      surface-2: "#e9edf5"
      text-1: "#0f172a"
      text-2: "#475569"
      hairline: "rgba(15, 23, 42, 0.10)"
      accent: "#1f4fd1"
      on-accent: "#ffffff"
      # semantic state colours. "ink" = readable on surfaces and tints; plain = fill / large glyph.
      state-on: "#f5a524"
      state-on-ink: "#8a4a00"
      state-on-tint: "color-mix(in srgb, var(--state-on) 18%, var(--surface-1))"
      state-alert: "#c4182f"
      state-alert-ink: "#b4132a"
      state-alert-tint: "color-mix(in srgb, var(--state-alert) 12%, var(--surface-1))"
      on-alert: "#ffffff"
      state-warn: "#c2570c"
      state-warn-ink: "#9a3f00"
      state-warn-tint: "color-mix(in srgb, var(--state-warn) 14%, var(--surface-1))"
      state-ok: "#15803d"
      state-ok-ink: "#136c34"
      state-ok-tint: "color-mix(in srgb, var(--state-ok) 12%, var(--surface-1))"
      # elevation
      shadow-card: "0 4px 14px rgba(15, 23, 42, 0.08)"
      shadow-pop: "0 24px 48px rgba(15, 23, 42, 0.22)"
      # glass (navbar, pop-ups, scrim only)
      glass-bg: "rgba(255, 255, 255, 0.72)"
      glass-border: "rgba(15, 23, 42, 0.08)"
      glass-blur: "blur(24px) saturate(140%)"
      popup-bg: "rgba(255, 255, 255, 0.82)"
      scrim: "rgba(15, 23, 42, 0.40)"
    dark:
      primary-color: "#9ab4ee"
      accent-color: "#9ab4ee"
      text-primary-color: "#0b0f17"
      rgb-primary-text-color: "244,246,251"
      rgb-card-background-color: "22,28,40"
      surface-0: "linear-gradient(160deg, #0b0f17 0%, #121826 100%)"
      surface-1: "#161c28"
      surface-2: "#212a3b"
      text-1: "#f4f6fb"
      text-2: "#a9b4c7"
      hairline: "rgba(255, 255, 255, 0.10)"
      accent: "#9ab4ee"
      on-accent: "#0b0f17"
      state-on: "#f2b84b"
      state-on-ink: "#ffd27a"
      state-on-tint: "color-mix(in srgb, var(--state-on) 16%, var(--surface-1))"
      state-alert: "#d02a42"
      state-alert-ink: "#ff9aa6"
      state-alert-tint: "color-mix(in srgb, var(--state-alert) 22%, var(--surface-1))"
      on-alert: "#ffffff"
      state-warn: "#f0a24a"
      state-warn-ink: "#ffc27a"
      state-warn-tint: "color-mix(in srgb, var(--state-warn) 16%, var(--surface-1))"
      state-ok: "#3dbb7a"
      state-ok-ink: "#7fe0aa"
      state-ok-tint: "color-mix(in srgb, var(--state-ok) 14%, var(--surface-1))"
      shadow-card: "0 4px 14px rgba(0, 0, 0, 0.35)"
      shadow-pop: "0 24px 48px rgba(0, 0, 0, 0.55)"
      glass-bg: "rgba(22, 28, 40, 0.72)"
      glass-border: "rgba(255, 255, 255, 0.10)"
      glass-blur: "blur(24px) saturate(120%)"
      popup-bg: "rgba(22, 28, 40, 0.84)"
      scrim: "rgba(0, 0, 0, 0.60)"

# Screensaver: always near-black, low luminance, regardless of the system mode.
Glass 2 Saver:
  space-1: 4px
  space-2: 8px
  space-3: 12px
  space-4: 16px
  space-5: 24px
  space-6: 32px
  radius-sm: 14px
  radius-lg: 24px
  radius-pill: 999px
  font-sans: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  fs-caption: 12px
  fs-secondary: 14px
  fs-body: 16px
  fs-title: 20px
  fs-hero: 28px
  fs-clock: 72px
  fw-regular: 400
  fw-medium: 500
  fw-semibold: 600
  lh-tight: 1.15
  lh-body: 1.35
  tap: 48px
  topbar: 88px
  disc: 40px
  dot: 10px
  bar: 8px
  icon-sm: 20px
  icon-md: 24px
  icon-lg: 28px
  ring-size: 6px
  popup-width: 560px
  saver-scale: 2.6
  opacity-dim: 0.55
  dur-fast: 150ms
  dur-base: 220ms
  dur-pulse: 2400ms
  ease: ease-out
  primary-font-family: var(--font-sans)
  primary-color: "#9ab4ee"
  accent-color: "#9ab4ee"
  text-primary-color: "#05070b"
  primary-text-color: var(--text-1)
  secondary-text-color: var(--text-2)
  rgb-primary-text-color: "168,178,196"
  divider-color: var(--hairline)
  card-background-color: var(--surface-1)
  ha-card-background: var(--surface-1)
  ha-card-border-radius: var(--radius-lg)
  ha-card-border-width: 0px
  ha-card-box-shadow: none
  lovelace-background: var(--surface-0)
  surface-0: "#05070b"
  surface-1: "#0b0f17"
  surface-2: "#121826"
  text-1: "#a8b2c4"
  text-2: "#8591a6"
  hairline: "rgba(255, 255, 255, 0.08)"
  accent: "#9ab4ee"
  on-accent: "#05070b"
  state-on: "#c9993f"
  state-on-ink: "#e6bf75"
  state-on-tint: "color-mix(in srgb, var(--state-on) 12%, var(--surface-1))"
  state-alert: "#b02a3c"
  state-alert-ink: "#ff9aa6"
  state-alert-tint: "color-mix(in srgb, var(--state-alert) 22%, var(--surface-1))"
  on-alert: "#ffffff"
  state-warn: "#c98a42"
  state-warn-ink: "#e6b27a"
  state-warn-tint: "color-mix(in srgb, var(--state-warn) 14%, var(--surface-1))"
  state-ok: "#3a9a68"
  state-ok-ink: "#7fcfa5"
  state-ok-tint: "color-mix(in srgb, var(--state-ok) 12%, var(--surface-1))"
  shadow-card: "none"
