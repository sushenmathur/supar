# Glass theme: frosted-glass cards that follow the system light/dark mode.
# Needs card-mod (HACS). Copy to /config/themes/glass.yaml, make sure configuration.yaml has
#   frontend:
#     themes: !include_dir_merge_named themes
# then Developer tools > YAML > "Reload themes" and pick "Glass" in your profile
# (Theme: Glass, Dark mode: Auto) so it follows the device setting.
#
# The wallpaper is NOT set here. Your view keeps its own background image, so the glass blurs
# whatever the system/background provides. The gradients below are only a fallback.
Glass:
  # ---- shared (both modes) ----
  primary-color: "#5b8cff"
  accent-color: "#a78bfa"
  state-icon-active-color: "#fbbf24"
  ha-card-border-radius: 28px
  ha-card-border-width: 0px
  ha-card-box-shadow: none
  ha-card-background: transparent
  # browser_mod popups read these variables
  popup-border-radius: 32px
  popup-padding-x: 28px
  popup-padding-y: 24px
  # dialog / popup surfaces (browser_mod + more-info), old and new HA dialog implementations
  mdc-dialog-scrim-color: "rgba(15,20,50,0.45)"
  dialog-backdrop-filter: "blur(10px)"
  ha-dialog-scrim-backdrop-filter: "blur(10px)"
  ha-dialog-surface-backdrop-filter: "blur(30px) saturate(190%)"

  # Applies to every card (ha-card). Inline styles from button-card templates win over these
  # because the rules below are not !important.
  card-mod-theme: Glass
  card-mod-card: |
    ha-card {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(22px) saturate(200%) brightness(1.04);
      backdrop-filter: blur(22px) saturate(200%) brightness(1.04);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

  modes:
    light:
      primary-text-color: "#14203a"
      secondary-text-color: "rgba(20,32,58,0.62)"
      text-primary-color: "#14203a"
      rgb-primary-text-color: "20,32,58"
      divider-color: "rgba(20,32,58,0.12)"
      glass-bg: "radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,0.40), transparent 55%), linear-gradient(145deg, rgba(255,255,255,0.50), rgba(255,255,255,0.20))"
      glass-bg-soft: "rgba(255,255,255,0.34)"
      glass-border: "rgba(255,255,255,0.70)"
      glass-hi: "rgba(255,255,255,0.95)"
      glass-shadow: "inset 0 1.5px 1px -1px rgba(255,255,255,0.95), inset 1.5px 0 1px -1px rgba(255,255,255,0.55), inset 0 -1.5px 1px -1px rgba(255,255,255,0.30), inset 0 10px 22px -12px rgba(255,255,255,0.35), 0 14px 32px rgba(50,60,120,0.20)"
      glass-field: "rgba(255,255,255,0.55)"
      glass-on-bg: "linear-gradient(145deg, rgba(255,222,140,0.95), rgba(255,170,70,0.75))"
      glass-on-glow: "0 0 34px rgba(255,170,60,0.5)"
      glass-ok: "#15803d"
      glass-bad: "#be123c"
      glass-link: "#1d4ed8"
      popup-background-color: "rgba(255,255,255,0.86)"
      ha-dialog-surface-background: "rgba(236,242,255,0.62)"
      glass-popup-fill: "rgba(236,242,255,0.62)"
      lovelace-background: "radial-gradient(900px 640px at 6% 8%, rgba(255,150,130,0.80), transparent 62%), radial-gradient(820px 600px at 60% 12%, rgba(90,200,250,0.75), transparent 62%), radial-gradient(760px 620px at 98% 70%, rgba(179,136,255,0.75), transparent 62%), radial-gradient(700px 520px at 12% 98%, rgba(255,211,110,0.70), transparent 62%), linear-gradient(160deg, #eef3ff, #e6ecfa)"
      # ---- added: shared popup, chip, accent, alert and level colours ----
      glass-popup-bg: "linear-gradient(145deg, rgba(255,255,255,0.72), rgba(214,226,255,0.50))"
      glass-popup-border: "rgba(255,255,255,0.80)"
      glass-popup-scrim: "rgba(15,20,50,0.45)"
      glass-chip-blue: "linear-gradient(145deg, rgba(125,211,252,0.30), rgba(167,139,250,0.24))"
      glass-accent: "linear-gradient(135deg, #7dd3fc, #818cf8)"
      glass-alert-high: "linear-gradient(135deg, rgba(244,63,94,0.92), rgba(190,18,60,0.88))"
      glass-alert-mid: "linear-gradient(135deg, rgba(245,158,11,0.92), rgba(217,119,6,0.88))"
      glass-alert-low: "linear-gradient(135deg, rgba(71,85,105,0.92), rgba(51,65,85,0.90))"
      glass-robbie: "#2dd4bf"
      glass-level-ok: "#10b981"
      glass-level-warn: "#f59e0b"
      glass-level-low: "#ef4444"
    dark:
      primary-text-color: "#ffffff"
      secondary-text-color: "rgba(255,255,255,0.62)"
      text-primary-color: "#ffffff"
      rgb-primary-text-color: "255,255,255"
      divider-color: "rgba(255,255,255,0.14)"
      glass-bg: "radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,0.20), transparent 55%), linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.04))"
      glass-bg-soft: "rgba(255,255,255,0.09)"
      glass-border: "rgba(255,255,255,0.26)"
      glass-hi: "rgba(255,255,255,0.45)"
      glass-shadow: "inset 0 1.5px 1px -1px rgba(255,255,255,0.50), inset 1.5px 0 1px -1px rgba(255,255,255,0.26), inset 0 -1.5px 1px -1px rgba(255,255,255,0.10), inset 0 10px 22px -12px rgba(255,255,255,0.12), 0 18px 40px rgba(0,0,0,0.42)"
      glass-field: "rgba(255,255,255,0.10)"
      glass-on-bg: "linear-gradient(145deg, rgba(255,214,102,0.55), rgba(255,150,60,0.35))"
      glass-on-glow: "0 0 36px rgba(255,180,60,0.45)"
      glass-ok: "#6ee7b7"
      glass-bad: "#fb7185"
      glass-link: "#bae6fd"
      popup-background-color: "rgba(24,30,58,0.88)"
      ha-dialog-surface-background: "rgba(30,38,78,0.62)"
      glass-popup-fill: "rgba(30,38,78,0.62)"
      lovelace-background: "radial-gradient(900px 640px at 6% 8%, rgba(91,61,245,0.55), transparent 62%), radial-gradient(820px 600px at 60% 12%, rgba(10,167,160,0.45), transparent 62%), radial-gradient(760px 620px at 98% 70%, rgba(192,38,211,0.45), transparent 62%), radial-gradient(700px 520px at 12% 98%, rgba(30,64,175,0.50), transparent 62%), linear-gradient(160deg, #080d1e, #0f1730 55%, #0a1a26)"
      # ---- added: shared popup, chip, accent, alert and level colours ----
      glass-popup-bg: "linear-gradient(145deg, rgba(52,62,118,0.80), rgba(18,24,56,0.74))"
      glass-popup-border: "rgba(255,255,255,0.22)"
      glass-popup-scrim: "rgba(0,0,0,0.55)"
      glass-chip-blue: "linear-gradient(145deg, rgba(125,211,252,0.22), rgba(167,139,250,0.18))"
      glass-accent: "linear-gradient(135deg, #7dd3fc, #818cf8)"
      glass-alert-high: "linear-gradient(135deg, rgba(244,63,94,0.92), rgba(190,18,60,0.88))"
      glass-alert-mid: "linear-gradient(135deg, rgba(245,158,11,0.92), rgba(217,119,6,0.88))"
      glass-alert-low: "linear-gradient(135deg, rgba(71,85,105,0.92), rgba(51,65,85,0.90))"
      glass-robbie: "#2dd4bf"
      glass-level-ok: "#10b981"
      glass-level-warn: "#f59e0b"
      glass-level-low: "#ef4444"
