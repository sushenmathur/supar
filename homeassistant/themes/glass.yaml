# Glass theme: frosted-glass cards that follow the system light/dark mode.
# Needs card-mod (HACS). Copy to /config/themes/glass.yaml, make sure configuration.yaml has
#   frontend:
#     themes: !include_dir_merge_named themes
# then Developer tools > YAML > "Reload themes" and pick "Glass" in your profile
# (Theme: Glass, Dark mode: Auto) so it follows the device setting.
#
# The wallpaper is NOT set here. Your view keeps its own background image, so the glass blurs
# whatever the system/background provides. The gradients below are only a fallback.
Glass:
  # ---- shared (both modes) ----
  primary-color: "#5b8cff"
  accent-color: "#a78bfa"
  state-icon-active-color: "#fbbf24"
  ha-card-border-radius: 28px
  ha-card-border-width: 0px
  ha-card-box-shadow: none
  ha-card-background: transparent
  # browser_mod popups read these variables
  popup-border-radius: 32px
  popup-padding-x: 28px
  popup-padding-y: 24px

  # Applies to every card (ha-card). Inline styles from button-card templates win over these
  # because the rules below are not !important.
  card-mod-theme: Glass
  card-mod-card: |
    ha-card {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(34px) saturate(190%);
      backdrop-filter: blur(34px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
    }

  modes:
    light:
      primary-text-color: "#14203a"
      secondary-text-color: "rgba(20,32,58,0.62)"
      text-primary-color: "#14203a"
      rgb-primary-text-color: "20,32,58"
      divider-color: "rgba(20,32,58,0.12)"
      glass-bg: "linear-gradient(145deg, rgba(255,255,255,0.72), rgba(255,255,255,0.34))"
      glass-bg-soft: "rgba(255,255,255,0.45)"
      glass-border: "rgba(255,255,255,0.85)"
      glass-hi: "rgba(255,255,255,0.9)"
      glass-shadow: "0 16px 40px rgba(60,70,130,0.22)"
      glass-field: "rgba(255,255,255,0.55)"
      glass-on-bg: "linear-gradient(145deg, rgba(255,222,140,0.95), rgba(255,170,70,0.75))"
      glass-on-glow: "0 0 34px rgba(255,170,60,0.5)"
      glass-ok: "#15803d"
      glass-bad: "#be123c"
      glass-link: "#1d4ed8"
      popup-background-color: "rgba(255,255,255,0.86)"
      lovelace-background: "radial-gradient(700px 520px at 10% 8%, rgba(255,190,150,0.65), transparent 70%), radial-gradient(640px 500px at 62% 30%, rgba(150,200,255,0.6), transparent 70%), radial-gradient(620px 480px at 96% 10%, rgba(200,170,255,0.6), transparent 70%), linear-gradient(160deg, #eef2fb, #e4eaf7)"
    dark:
      primary-text-color: "#ffffff"
      secondary-text-color: "rgba(255,255,255,0.62)"
      text-primary-color: "#ffffff"
      rgb-primary-text-color: "255,255,255"
      divider-color: "rgba(255,255,255,0.14)"
      glass-bg: "linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04))"
      glass-bg-soft: "rgba(255,255,255,0.08)"
      glass-border: "rgba(255,255,255,0.22)"
      glass-hi: "rgba(255,255,255,0.35)"
      glass-shadow: "0 18px 44px rgba(0,0,0,0.38)"
      glass-field: "rgba(255,255,255,0.10)"
      glass-on-bg: "linear-gradient(145deg, rgba(255,214,102,0.55), rgba(255,150,60,0.35))"
      glass-on-glow: "0 0 36px rgba(255,180,60,0.45)"
      glass-ok: "#6ee7b7"
      glass-bad: "#fb7185"
      glass-link: "#bae6fd"
      popup-background-color: "rgba(24,30,58,0.88)"
      lovelace-background: "radial-gradient(620px 480px at 12% 8%, rgba(80,110,255,0.35), transparent 70%), radial-gradient(560px 440px at 62% 30%, rgba(40,200,190,0.25), transparent 70%), radial-gradient(560px 440px at 96% 12%, rgba(150,90,255,0.28), transparent 70%), linear-gradient(160deg, #0b1020, #10182f 50%, #0a1a26)"
