type: custom:button-card
card_mod:
  style: ':host { flex: 1.6 1 0 !important; }'
triggers_update:
- sensor.time
- weather.north_lakes_weather
show_icon: false
show_name: false
show_state: false
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Brisbane
      icon: mdi:weather-partly-cloudy
      dismissable: true
      size: normal
      content:
        type: vertical-stack
        cards:
        - type: custom:clock-weather-card
          entity: weather.north_lakes_weather
          name: Brisbane
          sun_entity: sun.sun
          date_pattern: ccc, d MMM yyyy
          forecast_rows: 5
          show_humidity: true
          use_browser_time: true
          weather_icon_type: fill
        - type: horizontal-stack
          cards:
          - type: custom:button-card
            template: glass_info_pill
            variables:
              kind: sunrise
              icon_name: mdi:weather-sunset-up
            triggers_update:
            - sun.sun
          - type: custom:button-card
            template: glass_info_pill
            variables:
              kind: sunset
              icon_name: mdi:weather-sunset-down
            triggers_update:
            - sun.sun
          - type: custom:button-card
            template: glass_info_pill
            variables:
              kind: wind
              icon_name: mdi:weather-windy
            triggers_update:
            - weather.north_lakes_weather
        - type: horizontal-stack
          cards:
          - type: custom:button-card
            name: India
            template: world_clock
            variables:
              daytime: binary_sensor.hyd_daytime
              tz: Asia/Kolkata
          - type: custom:button-card
            name: Austin
            template: world_clock
            variables:
              daytime: binary_sensor.austin_daytime
              tz: America/Chicago
custom_fields:
  body: |
    [[[
      const tz = { timeZone: 'Australia/Brisbane' };
      const d = new Date();
      const h = parseInt(d.toLocaleTimeString('en-AU', { ...tz, hour: 'numeric', hour12: false })) % 24;
      const hello = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
      const dayNum = parseInt(d.toLocaleDateString('en-AU', { ...tz, day: 'numeric' }));
      const ord = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
      const month = d.toLocaleDateString('en-AU', { ...tz, month: 'long' });
      const clock = (zone, up) => {
        const t = d.toLocaleTimeString('en-AU', { timeZone: zone, hour: 'numeric', minute: '2-digit', hour12: true });
        return up ? t.replace(/\s?([ap])m$/i, (x, y) => ' ' + y.toUpperCase() + 'M') : t;
      };
      const w = states['weather.north_lakes_weather'];
      const cond = w ? w.state : '';
      const names = { 'clear-night': 'Clear Night', cloudy: 'Cloudy', exceptional: 'Exceptional', fog: 'Fog', hail: 'Hail', lightning: 'Lightning',
        'lightning-rainy': 'Thunderstorms', partlycloudy: 'Partly Cloudy', pouring: 'Pouring', rainy: 'Rainy', snowy: 'Snowy',
        'snowy-rainy': 'Sleet', sunny: 'Sunny', windy: 'Windy', 'windy-variant': 'Windy' };
      const condText = names[cond] || (cond && cond !== 'unavailable' && cond !== 'unknown' ? cond.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '');
      const t = parseFloat(w?.attributes?.temperature);
      const icons = { sunny: ['weather-sunny', '#ffc53d'], 'clear-night': ['weather-night', '#a5b4fc'], partlycloudy: ['weather-partly-cloudy', '#ffc53d'],
        cloudy: ['weather-cloudy', '#94a3b8'], rainy: ['weather-rainy', '#60a5fa'], pouring: ['weather-pouring', '#3b82f6'],
        lightning: ['weather-lightning', '#fbbf24'], 'lightning-rainy': ['weather-lightning-rainy', '#a78bfa'], snowy: ['weather-snowy', '#7dd3fc'],
        fog: ['weather-fog', '#94a3b8'], hail: ['weather-hail', '#7dd3fc'], windy: ['weather-windy', '#5eead4'] };
      const [wi, wc] = icons[cond] || ['weather-cloudy', '#94a3b8'];
      const pill = s => `<span style="display:inline-flex;padding:5px 11px;border-radius:99px;background:rgba(var(--rgb-primary-text-color),0.07);font-size:13px;font-weight:600;white-space:nowrap">${s}</span>`;
      return `<div style="display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:16px;width:100%;text-align:left">
        <div>
          <div style="font-size:12.5px;font-weight:600;color:var(--secondary-text-color);white-space:nowrap">${hello} · ${ord(dayNum)} ${month}${condText ? ' · ' + condText : ''}</div>
          <div style="font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:4px;white-space:nowrap">${clock('Australia/Brisbane', true)}</div>
        </div>
        <div style="display:grid;gap:6px;justify-items:end">
          <div style="display:flex;align-items:center;gap:8px">
            <ha-icon icon="mdi:${wi}" style="display:block;width:32px;height:32px;--mdc-icon-size:32px;color:${wc}"></ha-icon>
            <b style="font-size:26px;letter-spacing:-.02em">${isNaN(t) ? '–' : Math.round(t)}°</b>
          </div>
          <div style="display:flex;gap:6px">${pill('India ' + clock('Asia/Kolkata'))}${pill('Austin ' + clock('America/Chicago'))}</div>
        </div></div>`;
    ]]]
styles:
  card:
  - height: 112px
  - border-radius: 28px
  - padding: 0 24px
  grid:
  - grid-template-areas: '"body"'
  custom_fields:
    body:
    - width: 100%
