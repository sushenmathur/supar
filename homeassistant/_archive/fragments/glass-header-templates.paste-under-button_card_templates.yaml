  glass_person_pill:
    section_mode: true
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: more-info
    custom_fields:
      body: |
        [[[
          const place = {
            home: 'Home', not_home: 'Away', 'Sushen - Work': 'Office',
            'Paro - Work': 'Work', Gym: 'Gym'
          }[entity.state] || entity.state;
          const batt = parseFloat(states[variables.battery]?.state);
          const first = String(entity.attributes.friendly_name || '').split(' ')[0];
          const pic = entity.attributes.entity_picture
            ? `<img src="${entity.attributes.entity_picture}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--glass-hi);flex:none">`
            : `<div style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--primary-color);color:#fff;flex:none">${first[0] || '?'}</div>`;
          return `<div style="display:flex;align-items:center;gap:10px;width:100%;text-align:left">${pic}
            <b style="font-size:14px;white-space:nowrap">${first}</b>
            <span style="font-size:12px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${place}</span>
            <b style="margin-left:auto;font-size:12px;color:${batt > 20 ? 'var(--glass-ok)' : 'var(--glass-bad)'}">${isNaN(batt) ? '' : Math.round(batt) + '%'}</b></div>`;
        ]]]
    styles:
      card:
        - height: 52px
        - border-radius: 22px
        - padding: 0 14px
        - background: var(--glass-bg)
        - border: 1px solid var(--glass-border)
        - box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"body"'
      custom_fields:
        body:
          - width: 100%
    variables:
      battery: ''
  glass_info_pill:
    section_mode: true
    show_state: false
    show_label: false
    variables:
      kind: sunrise
      icon_name: mdi:information-outline
    icon: '[[[ return variables.icon_name; ]]]'
    name: |
      [[[
        const fmt = iso => iso ? new Date(iso).toLocaleTimeString('en-AU', { timeZone: 'Australia/Brisbane', hour: 'numeric', minute: '2-digit', hour12: false }) : '–';
        if (variables.kind === 'sunrise') return 'Sunrise ' + fmt(states['sun.sun']?.attributes?.next_rising);
        if (variables.kind === 'sunset') return 'Sunset ' + fmt(states['sun.sun']?.attributes?.next_setting);
        const a = states['weather.north_lakes_weather']?.attributes || {};
        return a.wind_speed !== undefined ? 'Wind ' + Math.round(a.wind_speed) + ' ' + (a.wind_speed_unit || 'km/h') : 'Wind –';
      ]]]
    styles:
      card:
        - height: 40px
        - border-radius: 20px
        - padding: 0 14px
        - background: var(--glass-bg-soft)
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 22px 1fr
        - column-gap: 8px
      icon:
        - width: 18px
        - color: var(--primary-text-color)
      name:
        - justify-self: start
        - font-size: 13px
        - font-weight: 600
        - color: var(--primary-text-color)
