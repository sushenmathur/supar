  glass_chip:
    section_mode: true
    show_state: false
    show_label: true
    extra_styles: |
      .mq {
        overflow: hidden; min-width: 0; flex: 1;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6px, #000 calc(100% - 10px), transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 6px, #000 calc(100% - 10px), transparent 100%);
      }
      .run { display: inline-flex; animation: tick 9s linear infinite; }
      .run span { padding-right: 28px; }
      @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      @media (prefers-reduced-motion: reduce) {
        .run { animation: none; }
        .run span + span { display: none; }
      }
    styles:
      card:
        - height: 100%
        - border-radius: 22px
        - padding: 0 14px
        - background: >
            [[[ return variables.hot ? 'linear-gradient(145deg,
            rgba(255,120,150,0.4), rgba(255,80,120,0.15))' :
            'var(--glass-bg-soft)'; ]]]
        - border: 1px solid var(--glass-border)
        - box-shadow: inset 0 1px 0 var(--glass-hi)
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 30px minmax(0, 1fr)
        - column-gap: 11px
      icon:
        - width: 22px
        - color: >
            [[[ return variables.hot ? 'var(--glass-bad)' :
            'var(--primary-text-color)'; ]]]
      name:
        - justify-self: stretch
        - align-self: end
        - min-width: 0
        - overflow: hidden
        - display: flex
        - align-items: center
        - white-space: nowrap
        - text-align: left
        - font-size: 14px
        - font-weight: 700
        - color: var(--primary-text-color)
      label:
        - justify-self: stretch
        - align-self: start
        - min-width: 0
        - overflow: hidden
        - display: flex
        - align-items: center
        - white-space: nowrap
        - text-align: left
        - font-size: 12px
        - color: var(--secondary-text-color)
    variables:
      hot: false
